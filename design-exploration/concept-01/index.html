<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>pitaka — Tahimik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       01. DESIGN TOKENS — TAHIMIK ("money, quietly")
       Swiss / International typographic restraint. One hairline at a time.
       ========================================================================== */
    :root {
      color-scheme: light;
      /* Palette — Light (Primary) */
      --bg: #F4F2ED;
      --surface: #FBFAF7;
      --surface-2: #ECEAE3;
      --hairline: #DEDAD1;
      --hairline-strong: #C8C3B7;
      --ink: #121212;
      --ink-2: #5F5B53;
      --ink-3: #9A958B;

      /* Accent (default: Signal Vermilion) */
      --accent: #FF4D1C;
      --accent-soft: rgba(255, 77, 28, 0.10);
      --accent-ink: #FFFFFF;

      /* Semantic */
      --money-in: #1C7C54;
      --money-in-soft: rgba(28, 124, 84, 0.10);
      --danger: #FF4D1C;
      --danger-soft: rgba(255, 77, 28, 0.10);

      /* Key / Primary Button */
      --key-bg: #121212;
      --key-ink: #FBFAF7;

      /* Typography */
      --font-ui: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      /* Strict Type Scale: 11 / 13 / 15 / 18 / 24 / 34 / 56 */
      --t-11: 11px;
      --t-13: 13px;
      --t-15: 15px;
      --t-18: 18px;
      --t-24: 24px;
      --t-34: 34px;
      --t-56: 56px;

      /* Spacing & Grid (4px base, 20px margins) */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-10: 40px;

      /* Radii */
      --r-ctrl: 4px;
      --r-key: 6px;
      --r-logo: 8px;
      --r-sheet: 10px;
      --r-pill: 999px;

      /* Elevation — None except sheets & drag lift */
      --shadow-sheet: 0 -10px 36px rgba(18, 18, 18, 0.14);
      --shadow-lift: 0 8px 24px rgba(18, 18, 18, 0.12);

      /* Motion */
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --dur-fast: 180ms;
      --dur-mid: 240ms;
      --dur-slow: 340ms;

      /* Desktop stage */
      --stage-bg: #E7E4DC;
      --bezel: #1B1B19;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0E0E0D;
      --surface: #171715;
      --surface-2: #201F1C;
      --hairline: #2A2926;
      --hairline-strong: #3C3A35;
      --ink: #F1EFE9;
      --ink-2: #A5A096;
      --ink-3: #706B62;

      --accent: #FF6A3D;
      --accent-soft: rgba(255, 106, 61, 0.14);
      --accent-ink: #0E0E0D;

      --money-in: #34A877;
      --money-in-soft: rgba(52, 168, 119, 0.14);
      --danger: #FF6A3D;
      --danger-soft: rgba(255, 106, 61, 0.14);

      --key-bg: #F1EFE9;
      --key-ink: #0E0E0D;

      --shadow-sheet: 0 -12px 40px rgba(0, 0, 0, 0.55);
      --shadow-lift: 0 10px 28px rgba(0, 0, 0, 0.45);
      --stage-bg: #070706;
      --bezel: #272623;
    }

    /* Accent overrides */
    [data-accent="cobalt"] { --accent: #2F5BFF; --accent-soft: rgba(47, 91, 255, 0.11); --accent-ink: #FFFFFF; }
    [data-theme="dark"][data-accent="cobalt"] { --accent: #5D7FFF; --accent-soft: rgba(93, 127, 255, 0.15); --accent-ink: #0E0E0D; }
    [data-accent="moss"] { --accent: #4E7A2E; --accent-soft: rgba(78, 122, 46, 0.11); --accent-ink: #FFFFFF; }
    [data-theme="dark"][data-accent="moss"] { --accent: #74A84E; --accent-soft: rgba(116, 168, 78, 0.15); --accent-ink: #0E0E0D; }
    [data-accent="ink"] { --accent: #121212; --accent-soft: rgba(18, 18, 18, 0.08); --accent-ink: #FBFAF7; }
    [data-theme="dark"][data-accent="ink"] { --accent: #F1EFE9; --accent-soft: rgba(241, 239, 233, 0.12); --accent-ink: #0E0E0D; }

    /* ==========================================================================
       02. BASE & DESKTOP STAGE
       ========================================================================== */
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: var(--t-15);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      margin: 0;
    }

    button {
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--r-ctrl);
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    /* Desktop phone frame vs Mobile full-bleed */
    .stage {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--stage-bg);
      padding: 20px 16px;
      transition: background var(--dur-mid) var(--ease);
    }

    .phone-frame {
      position: relative;
      width: 390px;
      height: 844px;
      max-height: calc(100dvh - 76px);
      background: var(--bg);
      color: var(--ink);
      border-radius: 38px;
      border: 8px solid var(--bezel);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.22);
    }

    .stage-caption {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-2);
    }

    .stage-caption a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--hairline-strong);
      padding-bottom: 1px;
    }
    .stage-caption a:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 500px) {
      .stage {
        padding: 0;
        background: var(--bg);
        display: block;
        min-height: 100dvh;
      }
      .phone-frame {
        width: 100%;
        height: 100dvh;
        max-height: none;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .stage-caption { display: none; }
    }

    /* ==========================================================================
       03. APP SHELL & SCREEN TRANSITIONS
       ========================================================================== */
    .app-shell {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transition: transform var(--dur-mid) var(--ease), opacity var(--dur-mid) var(--ease);
      transform-origin: center top;
    }
    .viewport::-webkit-scrollbar { display: none; }

    .app-shell.sheet-open .viewport {
      transform: scale(0.98);
      opacity: 0.72;
    }

    .screen {
      padding: 0 var(--sp-5) 98px;
      min-height: 100%;
      animation: screenIn var(--dur-mid) var(--ease);
    }

    .screen.no-nav {
      padding-bottom: 28px;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hairline draw-in utility */
    .hr {
      height: 1px;
      background: var(--hairline);
      width: 100%;
      border: 0;
      margin: 0;
      transform-origin: left center;
      animation: hrDraw 260ms var(--ease);
    }

    @keyframes hrDraw {
      from { transform: scaleX(0.35); opacity: 0.4; }
      to { transform: scaleX(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ==========================================================================
       04. TYPOGRAPHY & SECTION HEADERS
       ========================================================================== */
    .sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 24px 0 10px;
      border-bottom: 1px solid var(--hairline);
    }

    .sec-label {
      font-family: var(--font-mono);
      font-size: var(--t-11);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .sec-link {
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.04em;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 32px;
      padding: 0 2px;
    }
    .sec-link:hover, .sec-link:active { color: var(--ink); }

    /* Top Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 0 12px;
      border-bottom: 1px solid var(--hairline);
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
    }

    .brand-word {
      font-size: var(--t-18);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-ctrl);
      color: var(--ink);
      transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn:active { transform: scale(0.95); }

    .avatar-sq {
      width: 34px;
      height: 34px;
      border-radius: var(--r-ctrl);
      border: 1px solid var(--hairline-strong);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: var(--t-11);
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    /* ==========================================================================
       05. HERO BALANCE & ODOMETER NUMERALS
       ========================================================================== */
    .hero-block {
      padding: 24px 0 20px;
      border-bottom: 1px solid var(--hairline);
    }

    .hero-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .eye-btn {
      min-width: 44px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .eye-btn:hover { color: var(--ink); }

    .hero-balance {
      display: flex;
      align-items: flex-start;
      font-family: var(--font-ui);
      font-weight: 300;
      font-size: 52px;
      line-height: 0.96;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      user-select: none;
    }

    .hero-peso {
      color: var(--ink-3);
      font-weight: 300;
      margin-right: 4px;
    }

    .hero-cents {
      font-size: 0.45em;
      font-weight: 400;
      line-height: 1;
      margin-top: 0.14em;
      margin-left: 2px;
      color: var(--ink-2);
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
    }

    /* Odometer digit reel */
    .odo-wrap {
      display: inline-flex;
      align-items: baseline;
    }
    .odo-digit {
      display: inline-block;
      height: 1em;
      overflow: hidden;
      position: relative;
      vertical-align: top;
    }
    .odo-strip {
      display: flex;
      flex-direction: column;
      transition: transform 420ms var(--ease);
      will-change: transform;
    }
    .odo-strip span {
      height: 1em;
      line-height: 0.96;
      display: block;
      text-align: center;
    }

    /* ==========================================================================
       06. SIGNATURE: ALLOCATION BAR
       ========================================================================== */
    .alloc-wrap {
      margin-top: 20px;
    }

    .alloc-bar {
      display: flex;
      width: 100%;
      height: 10px;
      gap: 2px;
      margin-bottom: 12px;
    }

    .alloc-seg {
      height: 100%;
      border-radius: 1.5px;
      transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
      cursor: pointer;
      position: relative;
      min-width: 6px;
    }
    .alloc-seg.dimmed { opacity: 0.28; }
    .alloc-seg.active { transform: scaleY(1.3); }

    .alloc-legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 10px;
    }

    .alloc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: -0.02em;
      color: var(--ink-2);
      padding: 3px 2px;
      border-radius: var(--r-ctrl);
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
      text-align: left;
    }
    .alloc-item:hover, .alloc-item.active {
      background: var(--surface-2);
      color: var(--ink);
    }

    .alloc-item-left {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .alloc-swatch {
      width: 7px;
      height: 7px;
      border-radius: 1px;
      flex-shrink: 0;
    }

    .alloc-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink);
    }

    .alloc-meta {
      white-space: nowrap;
      color: var(--ink-3);
      flex-shrink: 0;
    }

    .alloc-focus-bar {
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px solid var(--hairline);
      background: var(--surface);
      border-radius: var(--r-ctrl);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: var(--t-11);
    }

    /* ==========================================================================
       07. QUICK ACTIONS (4 equal cells divided by vertical hairlines)
       ========================================================================== */
    .quick-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--hairline);
    }

    .quick-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 15px 4px;
      min-height: 64px;
      position: relative;
      color: var(--ink);
      transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
    }

    .quick-cell + .quick-cell::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 1px;
      background: var(--hairline);
    }

    .quick-cell:hover { background: var(--surface); }
    .quick-cell:active { transform: scale(0.97); }

    .quick-cell span {
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.04em;
      color: var(--ink-2);
    }

    /* ==========================================================================
       08. UPCOMING TIMELINE, FAVORITES CHIPS, LEDGER ROWS
       ========================================================================== */
    .timeline-row {
      display: grid;
      grid-template-columns: 74px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      min-height: 58px;
      border-bottom: 1px solid var(--hairline);
      text-align: left;
      width: 100%;
      transition: background var(--dur-fast) var(--ease);
    }
    .timeline-row:active { background: var(--surface); }

    .tl-date {
      font-family: var(--font-mono);
      font-size: var(--t-11);
      line-height: 1.3;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tl-date strong {
      display: block;
      color: var(--ink);
      font-weight: 500;
    }
    .tl-date.urgent strong { color: var(--accent); }

    .tl-title {
      font-size: var(--t-15);
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tl-sub {
      font-family: var(--font-mono);
      font-size: var(--t-11);
      color: var(--ink-3);
      margin-top: 2px;
    }

    .tl-amt {
      font-family: var(--font-mono);
      font-size: var(--t-15);
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
    }

    /* Favorites horizontal scroller */
    .fav-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 0 4px;
      scrollbar-width: none;
    }
    .fav-scroller::-webkit-scrollbar { display: none; }

    .fav-chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--hairline-strong);
      border-radius: var(--r-ctrl);
      background: var(--surface);
      font-size: var(--t-13);
      color: var(--ink);
      transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .fav-chip:hover { border-color: var(--ink); }
    .fav-chip:active { transform: scale(0.97); }
    .fav-chip .mono {
      font-size: var(--t-11);
      color: var(--ink-2);
    }

    /* Transaction rows */
    .tx-row {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: 10px 0;
      border-bottom: 1px solid var(--hairline);
      width: 100%;
      text-align: left;
      transition: background var(--dur-fast) var(--ease);
    }
    .tx-row:active { background: var(--surface); }

    .tx-ico {
      width: 32px;
      height: 32px;
      border: 1px solid var(--hairline);
      border-radius: var(--r-ctrl);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-2);
      background: var(--surface);
      flex-shrink: 0;
    }

    .tx-main { min-width: 0; }
    .tx-title {
      font-size: var(--t-15);
      font-weight: 450;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-meta {
      font-family: var(--font-mono);
      font-size: var(--t-11);
      color: var(--ink-3);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-right {
      text-align: right;
      white-space: nowrap;
    }

    .amt-in { color: var(--money-in); }
    .amt-out { color: var(--ink); }
    .amt-warn { color: var(--danger); }

    /* ==========================================================================
       09. BOTTOM NAV + KEYBOARD-LIKE ADD KEY
       ========================================================================== */
    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--bg);
      border-top: 1px solid var(--hairline);
      padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      flex: 1;
      align-items: center;
    }

    .nav-tab {
      position: relative;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.04em;
      color: var(--ink-3);
      transition: color var(--dur-fast) var(--ease);
    }

    .nav-tab.active {
      color: var(--ink);
      font-weight: 600;
    }

    .nav-dot {
      width: 4px;
      height: 4px;
      border-radius: 1px;
      background: var(--accent);
      margin-bottom: 5px;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
    }

    .nav-tab.active .nav-dot {
      opacity: 1;
      transform: scale(1);
    }

    .nav-add {
      width: 52px;
      height: 48px;
      border-radius: var(--r-key);
      background: var(--key-bg);
      color: var(--key-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--key-bg);
      transition: transform var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
    }
    .nav-add:active { transform: scale(0.94); }

    /* ==========================================================================
       10. WALLETS & WALLET DETAIL (STATEMENT)
       ========================================================================== */
    .page-head {
      padding: 18px 0 16px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .page-title-34 {
      font-size: var(--t-34);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--ink);
    }

    .page-sub-mono {
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 6px;
    }

    .wallet-list-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      min-height: 74px;
      border-bottom: 1px solid var(--hairline);
      width: 100%;
      text-align: left;
      background: var(--bg);
      transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .wallet-list-row.dragging {
      background: var(--surface);
      box-shadow: var(--shadow-lift);
      padding-left: 8px;
      padding-right: 8px;
      border-radius: var(--r-ctrl);
      position: relative;
      z-index: 5;
    }

    .wallet-logo {
      width: 36px;
      height: 36px;
      border-radius: var(--r-logo);
      overflow: hidden;
      border: 1px solid var(--hairline);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--surface);
      font-family: var(--font-mono);
      font-size: var(--t-11);
      font-weight: 600;
    }
    .wallet-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .wallet-share-track {
      height: 2px;
      background: var(--hairline);
      margin-top: 7px;
      width: 100%;
      overflow: hidden;
    }
    .wallet-share-fill {
      height: 100%;
      transition: width 300ms var(--ease);
    }

    .reorder-controls {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .reorder-btn {
      width: 32px;
      height: 36px;
      border: 1px solid var(--hairline);
      border-radius: var(--r-ctrl);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-2);
      background: var(--surface);
    }
    .reorder-btn:disabled { opacity: 0.3; }

    .add-row-btn {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--hairline);
      font-family: var(--font-mono);
      font-size: var(--t-13);
      color: var(--ink);
      padding: 0 2px;
    }
    .add-row-btn:hover { color: var(--accent); }

    /* Statement Header & Table */
    .stmt-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      margin-top: 18px;
    }

    .stmt-act {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      position: relative;
      color: var(--ink);
    }
    .stmt-act + .stmt-act::before {
      content: "";
      position: absolute;
      left: 0; top: 10px; bottom: 10px;
      width: 1px;
      background: var(--hairline);
    }

    .underline-tabs {
      display: flex;
      gap: 18px;
      border-bottom: 1px solid var(--hairline);
      margin-top: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .underline-tabs::-webkit-scrollbar { display: none; }

    .u-tab {
      min-height: 44px;
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      padding: 0 2px;
    }
    .u-tab.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .stmt-cols-head {
      display: grid;
      grid-template-columns: 1fr 88px 88px;
      gap: 8px;
      padding: 10px 0 8px;
      border-bottom: 1px solid var(--hairline);
      font-family: var(--font-mono);
      font-size: var(--t-11);
      color: var(--ink-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .day-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 6px;
      border-bottom: 1px solid var(--hairline);
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .stmt-row {
      display: grid;
      grid-template-columns: 1fr 88px 88px;
      align-items: center;
      gap: 8px;
      min-height: 58px;
      padding: 10px 0;
      border-bottom: 1px solid var(--hairline);
      width: 100%;
      text-align: left;
    }
    .stmt-row:active { background: var(--surface); }

    /* ==========================================================================
       11. ACTIVITY: PACE LINE, BAR CHART, HEATMAP, BUDGETS
       ========================================================================== */
    .seg-ctrl {
      display: inline-flex;
      border: 1px solid var(--hairline-strong);
      border-radius: var(--r-ctrl);
      overflow: hidden;
      background: var(--surface);
    }

    .seg-btn {
      min-height: 34px;
      padding: 0 11px;
      font-family: var(--font-mono);
      font-size: var(--t-11);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    .seg-btn.active {
      background: var(--ink);
      color: var(--bg);
      font-weight: 600;
    }

    .pace-track {
      position: relative;
      height: 6px;
      background: var(--surface-2);
      margin: 14px 0 8px;
      border-radius: 1px;
    }
    .pace-fill {
      height: 100%;
      background: var(--ink);
      border-radius: 1px;
      transition: width 360ms var(--ease);
    }
    .pace-fill.warn { background: var(--accent); }
    .pace-ideal {
      position: absolute;
      top: -5px;
      bottom: -5px;
      width: 2px;
      background: var(--ink);
      box-shadow: 0 0 0 1px var(--bg);
    }

    .chart-box {
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--hairline);
    }

    .chart-readout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: var(--t-11);
      color: var(--ink-2);
      margin-bottom: 10px;
      min-height: 18px;
    }

    /* Calendar Heatmap */
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 12px 0 8px;
    }
    .hm-dow {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-3);
      padding-bottom: 4px;
    }
    .hm-cell {
      aspect-ratio: 1 / 0.88;
      border-radius: 3px;
      border: 1px solid var(--hairline);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: var(--t-11);
      color: var(--ink-2);
      position: relative;
      transition: transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
    }
    .hm-cell.empty { border-color: transparent; background: transparent; pointer-events: none; }
    .hm-cell.lvl-1 { background: rgba(18, 18, 18, 0.08); color: var(--ink); }
    .hm-cell.lvl-2 { background: rgba(18, 18, 18, 0.20); color: var(--ink); }
    .hm-cell.lvl-3 { background: rgba(18, 18, 18, 0.45); color: #FBFAF7; }
    .hm-cell.lvl-4 { background: #121212; color: #FBFAF7; }
    [data-theme="dark"] .hm-cell.lvl-1 { background: rgba(241, 239, 233, 0.10); color: var(--ink); }
    [data-theme="dark"] .hm-cell.lvl-2 { background: rgba(241, 239, 233, 0.24); color: var(--ink); }
    [data-theme="dark"] .hm-cell.lvl-3 { background: rgba(241, 239, 233, 0.50); color: #0E0E0D; }
    [data-theme="dark"] .hm-cell.lvl-4 { background: #F1EFE9; color: #0E0E0D; }

    .hm-cell.today {
      border: 1.5px solid var(--accent);
    }
    .hm-cell.selected {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }

    .flow-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--hairline);
    }
    .flow-cell {
      padding: 14px 4px;
      position: relative;
    }
    .flow-cell + .flow-cell::before {
      content: "";
      position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 1px;
      background: var(--hairline);
    }
    .flow-cell:not(:first-child) { padding-left: 12px; }

    .budget-row {
      padding: 14px 0;
      border-bottom: 1px solid var(--hairline);
      width: 100%;
      text-align: left;
      display: block;
    }
    .budget-line-track {
      height: 3px;
      background: var(--surface-2);
      margin-top: 8px;
      width: 100%;
    }
    .budget-line-fill {
      height: 100%;
      background: var(--ink);
    }
    .budget-line-fill.warn { background: var(--accent); }

    /* Filter chips */
    .chip-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 12px 0 8px;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid var(--hairline-strong);
      border-radius: var(--r-ctrl);
      font-family: var(--font-mono);
      font-size: var(--t-11);
      color: var(--ink-2);
      white-space: nowrap;
      background: var(--surface);
    }
    .filter-chip.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .ctrl-input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--hairline-strong);
      border-radius: var(--r-ctrl);
      background: var(--surface);
      color: var(--ink);
      font-size: var(--t-15);
    }
    .ctrl-input::placeholder { color: var(--ink-3); }

    /* ==========================================================================
       12. SETTINGS & TOGGLES
       ========================================================================== */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 10px 0;
      border-bottom: 1px solid var(--hairline);
      width: 100%;
      text-align: left;
    }

    .toggle-pill {
      width: 44px;
      height: 24px;
      border-radius: var(--r-pill);
      background: var(--surface-2);
      border: 1px solid var(--hairline-strong);
      position: relative;
      flex-shrink: 0;
      transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
    }
    .toggle-pill::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: var(--r-pill);
      background: var(--ink-2);
      transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .toggle-pill.on {
      background: var(--ink);
      border-color: var(--ink);
    }
    .toggle-pill.on::after {
      transform: translateX(20px);
      background: var(--bg);
    }

    .accent-dots {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .accent-opt {
      width: 28px;
      height: 28px;
      border-radius: var(--r-ctrl);
      border: 1px solid var(--hairline-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .accent-opt.active {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* ==========================================================================
       13. SHEETS & CUSTOM KEYPAD
       ========================================================================== */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(18, 18, 18, 0.34);
      display: flex;
      align-items: flex-end;
      animation: fadeIn var(--dur-fast) var(--ease);
    }
    [data-theme="dark"] .sheet-backdrop { background: rgba(0, 0, 0, 0.58); }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sheet-panel {
      width: 100%;
      max-height: 92%;
      background: var(--surface);
      border-top: 1px solid var(--hairline-strong);
      border-top-left-radius: var(--r-sheet);
      border-top-right-radius: var(--r-sheet);
      box-shadow: var(--shadow-sheet);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: sheetUp var(--dur-mid) var(--ease);
    }

    @keyframes sheetUp {
      from { transform: translateY(36px); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-grabber {
      width: 36px;
      height: 3px;
      background: var(--hairline-strong);
      margin: 10px auto 4px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .sheet-head {
      padding: 6px 20px 10px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .sheet-title {
      font-size: var(--t-24);
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .sheet-body {
      padding: 12px 20px calc(18px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      scrollbar-width: none;
    }
    .sheet-body::-webkit-scrollbar { display: none; }

    /* Big mono amount + 3x4 calculator keypad */
    .amount-stage {
      padding: 6px 0 8px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .amount-display {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--hairline);
      border-left: 1px solid var(--hairline);
      margin: 8px 0 10px;
    }
    .keypad-key {
      height: 38px;
      border-right: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      font-family: var(--font-mono);
      font-size: var(--t-18);
      color: var(--ink);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background var(--dur-fast) var(--ease);
    }
    .keypad-key:active { background: var(--surface-2); }

    /* 5-col category tile grid */
    .cat-grid-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin: 6px 0 10px;
    }
    .cat-tile {
      border: 1px solid var(--hairline);
      border-radius: var(--r-ctrl);
      background: var(--bg);
      padding: 5px 2px;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--ink-2);
      transition: all var(--dur-fast) var(--ease);
    }
    .cat-tile span {
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.1;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      padding: 0 2px;
    }
    .cat-tile.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .btn-primary {
      width: 100%;
      min-height: 48px;
      border-radius: var(--r-ctrl);
      background: var(--key-bg);
      color: var(--key-ink);
      font-family: var(--font-mono);
      font-size: var(--t-13);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-outline {
      width: 100%;
      min-height: 46px;
      border-radius: var(--r-ctrl);
      border: 1px solid var(--hairline-strong);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: var(--t-13);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-danger {
      width: 100%;
      min-height: 46px;
      border-radius: var(--r-ctrl);
      border: 1px solid var(--danger);
      color: var(--danger);
      background: transparent;
      font-family: var(--font-mono);
      font-size: var(--t-13);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* ==========================================================================
       14. INTRO & LOCK & AUTH & TOAST
       ========================================================================== */
    .intro-screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      cursor: pointer;
      position: relative;
    }

    .intro-stroke {
      stroke-dasharray: 280;
      stroke-dashoffset: 280;
      animation: drawStroke 900ms var(--ease) forwards;
    }
    .intro-fold {
      transform-origin: 18px 8px;
      opacity: 0;
      animation: foldFlip 420ms var(--ease) 750ms forwards;
    }
    @keyframes drawStroke {
      to { stroke-dashoffset: 0; }
    }
    @keyframes foldFlip {
      from { opacity: 0; transform: scale(0.4) rotate(-25deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    .pin-dots {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin: 28px 0 12px;
    }
    .pin-dots.shake {
      animation: pinShake 320ms ease-in-out;
    }
    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .pin-dot {
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--hairline-strong);
      border-radius: 3px;
      transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
    }
    .pin-dot.filled {
      background: var(--ink);
      border-color: var(--ink);
      transform: scale(1.06);
    }
    .pin-dot.error {
      border-color: var(--danger);
      background: var(--danger);
    }

    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--hairline);
      border-left: 1px solid var(--hairline);
      margin-top: auto;
    }
    .pin-key {
      height: 64px;
      border-right: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      font-family: var(--font-mono);
      font-size: var(--t-24);
      font-weight: 400;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--ink);
    }
    .pin-key:active { background: var(--surface-2); }

    .toast {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 82px;
      z-index: 60;
      background: var(--key-bg);
      color: var(--key-ink);
      border-radius: var(--r-ctrl);
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: var(--t-13);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      animation: toastIn 220ms var(--ease);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone-frame" id="phoneFrame">
      <div class="app-shell" id="appShell">
        <div class="viewport" id="viewport"></div>
        <div id="bottomNavMount"></div>
        <div id="sheetMount"></div>
        <div id="toastMount"></div>
      </div>
    </div>
    <div class="stage-caption">
      <span>Concept 01 · Tahimik</span>
      <span>·</span>
      <a href="../index.html">← Design showcase</a>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

        return `<span class="odo-digit"><span class="odo-strip" data-start="${start}" data-target="${target}" style="transform:translateY(-${start}em)">${strip}</span></span>`;
      }).join("");
      state.lastBalance = value;
      return `<div class="hero-balance" aria-label="${fmt(value)}"><span class="hero-peso">₱</span><span class="odo-wrap">${digitsHtml}</span><span class="hero-cents">.${cents}</span></div>`;
    };

    const triggerOdometers = () => {
      requestAnimationFrame(() => {

    let toastTimer = null;
    const showToast = (msg, actionLabel = null, onAction = null) => {
      const mount = document.getElementById("toastMount");
      if (!mount) return;
      clearTimeout(toastTimer);
      mount.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${actionLabel ? `<button class="mono" id="toastActionBtn" style="color:var(--accent);text-transform:uppercase;font-size:11px;font-weight:600;">${esc(actionLabel)}</button>` : ""}</div>`;
      if (actionLabel && onAction) {
        const btn = document.getElementById("toastActionBtn");
        if (btn) btn.onclick = () => { mount.innerHTML = ""; onAction(); };
      }
      toastTimer = setTimeout(() => { if (mount) mount.innerHTML = ""; }, 2800);

    const exportCsv = (rows) => {
      const header = ["ID", "Date", "Title", "Kind", "Wallet", "ToWallet", "Amount", "Note"];
      const lines = [header.join(",")].concat(rows.map((t) => {
        const w = walletById(t.wallet)?.name || t.wallet;
        const to = t.to ? (walletById(t.to)?.name || t.to) : "";
        return [t.id, t.at, t.title, t.kind, w, to, t.amount.toFixed(2), t.note || ""]
          .map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",");
      }));
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `pitaka-ledger-${TODAY.toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Exported ${rows.length} entries (CSV)`);

    /* Blend brand hex into muted editorial tint */
    const mutedBrand = (hex = "#5F5B53") => {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!m) return hex;
      const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
      const base = state.theme === "dark" ? [40, 39, 36] : [236, 234, 227];
      const mix = 0.62;
      const rr = Math.round(r * mix + base[0] * (1 - mix));
      const gg = Math.round(g * mix + base[1] * (1 - mix));
      const bb = Math.round(b * mix + base[2] * (1 - mix));
      return `rgb(${rr}, ${gg}, ${bb})`;
    };

    /* ========================================================================
       05. ROUTER & HASH PARSING
       ======================================================================== */
    const navigate = (hash) => {
      const clean = hash.startsWith("#") ? hash : `#/${hash.replace(/^\//, "")}`;
      if (window.location.hash === clean) {
        renderApp();
      } else {
        window.location.hash = clean;

    const parseRoute = () => {
      const rawHash = (window.location.hash || "").split("?")[0];
      const raw = rawHash.replace(/^#\/?/, "");
      const qp = getMergedQuery();
      if (qp.get("theme") === "dark" || qp.get("theme") === "light") state.theme = qp.get("theme");
      if (qp.get("hidden") === "1") state.hideBalances = true;
      if (!raw) return { screen: "intro", sheet: null, param: null };
      const parts = raw.split("/");
      if (parts[0] === "sheet") {
        return {
          screen: state.lastMainRoute || "home",
          sheet: parts[1] || "add-tx",
          param: parts[2] ? decodeURIComponent(parts.slice(2).join("/")) : null,
        };
      }
      if (parts[0] === "wallet" && parts[1]) {
        return { screen: "wallet", sheet: null, param: decodeURIComponent(parts[1]) };
      }
      if (parts[0] === "activity" && parts[1] === "budgets") {
        return { screen: "budgets", sheet: null, param: null };
      }
      const allowed = ["intro", "lock", "auth", "home", "empty", "wallets", "activity", "settings"];
      const scr = allowed.includes(parts[0]) ? parts[0] : "home";
      return { screen: scr, sheet: null, param: null };

                  ${walletLogoHtml(w, 36)}
                  <div style="min-width:0;">
                    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;">
                      <span style="font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(w.name)}</span>
                      ${!state.reorderMode ? `<span class="mono" style="font-size:15px;font-weight:500;">${fmtMasked(w.balance)}</span>` : ""}
                    </div>
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;">
                      <span class="mono" style="font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">${esc(w.type)} · ${esc(w.account)}</span>
                      ${!state.reorderMode ? `<span class="mono" style="font-size:11px;color:var(--ink-3);flex-shrink:0;">${pct}%</span>` : ""}
                    </div>
                    <div class="wallet-share-track">
                      <div class="wallet-share-fill" style="width:${pct}%;background:${mutedBrand(w.brand)};"></div>
                    </div>
                  </div>
                  ${state.reorderMode ? `
                    <div class="reorder-controls">
                      <button class="reorder-btn" data-move-wallet="${idx}:-1" ${idx === 0 ? "disabled" : ""} aria-label="Move ${esc(w.name)} up">${ico("chevron-up", 16)}</button>
                      <button class="reorder-btn" data-move-wallet="${idx}:1" ${idx === WALLETS.length - 1 ? "disabled" : ""} aria-label="Move ${esc(w.name)} down">${ico("chevron-down", 16)}</button>
                    </div>
                  ` : `<span style="color:var(--ink-3);">${ico("chevron-right", 16)}</span>`}
                </div>
              `;
            }).join("")}
          </div>

          <button class="add-row-btn" data-nav="sheet/add-wallet">
            <span>Add wallet</span>
            ${ico("plus", 18)}
          </button>
        </div>
      `;
    };

    const renderWalletDetail = (walletId) => {
      const w = walletById(walletId) || WALLETS[0];
      if (!w) return renderWallets();

      // Chronological running balance calculation (newest -> oldest)
      const allW = walletTx(w.id).sort((a, b) => b.at.localeCompare(a.at));
      let running = w.balance;
      const withRunning = allW.map((t) => {
        const rowBal = running;
        running = running - t.amount;
        return { ...t, runBal: rowBal };
      });

      const filtered = withRunning.filter((t) => {
        if (state.walletFilter === "In") return t.amount > 0 && !isTransfer(t) || t.incoming;
        if (state.walletFilter === "Out") return t.amount < 0 && !isTransfer(t);
        if (state.walletFilter === "Transfers") return isTransfer(t);
        return true;
      });

      // Group by day
      const groups = [];
      filtered.forEach((t) => {
        const key = t.at.slice(0, 10);
        let g = groups.find((x) => x.key === key);
        if (!g) { g = { key, date: txDate(t), rows: [], net: 0 }; groups.push(g); }
        g.rows.push(t);
        g.net += t.amount;
      });

      return `
        <div class="screen no-nav">
          ${renderTopbar(true, "wallets")}

          <section style="padding:20px 0 0;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
              ${walletLogoHtml(w, 36)}
              <div>
                <div class="mono" style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;">
                  ${esc(w.type)} · ${esc(w.account)} · ${esc(w.number)}
                </div>
                <h1 class="page-title-34" style="margin:2px 0 0;">${esc(w.name)}</h1>
              </div>
            </div>

            <div style="margin-top:16px;">
              <div class="sec-label" style="margin-bottom:6px;">STATEMENT BALANCE</div>
              ${renderOdometerHtml(w.balance, { animate: false })}
            </div>

            <div class="stmt-actions">
              <button class="stmt-act" data-nav="sheet/update">${ico("sliders", 14)}<span>Update</span></button>
              <button class="stmt-act" data-nav="sheet/transfer">${ico("swap", 14)}<span>Transfer</span></button>
              <button class="stmt-act" data-nav="sheet/edit-wallet/${esc(w.id)}">${ico("edit", 14)}<span>Edit</span></button>
            </div>
          </section>

          <div class="underline-tabs" role="tablist">
            ${["Recent", "In", "Out", "Transfers"].map((tab) => `
              <button class="u-tab ${state.walletFilter === tab ? "active" : ""}" data-wtab="${tab}" role="tab" aria-selected="${state.walletFilter === tab}">
                ${tab === "In" ? "Money in" : tab === "Out" ? "Money out" : tab}
              </button>
            `).join("")}
          </div>

          <div class="stmt-cols-head">
            <span>ENTRY</span>
            <span style="text-align:right;">AMOUNT</span>
            <span style="text-align:right;">BALANCE</span>
          </div>

          ${groups.length ? groups.map((g) => `
            <div>
              <div class="day-head">
                <span>${esc(dayLabel(g.date))}</span>
                <span class="${g.net >= 0 ? "amt-in" : ""}">${fmtMasked(g.net, { sign: true })}</span>
              </div>
              ${g.rows.map((t) => `
                <button class="stmt-row" data-nav="sheet/tx/${encodeURIComponent(t.id)}">
                  <span style="min-width:0;">
                    <span class="tx-title" style="display:block;">${esc(t.title)}</span>
                    <span class="tx-meta" style="display:block;">${esc(t.kind)}${t.incoming ? " · In" : ""} · ${timeLabel(txDate(t))}</span>
                  </span>
                  <span class="mono ${t.amount > 0 ? "amt-in" : "amt-out"}" style="text-align:right;font-size:13px;font-weight:500;">
                    ${fmtMasked(t.amount, { sign: t.amount > 0 })}
                  </span>
                  <span class="mono" style="text-align:right;font-size:12px;color:var(--ink-2);">
                    ${fmtMasked(t.runBal)}
                  </span>
                </button>
              `).join("")}
            </div>
          `).join("") : `
            <div style="padding:36px 0;text-align:center;color:var(--ink-3);font-family:var(--font-mono);font-size:11px;">
              NO ENTRIES FOR THIS FILTER
            </div>
          `}
        </div>
      `;
    };

    const renderActivity = () => {
      const refDate = new Date(TODAY.getFullYear(), TODAY.getMonth() + state.activityMonthOffset, state.activityMonthOffset === 0 ? TODAY.getDate() : 31);
      const monthName = refDate.toLocaleDateString("en-PH", { month: "long" });
      const yearLabel = refDate.getFullYear();

      const mSpent = monthSpent(refDate);
      const mInc = monthIncome(refDate);
      const net = mInc - mSpent;

      // Pace calculation (for Nov 2026: day 24 of 30 = 80%, spent 88%, 6 days left)
      const daysInMonth = new Date(refDate.getFullYear(), refDate.getMonth() + 1, 0).getDate();
      const dayNum = state.activityMonthOffset === 0 ? TODAY.getDate() : daysInMonth;
      const daysLeft = Math.max(0, daysInMonth - dayNum);
      const budgetPct = Math.round((mSpent / state.monthlyBudget) * 100);
      const idealPct = Math.round((dayNum / daysInMonth) * 100);
      const isOverPace = budgetPct > idealPct || budgetPct >= 85;

      // Series for Bar Chart
      const series = state.activityRange === "Week"
        ? weekSeries(refDate).map((d, i) => ({ idx: i, lbl: d.label, in: d.in, out: d.out }))
        : dailySeries(refDate).map((d, i) => ({ idx: i, lbl: String(d.day), in: d.in, out: d.out }));

      const maxVal = Math.max(1000, ...series.map((s) => Math.max(s.in, s.out)));
      const selBar = state.selectedChartIdx !== null && series[state.selectedChartIdx] ? series[state.selectedChartIdx] : null;
      const chartW = 350, chartH = 112, padB = 18, padT = 8;
      const innerH = chartH - padB - padT;
      const step = chartW / Math.max(1, series.length);
      const barW = state.activityRange === "Week" ? 10 : 5.5;

      const barsSvg = series.map((s, idx) => {
        const cx = idx * step + step / 2;
        const hIn = s.in > 0 ? Math.max(3, (s.in / maxVal) * innerH) : 0;
        const hOut = s.out > 0 ? Math.max(3, (s.out / maxVal) * innerH) : 0;
        const active = state.selectedChartIdx === idx;
        const showLabel = state.activityRange === "Week" || idx === 0 || (idx + 1) % 5 === 0 || idx === series.length - 1;
        return `
          <g data-bar-idx="${idx}" style="cursor:pointer;">
            <rect x="${(cx - step / 2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${chartH}" fill="transparent"/>
            ${active ? `<line x1="${cx.toFixed(1)}" y1="2" x2="${cx.toFixed(1)}" y2="${chartH - padB}" stroke="var(--hairline-strong)" stroke-dasharray="2 2"/>` : ""}
            ${hIn > 0 ? `<rect x="${(cx - barW - 1).toFixed(1)}" y="${(padT + innerH - hIn).toFixed(1)}" width="${barW}" height="${hIn.toFixed(1)}" rx="1" fill="none" stroke="var(--money-in)" stroke-width="1.4"/>` : ""}
            ${hOut > 0 ? `<rect x="${(cx + 1).toFixed(1)}" y="${(padT + innerH - hOut).toFixed(1)}" width="${barW}" height="${hOut.toFixed(1)}" rx="1" fill="${active ? "var(--accent)" : "var(--ink)"}"/>` : ""}
            ${showLabel ? `<text x="${cx.toFixed(1)}" y="${chartH - 3}" text-anchor="middle" fill="var(--ink-3)" font-family="var(--font-mono)" font-size="9">${s.lbl}</text>` : ""}
          </g>
        `;
      }).join("");

      // Heatmap calendar data
      const firstDow = new Date(refDate.getFullYear(), refDate.getMonth(), 1).getDay();
      const daySpendMap = {};
      monthTx(refDate).filter(isExpense).forEach((t) => {
        const d = txDate(t).getDate();
        daySpendMap[d] = (daySpendMap[d] || 0) - t.amount;
      });
      const heatLvl = (amt) => !amt ? 0 : amt <= 400 ? 1 : amt <= 1500 ? 2 : amt <= 4000 ? 3 : 4;
      const selectedDayTxs = state.selectedHeatDay
        ? monthTx(refDate).filter((t) => txDate(t).getDate() === state.selectedHeatDay)
        : [];

      // Category breakdown & budgets
      const cats = spendingByCategory(refDate);
      const maxCat = cats[0]?.[1] || 1;
      const catSpendMap = Object.fromEntries(cats);
      const budgetEntries = Object.entries(CATEGORY_LIMITS).map(([cat, lim]) => {
        const sp = catSpendMap[cat] || 0;
        return { cat, lim, sp, pct: Math.round((sp / lim) * 100) };
      }).sort((a, b) => b.pct - a.pct);

      // Ledger filtering
      const ledgerRows = monthTx(refDate)
        .filter((t) => {
          if (state.ledgerFilter === "Expenses") return isExpense(t);
          if (state.ledgerFilter === "Income") return isIncome(t);
          if (state.ledgerFilter === "Transfers") return isTransfer(t);
          if (state.ledgerFilter === "Adjusted") return isAdjust(t);
          return true;
        })
        .filter((t) => state.ledgerWallet === "all" || t.wallet === state.ledgerWallet || t.to === state.ledgerWallet)
        .filter((t) => {
          if (!state.ledgerSearch.trim()) return true;
          const q = state.ledgerSearch.toLowerCase();
          return t.title.toLowerCase().includes(q) || t.kind.toLowerCase().includes(q) || (t.note || "").toLowerCase().includes(q);
        })
        .sort((a, b) => b.at.localeCompare(a.at));

      const visibleLedger = ledgerRows.slice(0, state.ledgerLimit);
      const ledgerGroups = [];
      visibleLedger.forEach((t) => {
        const key = t.at.slice(0, 10);
        let g = ledgerGroups.find((x) => x.key === key);
        if (!g) { g = { key, date: txDate(t), rows: [], net: 0 }; ledgerGroups.push(g); }
        g.rows.push(t);
        if (!isTransfer(t)) g.net += t.amount;
      });

      return `
        <div class="screen">
          ${renderTopbar(false)}

          <!-- HEADER WITH MONTH NAV + RANGE CONTROL -->
          <div class="page-head" style="align-items:center;">
            <div>
              <div class="page-sub-mono">${yearLabel} LEDGER</div>
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="icon-btn" style="width:30px;height:30px;border:1px solid var(--hairline);" id="prevMonthBtn" ${state.activityMonthOffset <= -1 ? "disabled" : ""} aria-label="Previous month">
                  ${ico("chevron-left", 15)}
                </button>
                <h1 class="page-title-34" style="margin:0;font-size:28px;">${esc(monthName)}</h1>
                <button class="icon-btn" style="width:30px;height:30px;border:1px solid var(--hairline);" id="nextMonthBtn" ${state.activityMonthOffset >= 0 ? "disabled" : ""} aria-label="Next month">
                  ${ico("chevron-right", 15)}
                </button>
              </div>
            </div>
            <div class="seg-ctrl">
              <button class="seg-btn ${state.activityRange === "Month" ? "active" : ""}" data-range="Month">Month</button>
              <button class="seg-btn ${state.activityRange === "Week" ? "active" : ""}" data-range="Week">Week</button>
            </div>
          </div>

          <!-- HERO SPENT + PACE LINE -->
          <section class="hero-block">
            <div class="hero-top-row">
              <span class="sec-label">01 — SPENT THIS ${state.activityRange.toUpperCase()}</span>
              <button class="sec-link" data-nav="sheet/budget">Edit limit →</button>
            </div>
            ${renderOdometerHtml(state.activityRange === "Week" ? weekSeries(refDate).reduce((s, d) => s + d.out, 0) : mSpent, { animate: false })}
            <div class="pace-track" role="progressbar" aria-valuenow="${budgetPct}" aria-valuemin="0" aria-valuemax="100">
              <div class="pace-fill ${isOverPace ? "warn" : ""}" style="width:${Math.min(100, budgetPct)}%;"></div>
              <div class="pace-ideal" style="left:${Math.min(99, idealPct)}%;" title="Ideal pace (${idealPct}%)"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--ink-2);">
              <span>of ${fmtMasked(state.monthlyBudget, { cents: false })} budget · <strong style="color:${isOverPace ? "var(--accent)" : "var(--ink)"};">${budgetPct}% used</strong></span>
              <span>${state.activityMonthOffset === 0 ? `${daysLeft} days left` : "Closed"}</span>
            </div>
          </section>

          <!-- MONEY IN VS SPENDING CHART -->
          <section class="chart-box">
            <div class="chart-readout">
              <span>${selBar ? `${state.activityRange === "Week" ? selBar.lbl : `${monthName.slice(0,3)} ${selBar.lbl}`} · IN ${fmtMasked(selBar.in, { cents: false })} · OUT ${fmtMasked(selBar.out, { cents: false })}` : "02 — MONEY IN VS SPENDING (TAP BAR)"}</span>
              <span style="display:inline-flex;gap:10px;color:var(--ink-3);">
                <span><span style="display:inline-block;width:7px;height:7px;border:1.4px solid var(--money-in);vertical-align:middle;margin-right:3px;"></span>IN</span>
                <span><span style="display:inline-block;width:7px;height:7px;background:var(--ink);vertical-align:middle;margin-right:3px;"></span>OUT</span>
              </span>
            </div>
            <svg width="100%" viewBox="0 0 ${chartW} ${chartH}" style="display:block;overflow:visible;">
              <line x1="0" y1="${chartH - padB}" x2="${chartW}" y2="${chartH - padB}" stroke="var(--hairline)"/>
              ${barsSvg}
            </svg>
          </section>

          <!-- FLOW SUMMARY -->
          <section class="flow-strip">
            <div class="flow-cell">
              <div class="sec-label">MONEY IN</div>
              <div class="mono amt-in" style="font-size:15px;font-weight:500;margin-top:4px;">${fmtMasked(mInc, { sign: true })}</div>
            </div>
            <div class="flow-cell">
              <div class="sec-label">SPENT</div>
              <div class="mono" style="font-size:15px;font-weight:500;margin-top:4px;">${fmtMasked(-mSpent)}</div>
            </div>
            <div class="flow-cell">
              <div class="sec-label">NET FLOW</div>
              <div class="mono ${net >= 0 ? "amt-in" : "amt-warn"}" style="font-size:15px;font-weight:500;margin-top:4px;">${fmtMasked(net, { sign: net > 0 })}</div>
            </div>
          </section>

          <!-- SIGNATURE: SPENDING CALENDAR HEATMAP -->
          <section>
            <div class="sec-head">
              <span class="sec-label">03 — SPENDING HEATMAP</span>
              ${state.selectedHeatDay ? `<button class="sec-link" id="clearHeatBtn">Clear day ×</button>` : `<span class="mono" style="font-size:11px;color:var(--ink-3);">TAP DAY</span>`}
            </div>
            <div class="heatmap-grid">
              ${["SUN","MON","TUE","WED","THU","FRI","SAT"].map((d) => `<div class="hm-dow">${d}</div>`).join("")}
              ${Array.from({ length: firstDow }, () => `<div class="hm-cell empty"></div>`).join("")}
              ${Array.from({ length: daysInMonth }, (_, i) => {
                const d = i + 1;
                const sp = daySpendMap[d] || 0;
                const lvl = heatLvl(sp);
                const isToday = state.activityMonthOffset === 0 && d === TODAY.getDate();
                const isSel = state.selectedHeatDay === d;
                return `<button class="hm-cell lvl-${lvl} ${isToday ? "today" : ""} ${isSel ? "selected" : ""}" data-heat-day="${d}" aria-label="${monthName} ${d}, spent ${fmt(sp)}">${d}</button>`;
              }).join("")}
            </div>
            ${state.selectedHeatDay ? `
              <div style="border-top:1px solid var(--hairline);padding-top:8px;margin-top:4px;">
                <div class="mono" style="font-size:11px;color:var(--accent);margin-bottom:4px;">
                  ${monthName.toUpperCase()} ${state.selectedHeatDay} · ${selectedDayTxs.length} ${selectedDayTxs.length === 1 ? "ENTRY" : "ENTRIES"}
                </div>
                ${selectedDayTxs.length ? selectedDayTxs.map(renderTxRow).join("") : `<div class="mono" style="padding:12px 0;font-size:11px;color:var(--ink-3);">No transactions recorded on this day.</div>`}
              </div>
            ` : ""}
          </section>

          <!-- 04 — CATEGORY BUDGETS -->
          <section>
            <div class="sec-head">
              <span class="sec-label">04 — CATEGORY BUDGETS</span>
              <button class="sec-link" data-nav="activity/budgets">All limits →</button>
            </div>
            ${budgetEntries.slice(0, 4).map((b) => {
              const warn = b.pct >= 85;
              return `
                <button class="budget-row" data-nav="sheet/category-budget/${encodeURIComponent(b.cat)}">
                  <div style="display:flex;justify-content:space-between;align-items:baseline;">
                    <span style="font-size:15px;font-weight:500;">${esc(b.cat)}</span>
                    <span class="mono" style="font-size:13px;color:${warn ? "var(--accent)" : "var(--ink-2)"};">
                      ${fmtMasked(b.sp, { cents: false })} / ${fmtMasked(b.lim, { cents: false })} · ${b.pct}%
                    </span>
                  </div>
                  <div class="budget-line-track">
                    <div class="budget-line-fill ${warn ? "warn" : ""}" style="width:${Math.min(100, b.pct)}%;"></div>
                  </div>
                </button>
              `;
            }).join("")}
          </section>

          <!-- 05 — CATEGORIES BREAKDOWN -->
          <section>
            <div class="sec-head">
              <span class="sec-label">05 — CATEGORIES</span>
              <span class="mono" style="font-size:11px;color:var(--ink-3);">RANKED</span>
            </div>
            ${cats.map(([cat, amt]) => {
              const pct = Math.round((amt / mSpent) * 100) || 0;
              return `
                <div style="padding:12px 0;border-bottom:1px solid var(--hairline);">
                  <div style="display:flex;justify-content:space-between;align-items:baseline;">
                    <span style="display:inline-flex;align-items:center;gap:8px;font-size:15px;">
                      <span style="color:var(--ink-2);display:inline-flex;">${ico(catIconName(cat), 15)}</span>
                      <span>${esc(cat)}</span>
                    </span>
                    <span class="mono" style="font-size:13px;">${fmtMasked(amt)} <span style="color:var(--ink-3);">(${pct}%)</span></span>
                  </div>
                  <div class="budget-line-track">
                    <div class="budget-line-fill" style="width:${Math.round((amt / maxCat) * 100)}%;"></div>
                  </div>
                </div>
              `;
            }).join("")}
          </section>

          <!-- 06 — FULL LEDGER + EXPORT CSV -->
          <section>
            <div class="sec-head">
              <span class="sec-label">06 — LEDGER (${ledgerRows.length})</span>
              <button class="sec-link" id="exportCsvBtn">${ico("download", 14)}<span>Export CSV</span></button>
            </div>
            <div class="chip-row">
              ${["All", "Expenses", "Income", "Transfers", "Adjusted"].map((f) => `
                <button class="filter-chip ${state.ledgerFilter === f ? "active" : ""}" data-lfilter="${f}">${f}</button>
              `).join("")}
            </div>
            <div style="display:grid;grid-template-columns:1fr 124px;gap:8px;margin-bottom:8px;">
              <input class="ctrl-input" id="ledgerSearchInput" type="search" value="${esc(state.ledgerSearch)}" placeholder="Search merchant or note..." style="min-height:40px;font-size:13px;" />
              <select class="ctrl-input" id="ledgerWalletSelect" aria-label="Filter by wallet" style="min-height:40px;font-size:13px;">
                <option value="all" ${state.ledgerWallet === "all" ? "selected" : ""}>All wallets</option>
                ${WALLETS.map((w) => `<option value="${esc(w.id)}" ${state.ledgerWallet === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}
              </select>
            </div>

            ${ledgerGroups.length ? ledgerGroups.map((g) => `
              <div>
                <div class="day-head">
                  <span>${esc(dayLabel(g.date))}</span>
                  <span class="${g.net > 0 ? "amt-in" : ""}">${fmtMasked(g.net, { sign: g.net > 0 })}</span>
                </div>
                ${g.rows.map(renderTxRow).join("")}
              </div>
            `).join("") : `
              <div style="padding:28px 0;text-align:center;color:var(--ink-3);font-family:var(--font-mono);font-size:11px;">
                NO MATCHING TRANSACTIONS
              </div>
            `}

            ${ledgerRows.length > state.ledgerLimit ? `
              <button class="btn-outline" id="loadMoreBtn" style="margin-top:14px;">Load more (${ledgerRows.length - state.ledgerLimit} remaining)</button>
            ` : ""}
          </section>
        </div>
      `;
    };

    const renderActivityBudgets = () => {
      const mSpent = monthSpent(TODAY);
      const budgetPct = Math.round((mSpent / state.monthlyBudget) * 100);
      const catSpendMap = Object.fromEntries(spendingByCategory(TODAY));
      const allExpenseCats = EXPENSE_CATEGORIES.map(([c]) => c);
      const budgetedCats = allExpenseCats.filter((c) => CATEGORY_LIMITS[c] !== undefined);
      const unbudgetedCats = allExpenseCats.filter((c) => CATEGORY_LIMITS[c] === undefined);

      return `
        <div class="screen no-nav">
          ${renderTopbar(true, "activity")}
          <div class="page-head">
            <div>
              <div class="page-sub-mono">NOVEMBER 2026</div>
              <h1 class="page-title-34" style="margin:0;">Budgets</h1>
            </div>
            <button class="sec-link" data-nav="sheet/budget">Monthly limit →</button>
          </div>

          <section class="hero-block">
            <div class="sec-label" style="margin-bottom:6px;">MONTHLY CAP · ${budgetPct}% USED</div>
            <div style="display:flex;align-items:baseline;justify-content:space-between;">

    const renderFavoriteSheet = () => {
      if (!state.favDraft) {
        state.favDraft = { name: "", direction: "expense", category: "Food", wallet: WALLETS[0]?.id || "gcash", defaultAmount: "" };

        <div style="display:flex;flex-direction:column;gap:10px;">

        <p style="color:var(--ink-2);margin:0 0 18px;">${esc(ctx.desc)}</p>

    /* ========================================================================
