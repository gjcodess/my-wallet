    const renderApp = () => {
      const route = parseRoute();
      applyThemeAttrs();
      state.currentRoute = route.screen;
      if (!route.sheet && !["intro", "lock", "auth"].includes(route.screen)) {
        state.lastMainRoute = route.screen;
      }

      const viewport = document.getElementById("viewport");
      const navMount = document.getElementById("bottomNavMount");
      const sheetMount = document.getElementById("sheetMount");
      const appShell = document.getElementById("appShell");

      let html = "";
      let navTab = null;
      switch (route.screen) {
        case "intro": html = renderIntro(); break;
        case "lock": html = renderLock(); break;
        case "auth": html = renderAuth(); break;
        case "empty": html = renderEmptyHome(); navTab = "home"; break;
        case "wallets": html = renderWallets(); navTab = "wallets"; break;
        case "wallet": html = renderWalletDetail(route.param); navTab = null; break;
        case "activity": html = renderActivity(); navTab = "activity"; break;
        case "budgets": html = renderActivityBudgets(); navTab = null; break;
        case "settings": html = renderSettings(); navTab = "settings"; break;
        default: html = renderHome(); navTab = "home"; break;
      }

      viewport.innerHTML = html;
      navMount.innerHTML = navTab ? renderBottomNav(navTab) : "";

      let sheetHtml = "";
      if (route.sheet) {
        switch (route.sheet) {
          case "add-tx": sheetHtml = renderAddTxSheet("expense"); break;
          case "add-income": sheetHtml = renderAddTxSheet("income"); break;
          case "transfer": sheetHtml = renderTransferSheet(); break;
          case "update": sheetHtml = renderUpdateBalanceSheet(); break;
          case "add-wallet": sheetHtml = renderAddWalletSheet(); break;
          case "edit-wallet": sheetHtml = renderEditWalletSheet(route.param); break;
          case "tx": sheetHtml = renderTxDetailSheet(route.param); break;
          case "edit-tx": sheetHtml = renderEditTxSheet(route.param); break;
          case "search": sheetHtml = renderSearchSheet(); break;
          case "schedules": sheetHtml = renderSchedulesSheet(); break;
          case "schedule-edit": sheetHtml = renderScheduleEditSheet(); break;
          case "budget": sheetHtml = renderBudgetSheet(); break;
          case "category-budget": sheetHtml = renderCategoryBudgetSheet(route.param); break;
          case "favorite": sheetHtml = renderFavoriteSheet(); break;
          case "profile": sheetHtml = renderProfileSheet(); break;
          case "pin": sheetHtml = renderPinSheet(); break;
          case "confirm-delete": sheetHtml = renderConfirmDeleteSheet(); break;
          default: sheetHtml = ""; break;
        }
      }

      sheetMount.innerHTML = sheetHtml;
      appShell.classList.toggle("sheet-open", !!sheetHtml);
      triggerOdometers();
    };

    /* ========================================================================
       10. INTERACTIONS & DELEGATED EVENTS
       ======================================================================== */
    const closeSheet = () => {
      state.addTxDraft = null;
      state.editWalletDraft = null;
      state.editTxDraft = null;
      navigate(state.lastMainRoute || "home");
    };

    const appShell = document.getElementById("appShell");

    appShell.addEventListener("click", (e) => {
      const t = e.target;

      // Backdrop / close
      if (t.id === "sheetBackdrop" || t.closest("#sheetCloseBtn") || t.closest("#sheetCancelBtn")) {
        closeSheet();
        return;
      }

      // Intro skip
      if (t.closest("#introSkipBtn")) {
        clearTimeout(introTimer);
        navigate(state.appLockEnabled ? "lock" : "home");
        return;
      }

      // Generic data-nav
      const navEl = t.closest("[data-nav]");
      if (navEl && !t.closest(".reorder-controls")) {
        const dest = navEl.getAttribute("data-nav");
        if (dest === "sheet/add-tx" || dest === "sheet/add-income") {
          state.addTxDraft = null;
        }
        navigate(dest);
        return;
      }

      // PIN keypad
      const pinBtn = t.closest("[data-pin-digit]");
      if (pinBtn) {
        if (state.pinInput.length < 4) {
          state.pinInput += pinBtn.getAttribute("data-pin-digit");
          state.pinError = false;
          renderApp();
          if (state.pinInput.length === 4) {
            if (state.pinInput === state.pinCode) {
              setTimeout(() => { state.pinInput = ""; navigate("home"); }, 140);
            } else {
              state.pinError = true;
              renderApp();
              setTimeout(() => { state.pinInput = ""; state.pinError = false; renderApp(); }, 550);
            }
          }
        }
        return;
      }
      if (t.closest("#pinBackBtn")) {
        state.pinInput = state.pinInput.slice(0, -1);
        state.pinError = false;
        renderApp();
        return;
      }
      if (t.closest("#pinBioBtn")) {
        showToast("Biometric verified");
        state.pinInput = "";
        navigate("home");
        return;
      }

      // Auth mode & submit
      const authModeBtn = t.closest("[data-auth-mode]");
      if (authModeBtn) {
        state.authMode = authModeBtn.getAttribute("data-auth-mode");
        renderApp();
        return;
      }
      if (t.closest("#authSubmitBtn")) {
        const nameEl = document.getElementById("authName");
        const emailEl = document.getElementById("authEmail");
        if (nameEl && nameEl.value.trim()) {
          PROFILE.fullName = nameEl.value.trim();
          PROFILE.firstName = PROFILE.fullName.split(" ")[0];
          PROFILE.initials = PROFILE.fullName.split(" ").map((p) => p[0]).join("").slice(0, 2).toUpperCase();
        }
        if (emailEl && emailEl.value.trim()) PROFILE.email = emailEl.value.trim();
        state.isSignedIn = true;
        PROFILE.lastSyncedAt = "Just now";
        showToast("Account synced");
        navigate("home");
        return;
      }

      // Home: hide toggle
      if (t.closest("#toggleHideBtn") || t.closest("#hideToggleRow")) {
        state.hideBalances = !state.hideBalances;
        renderApp();
        return;
      }

      // Home: allocation segment / legend
      const allocSeg = t.closest("[data-alloc-id]");
      if (allocSeg) {
        const id = allocSeg.getAttribute("data-alloc-id");
        state.allocSelectedId = state.allocSelectedId === id ? null : id;
        renderApp();
        return;
      }
      const allocLeg = t.closest("[data-alloc-legend]");
      if (allocLeg) {
        const id = allocLeg.getAttribute("data-alloc-legend");
        if (state.allocSelectedId === id) {
          navigate(`wallet/${id}`);
        } else {
          state.allocSelectedId = id;
          renderApp();
        }
        return;
      }

      // Home / Schedules: tap upcoming to record
      const recSched = t.closest("[data-record-schedule]");
      if (recSched) {
        const s = SCHEDULES.find((x) => x.id === recSched.getAttribute("data-record-schedule"));
        if (s) {
          const w = walletById(s.wallet);
          const signedAmt = s.direction === "income" ? s.amount : -s.amount;
          if (w) w.balance = +(w.balance + signedAmt).toFixed(2);
          TRANSACTIONS.unshift({
            id: "t" + Date.now(),
            title: s.title,
            kind: s.category,
            wallet: s.wallet,
            amount: signedAmt,
            at: "2026-11-24T19:05",
            note: "Recorded from schedule",
          });
          // Advance due date by 1 month or 2 weeks
          const d = new Date(s.due + "T00:00:00");
          d.setDate(d.getDate() + (s.repeat === "weekly" ? 7 : s.repeat === "biweekly" ? 14 : 30));
          s.due = d.toISOString().slice(0, 10);
          showToast(`${s.title} ${fmt(signedAmt, { sign: true })} recorded`);
          if (parseRoute().sheet) closeSheet();
          else renderApp();
        }
        return;
      }

      // Home: Favorite chip quick-add
      const favChip = t.closest("[data-fav-id]");
      if (favChip) {
        const f = FAVORITES.find((x) => x.id === favChip.getAttribute("data-fav-id"));
        if (f) {
          if (f.defaultAmount) {
            const w = walletById(f.wallet);
            const amt = f.direction === "income" ? f.defaultAmount : -f.defaultAmount;
            if (w) w.balance = +(w.balance + amt).toFixed(2);
            TRANSACTIONS.unshift({
              id: "t" + Date.now(),
              title: f.name,
              kind: f.category,
              wallet: f.wallet,
              amount: amt,
              at: "2026-11-24T19:05",
              note: "Quick-add favorite",
            });
            showToast(`${f.name} ${fmt(amt)} saved`);
            renderApp();
          } else {
            state.addTxDraft = {
              direction: f.direction,
              amountStr: "0",
              category: f.category,
              wallet: f.wallet,
              note: f.name,
              date: "2026-11-24",
              saveFav: false,
            };
            navigate("sheet/add-tx");
          }
        }
        return;
      }

      // Wallets: reorder toggle & move
      if (t.closest("#toggleReorderBtn")) {
        state.reorderMode = !state.reorderMode;
        renderApp();
        return;
      }
      const moveBtn = t.closest("[data-move-wallet]");
      if (moveBtn) {
        const [idxStr, dirStr] = moveBtn.getAttribute("data-move-wallet").split(":");
        const idx = +idxStr, dir = +dirStr;
        const next = idx + dir;
        if (next >= 0 && next < WALLETS.length) {
          const [item] = WALLETS.splice(idx, 1);
          WALLETS.splice(next, 0, item);
          renderApp();
        }
        return;
      }

      // Wallet detail underline tabs
      const wtab = t.closest("[data-wtab]");
      if (wtab) {
        state.walletFilter = wtab.getAttribute("data-wtab");
        renderApp();
        return;
      }

      // Activity controls
      if (t.closest("#prevMonthBtn")) { state.activityMonthOffset = Math.max(-1, state.activityMonthOffset - 1); state.selectedChartIdx = null; state.selectedHeatDay = null; renderApp(); return; }
      if (t.closest("#nextMonthBtn")) { state.activityMonthOffset = Math.min(0, state.activityMonthOffset + 1); state.selectedChartIdx = null; state.selectedHeatDay = null; renderApp(); return; }
      const rngBtn = t.closest("[data-range]");
      if (rngBtn) { state.activityRange = rngBtn.getAttribute("data-range"); state.selectedChartIdx = null; renderApp(); return; }
      const barEl = t.closest("[data-bar-idx]");
      if (barEl) { const i = +barEl.getAttribute("data-bar-idx"); state.selectedChartIdx = state.selectedChartIdx === i ? null : i; renderApp(); return; }
      const heatEl = t.closest("[data-heat-day]");
      if (heatEl) { const d = +heatEl.getAttribute("data-heat-day"); state.selectedHeatDay = state.selectedHeatDay === d ? null : d; renderApp(); return; }
      if (t.closest("#clearHeatBtn")) { state.selectedHeatDay = null; renderApp(); return; }
      const lfilt = t.closest("[data-lfilter]");
      if (lfilt) { state.ledgerFilter = lfilt.getAttribute("data-lfilter"); renderApp(); return; }
      if (t.closest("#loadMoreBtn")) { state.ledgerLimit += 12; renderApp(); return; }
      if (t.closest("#exportCsvBtn") || t.closest("#cmdExportBtn")) { exportCsv(TRANSACTIONS); return; }

      // Settings toggles & actions
      if (t.closest("#themeToggleRow")) { state.theme = state.theme === "dark" ? "light" : "dark"; renderApp(); return; }
      const accOpt = t.closest("[data-accent-pick]");
      if (accOpt) { state.accent = accOpt.getAttribute("data-accent-pick"); renderApp(); return; }
      if (t.closest("#lockToggleRow")) { state.appLockEnabled = !state.appLockEnabled; renderApp(); return; }
      if (t.closest("#bioToggleRow")) { state.biometricEnabled = !state.biometricEnabled; renderApp(); return; }
      if (t.closest("#syncNowBtn")) {
        state.syncing = true; renderApp();
        setTimeout(() => { state.syncing = false; PROFILE.lastSyncedAt = "Just now"; showToast("Cloud backup synced"); renderApp(); }, 700);
        return;
      }
      if (t.closest("#resetDemoBtn")) {
        resetDemoData();
        showToast("Demo data restored");
        renderApp();
        return;
      }

      // Sheet: Add Tx keypad & controls
      const padKey = t.closest("[data-pad-key]");
      if (padKey && state.addTxDraft) {
        const k = padKey.getAttribute("data-pad-key");
        let s = state.addTxDraft.amountStr;
        if (k === "⌫") {
          s = s.length > 1 ? s.slice(0, -1) : "0";
        } else if (k === ".") {
          if (!s.includes(".")) s += ".";
        } else {
          if (s === "0") s = k;
          else if (!s.includes(".") || s.split(".")[1].length < 2) {
            if (s.length < 9) s += k;
          }
        }
        state.addTxDraft.amountStr = s;
        renderApp();
        return;
      }
      const dirBtn = t.closest("[data-tx-dir]");
      if (dirBtn && state.addTxDraft) {
        const dir = dirBtn.getAttribute("data-tx-dir");
        state.addTxDraft.direction = dir;
        state.addTxDraft.category = (dir === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES)[0][0];
        renderApp();
        return;
      }
      const catBtn = t.closest("[data-tx-cat]");
      if (catBtn && state.addTxDraft) { state.addTxDraft.category = catBtn.getAttribute("data-tx-cat"); renderApp(); return; }
      const walBtn = t.closest("[data-tx-wallet]");
      if (walBtn && state.addTxDraft) { state.addTxDraft.wallet = walBtn.getAttribute("data-tx-wallet"); renderApp(); return; }

      if (t.closest("#saveTxBtn") && state.addTxDraft) {
        const d = state.addTxDraft;
        const val = parseFloat(d.amountStr);
        if (!val || val <= 0) return;
        const isInc = d.direction === "income";
        const signed = isInc ? val : -val;
        const w = walletById(d.wallet);
        if (w) w.balance = +(w.balance + signed).toFixed(2);
        const title = d.note.trim() || d.category;
        TRANSACTIONS.unshift({
          id: "t" + Date.now(),
          title,
          kind: d.category,
          wallet: d.wallet,
          amount: signed,
          at: `${d.date}T19:05`,
          note: d.note.trim() || undefined,
        });
        if (d.saveFav) {
          FAVORITES.push({ id: "f" + Date.now(), name: title, direction: d.direction, category: d.category, wallet: d.wallet, defaultAmount: val });
        }
        showToast(`${isInc ? "Income" : "Expense"} saved · ${fmt(signed, { sign: isInc })}`);
        closeSheet();
        return;
      }

      // Sheet: Transfer
      if (t.closest("#trSwapBtn") && state.transferDraft) {
        const tmp = state.transferDraft.from;
        state.transferDraft.from = state.transferDraft.to;
        state.transferDraft.to = tmp;
        renderApp();
        return;
      }
      if (t.closest("#confirmTransferBtn") && state.transferDraft) {
        const d = state.transferDraft;
        const amt = parseFloat(d.amount) || 0;
        const fee = parseFloat(d.fee) || 0;
        if (amt <= 0 || d.from === d.to) return;
        const fw = walletById(d.from), tw = walletById(d.to);
        if (fw) fw.balance = +(fw.balance - amt - fee).toFixed(2);
        if (tw) tw.balance = +(tw.balance + amt).toFixed(2);
        TRANSACTIONS.unshift({
          id: "t" + Date.now(),
          title: `${fw?.name || d.from} to ${tw?.name || d.to}`,
          kind: "Transfer",
          wallet: d.from,
          to: d.to,
          amount: -amt,
          at: "2026-11-24T19:05",
          note: d.note.trim() || (fee > 0 ? `Fee ${fmt(fee)}` : undefined),
        });
        state.transferDraft = null;
        showToast(`Transfer complete · ${fmt(amt)}`);
        closeSheet();
        return;
      }

      // Sheet: Update Balance
      const updWal = t.closest("[data-upd-wallet]");
      if (updWal && state.updateDraft) { state.updateDraft.wallet = updWal.getAttribute("data-upd-wallet"); renderApp(); return; }
      const updMode = t.closest("[data-upd-mode]");
      if (updMode && state.updateDraft) { state.updateDraft.mode = updMode.getAttribute("data-upd-mode"); renderApp(); return; }
      if (t.closest("#saveUpdateBalBtn") && state.updateDraft) {
        const d = state.updateDraft;
        const w = walletById(d.wallet);
        const val = parseFloat(d.amount);
        if (!w || isNaN(val)) return;
        const nextBal = d.mode === "add" ? w.balance + val : d.mode === "sub" ? w.balance - val : val;
        const delta = +(nextBal - w.balance).toFixed(2);
        w.balance = +nextBal.toFixed(2);
        TRANSACTIONS.unshift({
          id: "t" + Date.now(),
          title: "Balance adjustment",
          kind: "Updated",
          wallet: w.id,
          amount: delta,
          at: "2026-11-24T19:05",
          note: `${w.name} reconciled`,
        });
        state.updateDraft = null;
        showToast(`${w.name} updated · ${fmt(w.balance)}`);
        closeSheet();
        return;
      }

      // Sheet: Add Wallet
      const presetBtn = t.closest("[data-preset-pick]");
      if (presetBtn && state.addWalletDraft) {
        const [grp, name] = presetBtn.getAttribute("data-preset-pick").split(":");
        state.addWalletDraft.type = grp;
        state.addWalletDraft.name = name;
        const colorByPreset = { GCash: "#0a5bff", Maya: "#00b464", BPI: "#c8102e", GoTyme: "#16b3a6", Cash: "#3f8f5a", BDO: "#003580", UnionBank: "#f26522", ShopeePay: "#ee4d2d", GrabPay: "#00b14f" };
        if (colorByPreset[name]) state.addWalletDraft.brand = colorByPreset[name];
        renderApp();
        return;
      }
      const awCol = t.closest("[data-aw-color]");
      if (awCol && state.addWalletDraft) { state.addWalletDraft.brand = awCol.getAttribute("data-aw-color"); renderApp(); return; }
      if (t.closest("#saveNewWalletBtn") && state.addWalletDraft) {
        const d = state.addWalletDraft;
        if (!d.name.trim()) return;
        const bal = parseFloat(d.balance) || 0;
        const id = d.name.toLowerCase().replace(/[^a-z0-9]/g, "") + "_" + Date.now().toString().slice(-3);
        WALLETS.push({
          id,
          name: d.name.trim(),
          type: d.type,
          account: d.account.trim() || "Personal",
          balance: +bal.toFixed(2),
          mark: d.name.trim().slice(0, 2).toUpperCase(),
          logo: logoKeyFromName(d.name),
          brand: d.brand,
          number: d.type === "Cash" ? "Physical" : "•••• " + Math.floor(1000 + Math.random() * 8999),
        });
        state.addWalletDraft = null;
        state.lastMainRoute = "wallets";
        showToast(`${d.name.trim()} added`);
        closeSheet();
        return;
      }

      // Sheet: Edit Wallet
      const ewCol = t.closest("[data-ew-color]");
      if (ewCol && state.editWalletDraft) { state.editWalletDraft.brand = ewCol.getAttribute("data-ew-color"); renderApp(); return; }
      if (t.closest("#saveEditWalletBtn") && state.editWalletDraft) {
        const d = state.editWalletDraft;
        const w = walletById(d.id);
        if (w) {
          w.name = d.name.trim() || w.name;
          w.account = d.account.trim() || w.account;
          w.type = d.type;
          w.number = d.number.trim() || w.number;
          w.brand = d.brand;
        }
        showToast("Wallet updated");
        closeSheet();
        return;
      }
      if (t.closest("#deleteWalletTriggerBtn") && state.editWalletDraft) {
        const w = walletById(state.editWalletDraft.id);
        state.confirmCtx = { kind: "wallet", id: w?.id, title: `Delete ${w?.name || "wallet"}?`, desc: "Its balance will be removed from your combined total." };
        navigate("sheet/confirm-delete");
        return;
      }

      // Sheet: Tx Detail actions
      const txFav = t.closest("[data-tx-fav]");
      if (txFav) {
        const tx = TRANSACTIONS.find((x) => x.id === txFav.getAttribute("data-tx-fav"));
        if (tx) {
          FAVORITES.push({ id: "f" + Date.now(), name: tx.title, direction: tx.amount > 0 ? "income" : "expense", category: tx.kind, wallet: tx.wallet, defaultAmount: Math.abs(tx.amount) });
          showToast("Saved to favorites");
        }
        return;
      }
      const txRec = t.closest("[data-tx-recur]");
      if (txRec) {
        const tx = TRANSACTIONS.find((x) => x.id === txRec.getAttribute("data-tx-recur"));
        if (tx) {
          state.scheduleDraft = { id: null, title: tx.title, amount: String(Math.abs(tx.amount)), direction: tx.amount > 0 ? "income" : "expense", category: tx.kind, wallet: tx.wallet, due: "2026-12-01", repeat: "monthly", reminder: true };
          navigate("sheet/schedule-edit");
        }
        return;
      }
      const txDel = t.closest("[data-tx-del]");
      if (txDel) {
        const tx = TRANSACTIONS.find((x) => x.id === txDel.getAttribute("data-tx-del"));
        state.confirmCtx = { kind: "tx", id: tx?.id, title: "Delete transaction?", desc: `Remove "${tx?.title}" (${fmt(tx?.amount || 0)}) and adjust wallet balance?` };
        navigate("sheet/confirm-delete");
        return;
      }

      // Sheet: Edit Tx save
      if (t.closest("#saveEditTxBtn") && state.editTxDraft) {
        const d = state.editTxDraft;
        const tx = TRANSACTIONS.find((x) => x.id === d.id);
        if (tx) {
          const oldSigned = tx.amount;
          const oldW = walletById(tx.wallet);
          if (oldW && !isTransfer(tx)) oldW.balance = +(oldW.balance - oldSigned).toFixed(2);
          const sign = tx.amount > 0 ? 1 : -1;
          const newAmt = +(sign * Math.abs(parseFloat(d.amount) || 0)).toFixed(2);
          tx.title = d.title.trim() || tx.title;
          tx.amount = newAmt;
          tx.kind = d.kind;
          tx.wallet = d.wallet;
          tx.note = d.note.trim() || undefined;
          tx.at = `${d.date}T${tx.at.slice(11) || "12:00"}`;
          const newW = walletById(tx.wallet);
          if (newW && !isTransfer(tx)) newW.balance = +(newW.balance + newAmt).toFixed(2);
          showToast("Transaction updated");
        }
        closeSheet();
        return;
      }

      // Sheet: Schedules
      const edSched = t.closest("[data-edit-sched]");
      if (edSched) {
        const s = SCHEDULES.find((x) => x.id === edSched.getAttribute("data-edit-sched"));
        if (s) {
          state.scheduleDraft = { ...s, amount: String(s.amount) };
          navigate("sheet/schedule-edit");
        }
        return;
      }
      if (t.closest("#newScheduleBtn")) {
        state.scheduleDraft = null;
        navigate("sheet/schedule-edit");
        return;
      }
      const scDir = t.closest("[data-sc-dir]");
      if (scDir && state.scheduleDraft) { state.scheduleDraft.direction = scDir.getAttribute("data-sc-dir"); state.scheduleDraft.category = (state.scheduleDraft.direction === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES)[0][0]; renderApp(); return; }
      const scRep = t.closest("[data-sc-repeat]");
      if (scRep && state.scheduleDraft) { state.scheduleDraft.repeat = scRep.getAttribute("data-sc-repeat"); renderApp(); return; }
      if (t.closest("#scRemToggle") && state.scheduleDraft) { state.scheduleDraft.reminder = !state.scheduleDraft.reminder; renderApp(); return; }
      if (t.closest("#saveScheduleBtn") && state.scheduleDraft) {
        const d = state.scheduleDraft;
        const amt = parseFloat(d.amount) || 0;
        if (!d.title.trim() || amt <= 0) { showToast("Enter a name and amount"); return; }
        if (d.id) {
          const idx = SCHEDULES.findIndex((x) => x.id === d.id);
          if (idx >= 0) SCHEDULES[idx] = { ...d, amount: amt };
        } else {
          SCHEDULES.push({ ...d, id: "s" + Date.now(), amount: amt });
        }
        state.scheduleDraft = null;
        showToast("Schedule saved");
        navigate("sheet/schedules");
        return;
      }
      if (t.closest("#deleteScheduleBtn") && state.scheduleDraft?.id) {
        const idx = SCHEDULES.findIndex((x) => x.id === state.scheduleDraft.id);
        if (idx >= 0) SCHEDULES.splice(idx, 1);
        state.scheduleDraft = null;
        showToast("Schedule deleted");
        navigate("sheet/schedules");
        return;
      }

      // Sheet: Monthly Budget
      const mbPreset = t.closest("[data-mb-preset]");
      if (mbPreset) {
        state.monthlyBudget = +mbPreset.getAttribute("data-mb-preset");
        renderApp();
        return;
      }
      if (t.closest("#saveMonthlyBudgetBtn")) {
        const val = parseFloat(document.getElementById("monthlyBudgetInput")?.value);
        if (val > 0) state.monthlyBudget = val;
        showToast("Monthly budget updated");
        closeSheet();
        return;
      }

      // Sheet: Category Budget
      if (t.closest("#saveCatLimitBtn")) {
        const cat = t.closest("#saveCatLimitBtn").getAttribute("data-cat-name");
        const val = parseFloat(document.getElementById("catLimitInput")?.value);
        if (val > 0) CATEGORY_LIMITS[cat] = val;
        showToast(`${cat} limit saved`);
        closeSheet();
        return;
      }
      if (t.closest("#removeCatLimitBtn")) {
        const cat = t.closest("#removeCatLimitBtn").getAttribute("data-cat-name");
        delete CATEGORY_LIMITS[cat];
        showToast(`${cat} limit removed`);
        closeSheet();
        return;
      }

      // Sheet: Favorites
      const delFav = t.closest("[data-del-fav]");
      if (delFav) {
        const id = delFav.getAttribute("data-del-fav");
        const idx = FAVORITES.findIndex((f) => f.id === id);
        if (idx >= 0) FAVORITES.splice(idx, 1);
        showToast("Favorite removed");
        renderApp();
        return;
      }
      if (t.closest("#saveFavBtn") && state.favDraft) {
        const d = state.favDraft;
        if (!d.name.trim()) { showToast("Enter a shortcut name"); return; }
        FAVORITES.push({
          id: "f" + Date.now(),
          name: d.name.trim(),
          direction: "expense",
          category: d.category,
          wallet: d.wallet,
          defaultAmount: d.defaultAmount ? parseFloat(d.defaultAmount) : null,
        });
        state.favDraft = null;
        showToast("Favorite added");
        renderApp();
        return;
      }

      // Sheet: Profile
      if (t.closest("#saveProfileBtn")) {
        const nm = document.getElementById("profNameInput")?.value.trim();
        const em = document.getElementById("profEmailInput")?.value.trim();
        if (nm) {
          PROFILE.fullName = nm;
          PROFILE.firstName = nm.split(" ")[0];
          PROFILE.initials = nm.split(" ").map((p) => p[0]).join("").slice(0, 2).toUpperCase();
        }
        if (em) PROFILE.email = em;
        showToast("Profile updated");
        closeSheet();
        return;
      }

      // Sheet: PIN change
      if (t.closest("#saveNewPinBtn")) {
        const oldP = document.getElementById("pinOldInput")?.value.trim();
        const newP = document.getElementById("pinNewInput")?.value.trim();
        if (oldP !== state.pinCode) { showToast("Current PIN incorrect"); return; }
        if (!/^\d{4}$/.test(newP || "")) { showToast("Enter a 4-digit PIN"); return; }
        state.pinCode = newP;
        showToast("Passcode updated");
        closeSheet();
        return;
      }

      // Sheet: Confirm Delete
      if (t.closest("#confirmDeleteExecBtn") && state.confirmCtx) {
        const ctx = state.confirmCtx;
        if (ctx.kind === "tx") {
          const idx = TRANSACTIONS.findIndex((x) => x.id === ctx.id);
          if (idx >= 0) {
            const [tx] = TRANSACTIONS.splice(idx, 1);
            const w = walletById(tx.wallet);
            if (w && !isTransfer(tx)) w.balance = +(w.balance - tx.amount).toFixed(2);
          }
          showToast("Transaction deleted");
        } else if (ctx.kind === "wallet") {
          const idx = WALLETS.findIndex((x) => x.id === ctx.id);
          if (idx >= 0) WALLETS.splice(idx, 1);
          state.lastMainRoute = WALLETS.length ? "wallets" : "empty";
          showToast("Wallet deleted");
        }
        state.confirmCtx = null;
        closeSheet();
        return;
      }
    });

    /* Input & Select live bindings */
    appShell.addEventListener("input", (e) => {
      const t = e.target;
      if (t.id === "ledgerSearchInput") { state.ledgerSearch = t.value; renderApp(); setTimeout(() => { const el = document.getElementById("ledgerSearchInput"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0); }
      if (t.id === "cmdSearchInput") { state.searchQuery = t.value; renderApp(); setTimeout(() => { const el = document.getElementById("cmdSearchInput"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0); }
      if (t.id === "txNoteInput" && state.addTxDraft) state.addTxDraft.note = t.value;
      if (t.id === "trAmountInput" && state.transferDraft) { state.transferDraft.amount = t.value; }
      if (t.id === "trFeeInput" && state.transferDraft) { state.transferDraft.fee = t.value; }
      if (t.id === "trNoteInput" && state.transferDraft) { state.transferDraft.note = t.value; }
      if (t.id === "updAmountInput" && state.updateDraft) { state.updateDraft.amount = t.value; renderApp(); setTimeout(() => { const el = document.getElementById("updAmountInput"); if (el) el.focus(); }, 0); }
      if (t.id === "presetSearchInput" && state.addWalletDraft) { state.addWalletDraft.query = t.value; renderApp(); setTimeout(() => { const el = document.getElementById("presetSearchInput"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0); }
      if (t.id === "awNameInput" && state.addWalletDraft) { state.addWalletDraft.name = t.value; const b = document.getElementById("saveNewWalletBtn"); if (b) b.disabled = !t.value.trim(); }
      if (t.id === "awAccInput" && state.addWalletDraft) state.addWalletDraft.account = t.value;
      if (t.id === "awBalInput" && state.addWalletDraft) state.addWalletDraft.balance = t.value;
      if (t.id === "ewNameInput" && state.editWalletDraft) state.editWalletDraft.name = t.value;
      if (t.id === "ewAccInput" && state.editWalletDraft) state.editWalletDraft.account = t.value;
      if (t.id === "ewNumInput" && state.editWalletDraft) state.editWalletDraft.number = t.value;
      if (t.id === "etTitleInput" && state.editTxDraft) state.editTxDraft.title = t.value;
      if (t.id === "etAmtInput" && state.editTxDraft) state.editTxDraft.amount = t.value;
      if (t.id === "etNoteInput" && state.editTxDraft) state.editTxDraft.note = t.value;
      if (t.id === "scTitleInput" && state.scheduleDraft) state.scheduleDraft.title = t.value;
      if (t.id === "scAmtInput" && state.scheduleDraft) state.scheduleDraft.amount = t.value;
      if (t.id === "favNameInput" && state.favDraft) state.favDraft.name = t.value;
      if (t.id === "favAmtInput" && state.favDraft) state.favDraft.defaultAmount = t.value;
    });

    appShell.addEventListener("change", (e) => {
      const t = e.target;
      if (t.id === "ledgerWalletSelect") { state.ledgerWallet = t.value; renderApp(); }
      if (t.id === "txDateInput" && state.addTxDraft) state.addTxDraft.date = t.value;
      if (t.id === "txSaveFavCheck" && state.addTxDraft) state.addTxDraft.saveFav = t.checked;
      if (t.id === "trFromSel" && state.transferDraft) { state.transferDraft.from = t.value; renderApp(); }
      if (t.id === "trToSel" && state.transferDraft) { state.transferDraft.to = t.value; renderApp(); }
      if (t.id === "awTypeSel" && state.addWalletDraft) state.addWalletDraft.type = t.value;
      if (t.id === "ewTypeSel" && state.editWalletDraft) state.editWalletDraft.type = t.value;
      if (t.id === "etDateInput" && state.editTxDraft) state.editTxDraft.date = t.value;
      if (t.id === "etCatSel" && state.editTxDraft) state.editTxDraft.kind = t.value;
      if (t.id === "etWalletSel" && state.editTxDraft) state.editTxDraft.wallet = t.value;
      if (t.id === "scDueInput" && state.scheduleDraft) state.scheduleDraft.due = t.value;
      if (t.id === "scCatSel" && state.scheduleDraft) state.scheduleDraft.category = t.value;
      if (t.id === "scWalletSel" && state.scheduleDraft) state.scheduleDraft.wallet = t.value;
      if (t.id === "favCatSel" && state.favDraft) state.favDraft.category = t.value;
      if (t.id === "favWalletSel" && state.favDraft) state.favDraft.wallet = t.value;
    });

    /* Boot */
    window.addEventListener("hashchange", renderApp);
    if (!window.location.hash) {
      window.location.hash = "#/intro";
    } else {
      renderApp();
    }
  })();
  </script>
</body>
</html>
