function exportCsv() {
  const rows = [["Date", "Title", "Kind", "Wallet", "Amount", "Note"]];
  TRANSACTIONS.forEach((t) => {
    const w = walletById(t.wallet);
    rows.push([t.at, t.title, t.kind, w ? w.name : t.wallet, t.amount.toFixed(2), t.note || ""]);
  });
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "pitaka-kaha-transactions.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  showToast("CSV exported");
}

function resetDemo() {
  const snap = JSON.parse(SEED_SNAPSHOT);
  Object.assign(PROFILE, snap.PROFILE);
  WALLETS.splice(0, WALLETS.length, ...snap.WALLETS);
  TRANSACTIONS.splice(0, TRANSACTIONS.length, ...snap.TRANSACTIONS);
  Object.keys(CATEGORY_LIMITS).forEach((k) => delete CATEGORY_LIMITS[k]);
  Object.assign(CATEGORY_LIMITS, snap.CATEGORY_LIMITS);
  FAVORITES.splice(0, FAVORITES.length, ...snap.FAVORITES);
  SCHEDULES.splice(0, SCHEDULES.length, ...snap.SCHEDULES);
  state.monthlyBudget = snap.MONTHLY_BUDGET;
  state.hideBalances = false;
  state.pocketFlipped = false;
  state.selectedDonutCat = null;
  showToast("Demo data restored");
  render();
}

document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const act = target.dataset.action;

  if (act === "go") {
    navigate(target.dataset.route);
    return;
  }
  if (act === "skip-intro") {
    navigate(state.appLock ? "lock" : "home");
    return;
  }
  if (act === "toggle-fab") {
    state.fabOpen = !state.fabOpen;
    render();
    return;
  }
  if (act === "close-fab") {
    state.fabOpen = false;
    render();
    return;
  }
  if (act === "fab-pick") {
    state.fabOpen = false;
    navigate(target.dataset.route);
    return;
  }
  if (act === "backdrop-close") {
    if (e.target === target) {
      navigate(state.lastParentRoute || "home");
    }
    return;
  }
  if (act === "close-sheet") {
    navigate(state.lastParentRoute || "home");
    return;
  }
  if (act === "toggle-hide") {
    state.hideBalances = !state.hideBalances;
    render();
    return;
  }
  if (act === "toggle-flip") {
    state.pocketFlipped = !state.pocketFlipped;
    render();
    return;
  }
  if (act === "toggle-reorder") {
    state.reorderMode = !state.reorderMode;
    render();
    return;
  }
  if (act === "move-wallet") {
    const idx = parseInt(target.dataset.idx, 10);
    const dir = parseInt(target.dataset.dir, 10);
    const next = idx + dir;
    if (next >= 0 && next < WALLETS.length) {
      const [item] = WALLETS.splice(idx, 1);
      WALLETS.splice(next, 0, item);
      render();
    }
    return;
  }
  if (act === "set-wallet-filter") {
    state.walletFilter = target.dataset.val;
    render();
    return;
  }
  if (act === "set-range") {
    state.activityRange = target.dataset.val;
    state.selectedDonutCat = null;
    render();
    return;
  }
  if (act === "select-donut") {
    const c = target.dataset.cat;
    state.selectedDonutCat = !c || state.selectedDonutCat === c ? null : c;
    render();
    return;
  }
  if (act === "set-act-filter") {
    state.activityFilter = target.dataset.val;
    render();
    return;
  }
  if (act === "set-act-wallet") {
    state.activityWallet = target.dataset.val;
    render();
    return;
  }
  if (act === "load-more-tx") {
    state.activityLimit += 12;
    render();
    return;
  }
  if (act === "export-csv") {
    exportCsv();
    return;
  }
  if (act === "toggle-theme") {
    state.theme = state.theme === "dark" ? "light" : "dark";
    render();
    return;
  }
  if (act === "set-accent") {
    state.accent = target.dataset.id;
    render();
    return;
  }
  if (act === "toggle-lock") {
    state.appLock = !state.appLock;
    render();
    return;
  }
  if (act === "toggle-bio") {
    state.biometrics = !state.biometrics;
    render();
    return;
  }
  if (act === "sync-now") {
    state.syncing = true;
    render();
    setTimeout(() => {
      state.syncing = false;
      PROFILE.lastSyncedAt = "Just now";
      showToast("Cloud backup synced");
      render();
    }, 650);
    return;
  }
  if (act === "reset-demo") {
    resetDemo();
    return;
  }
  if (act === "auth-submit") {
    state.signedIn = true;
    showToast("Signed in as " + PROFILE.firstName);
    navigate("home");
    return;
  }

  // PIN Lock interactions
  if (act === "pin-key") {
    if (state.pinEntry.length >= 4) return;
    state.pinEntry += target.dataset.key;
    state.pinShake = false;
    render();
    if (state.pinEntry.length === 4) {
      if (state.pinEntry === state.pin || state.pinFailedOnce) {
        state.pinEntry = "";
        state.pinFailedOnce = false;
        navigate("home");
      } else {
        state.pinShake = true;
        state.pinFailedOnce = true;
        render();
        setTimeout(() => {
          state.pinEntry = "";
          state.pinShake = false;
          render();
        }, 420);
      }
    }
    return;
  }
  if (act === "pin-del") {
    state.pinEntry = state.pinEntry.slice(0, -1);
    render();
    return;
  }
  if (act === "unlock-bio") {
    state.pinEntry = "";
    showToast("Unlocked with Face ID");
    navigate("home");
    return;
  }

  // Calculator keypad
  if (act === "calc-key") {
    calcInput(target.dataset.key);
    // Preserve typed note before re-rendering
    const noteEl = document.getElementById("tx-note-input");
    if (noteEl) state.txDraft.note = noteEl.value;
    const feeEl = document.getElementById("tr-fee-input");
    if (feeEl) state.transferDraft.fee = feeEl.value;
    render();
    return;
  }

  // Add / Edit Tx Draft controls
  if (act === "draft-dir") {
    const dir = target.dataset.val;
    state.txDraft.direction = dir;
    state.txDraft.category = dir === "income" ? "Salary" : "Food";
    render();
    return;
  }
  if (act === "draft-cat") {
    const noteEl = document.getElementById("tx-note-input");
    if (noteEl) state.txDraft.note = noteEl.value;
    state.txDraft.category = target.dataset.val;
    render();
    return;
  }
  if (act === "draft-wallet") {
    const noteEl = document.getElementById("tx-note-input");
    if (noteEl) state.txDraft.note = noteEl.value;
    state.txDraft.wallet = target.dataset.val;
    render();
    return;
  }
  if (act === "draft-date-cycle") {
    state.txDraft.date = state.txDraft.date === "2026-11-24" ? "2026-11-23" : "2026-11-24";
    render();
    return;
  }
  if (act === "toggle-save-fav") {
    state.txDraft.saveFav = !state.txDraft.saveFav;
    render();
    return;
  }
  if (act === "save-tx") {
    const noteEl = document.getElementById("tx-note-input");
    if (noteEl) state.txDraft.note = noteEl.value.trim();
    const amt = calcResolvedAmount();
    if (amt <= 0) { showToast("Enter an amount greater than 0"); return; }
    const d = state.txDraft;
    const signed = d.direction === "income" ? amt : -amt;
    const w = walletById(d.wallet);
    if (d.editId) {
      const orig = TRANSACTIONS.find((x) => x.id === d.editId);
      if (orig) {
        const oldW = walletById(orig.wallet);
        if (oldW) oldW.balance -= orig.amount;
        orig.title = d.note || d.category;
        orig.kind = d.category;
        orig.wallet = d.wallet;
        orig.amount = signed;
        if (w) w.balance += signed;
      }
      showToast("Transaction updated");
    } else {
      if (w) w.balance += signed;
      TRANSACTIONS.unshift({
        id: "t" + Date.now(),
        title: d.note || d.category,
        kind: d.category,
        wallet: d.wallet,
        amount: signed,
        at: `${d.date}T19:05`,
        note: d.note || undefined,
      });
      if (d.saveFav) {
        FAVORITES.push({
          id: "f" + Date.now(),
          name: d.note || d.category,
          direction: d.direction,
          category: d.category,
          wallet: d.wallet,
          defaultAmount: amt,
        });
      }
      showToast(d.direction === "income" ? "Money in saved" : "Expense saved");
    }
    navigate(state.lastParentRoute || "home");
    return;
  }

  // Transfer actions
  if (act === "tr-from") {
    state.transferDraft.from = target.dataset.val;
    if (state.transferDraft.to === state.transferDraft.from) {
      state.transferDraft.to = WALLETS.find((w) => w.id !== state.transferDraft.from)?.id || state.transferDraft.to;
    }
    render();
    return;
  }
  if (act === "tr-to") {
    state.transferDraft.to = target.dataset.val;
    render();
    return;
  }
  if (act === "tr-swap") {
    const tmp = state.transferDraft.from;
    state.transferDraft.from = state.transferDraft.to;
    state.transferDraft.to = tmp;
    render();
    return;
  }
  if (act === "tr-toggle-fee") {
    state.transferDraft.showFee = !state.transferDraft.showFee;
    render();
    return;
  }
  if (act === "save-transfer") {
    const feeEl = document.getElementById("tr-fee-input");
    const fee = feeEl ? Math.max(0, parseFloat(feeEl.value) || 0) : 0;
    const amt = calcResolvedAmount();
    if (amt <= 0) { showToast("Enter transfer amount"); return; }
    const d = state.transferDraft;
    if (d.from === d.to) { showToast("Choose two different wallets"); return; }
    const wf = walletById(d.from);
    const wt = walletById(d.to);
    if (wf) wf.balance -= (amt + fee);
    if (wt) wt.balance += amt;
    TRANSACTIONS.unshift({
      id: "t" + Date.now(),
      title: `${wf ? wf.name : d.from} to ${wt ? wt.name : d.to}`,
      kind: "Transfer",
      wallet: d.from,
      to: d.to,
      amount: -amt,
      at: "2026-11-24T19:05",
      note: fee > 0 ? `Includes ₱${fee} fee` : undefined,
    });
    showToast("Transfer complete");
    navigate(state.lastParentRoute || "home");
    return;
  }

  // Update balance
  if (act === "upd-wallet") { state.updateDraft.wallet = target.dataset.val; render(); return; }
  if (act === "upd-mode") { state.updateDraft.mode = target.dataset.val; render(); return; }
  if (act === "save-update") {
    const d = state.updateDraft;
    const w = walletById(d.wallet);
    if (!w) return;
    const val = calcResolvedAmount();
    const targetBal = d.mode === "add" ? w.balance + val : d.mode === "sub" ? Math.max(0, w.balance - val) : val;
    const diff = targetBal - w.balance;
    w.balance = targetBal;
    TRANSACTIONS.unshift({
      id: "t" + Date.now(),
      title: "Balance adjustment",
      kind: "Updated",
      wallet: w.id,
      amount: diff,
      at: "2026-11-24T19:05",
      note: `Manual ${d.mode}`,
    });
    showToast("Balance updated");
    navigate(state.lastParentRoute || "home");
    return;
  }

  // Wallet Add / Edit / Delete
  if (act === "pick-preset") {
    const name = target.dataset.name;
    const grp = target.dataset.type;
    state.walletDraft.preset = name;
    state.walletDraft.type = grp;
    state.walletDraft.name = name;
    const slug = name.toLowerCase().replace(/[^a-z]/g, "");
    const colorMap = { gcash:"#0a5bff", maya:"#00b464", bpi:"#c8102e", gotyme:"#16b3a6", cash:"#3f8f5a", bdo:"#0033a0", unionbank:"#ff6b00" };
    if (colorMap[slug]) state.walletDraft.brand = colorMap[slug];
    render();
    return;
  }
  if (act === "wal-color") {
    state.walletDraft.brand = target.dataset.val;
    render();
    return;
  }
  if (act === "save-wallet") {
    const name = (document.getElementById("wal-name-input")?.value || "").trim() || "Wallet";
    const acc = (document.getElementById("wal-acc-input")?.value || "").trim() || "Personal";
    const d = state.walletDraft;
    if (d.editId) {
      const w = walletById(d.editId);
      if (w) { w.name = name; w.account = acc; w.brand = d.brand; }
      showToast("Wallet updated");
      navigate(`wallet/${d.editId}`);
    } else {
      const bal = Math.max(0, parseFloat(document.getElementById("wal-bal-input")?.value) || 0);
      const slug = name.toLowerCase().replace(/[^a-z]/g, "");
      const id = slug + Math.floor(Math.random() * 900 + 100);
      WALLETS.push({
        id,
        name,
        type: d.type || "E-wallet",
        account: acc,
        balance: bal,
        mark: name.slice(0, 2).toUpperCase(),
        logo: typeof LOGOS !== "undefined" && LOGOS[slug] ? slug : "",
        brand: d.brand,
        number: d.type === "Cash" ? "Physical" : "•••• " + Math.floor(1000 + Math.random() * 9000),
      });
      showToast(`${name} added`);
      navigate("wallets");
    }
    return;
  }
  if (act === "ask-delete-wallet") {
    const w = walletById(target.dataset.id);
    if (w) {
      state.pendingDelete = { kind: "wallet", id: w.id, title: w.name };
      navigate("sheet/confirm-delete");
    }
    return;
  }
  if (act === "ask-delete-tx") {
    const t = TRANSACTIONS.find((x) => x.id === target.dataset.id);
    if (t) {
      state.pendingDelete = { kind: "transaction", id: t.id, title: t.title };
      navigate("sheet/confirm-delete");
    }
    return;
  }
  if (act === "confirm-delete-go") {
    const pd = state.pendingDelete;
    if (pd) {
      if (pd.kind === "wallet") {
        const i = WALLETS.findIndex((w) => w.id === pd.id);
        if (i >= 0) WALLETS.splice(i, 1);
        state.lastParentRoute = WALLETS.length ? "wallets" : "empty";
        showToast("Wallet deleted");
      } else if (pd.kind === "transaction") {
        const i = TRANSACTIONS.findIndex((t) => t.id === pd.id);
        if (i >= 0) {
          const t = TRANSACTIONS[i];
          const w = walletById(t.wallet);
          if (w) w.balance -= t.amount;
          TRANSACTIONS.splice(i, 1);
        }
        showToast("Transaction deleted");
      }
      state.pendingDelete = null;
    }
    navigate(state.lastParentRoute || "home");
    return;
  }

  // Transaction details actions
  if (act === "edit-tx-start") {
    navigate(`sheet/edit-tx/${target.dataset.id}`);
    return;
  }
  if (act === "fav-from-tx") {
    const t = TRANSACTIONS.find((x) => x.id === target.dataset.id);
    if (t) {
      FAVORITES.push({
        id: "f" + Date.now(),
        name: t.title,
        direction: t.amount > 0 ? "income" : "expense",
        category: t.kind,
        wallet: t.wallet,
        defaultAmount: Math.abs(t.amount),
      });
      showToast("Saved to Favorites");
    }
    return;
  }
  if (act === "sched-from-tx") {
    const t = TRANSACTIONS.find((x) => x.id === target.dataset.id);
    if (t) {
      SCHEDULES.push({
        id: "s" + Date.now(),
        title: t.title,
        amount: Math.abs(t.amount),
        direction: t.amount > 0 ? "income" : "expense",
        category: t.kind,
        wallet: t.wallet,
        due: "2026-12-01",
        repeat: "monthly",
        reminder: true,
      });
      showToast("Added to Schedules");
    }
    return;
  }

  // Favorites & Schedules
  if (act === "use-favorite") {
    const f = FAVORITES.find((x) => x.id === target.dataset.id);
    if (f) {
      navigate("sheet/add-tx");
      state.txDraft = {
        direction: f.direction,
        category: f.category,
        wallet: f.wallet,
        note: f.name,
        date: "2026-11-24",
        saveFav: false,
        editId: null,
      };
      calcReset(f.defaultAmount || 0);
      lastInitRoute = getRoute();
      render();
    }
    return;
  }
  if (act === "record-schedule") {
    const s = SCHEDULES.find((x) => x.id === target.dataset.id);
    if (s) {
      const w = walletById(s.wallet);
      const signed = s.direction === "income" ? s.amount : -s.amount;
      if (w) w.balance += signed;
      TRANSACTIONS.unshift({
        id: "t" + Date.now(),
        title: s.title,
        kind: s.category,
        wallet: s.wallet,
        amount: signed,
        at: "2026-11-24T19:05",
        note: "Recorded from schedule",
      });
      // Advance due date by 14 or 30 days
      const next = new Date(s.due + "T00:00:00");
      next.setDate(next.getDate() + (s.repeat === "weekly" ? 7 : s.repeat === "biweekly" ? 14 : 30));
      s.due = next.toISOString().slice(0, 10);
      showToast(`${s.title} recorded`);
      render();
    }
    return;
  }
  if (act === "sched-dir") { state.schedDraft.direction = target.dataset.val; render(); return; }
  if (act === "sched-repeat") { state.schedDraft.repeat = target.dataset.val; render(); return; }
  if (act === "sched-wallet") { state.schedDraft.wallet = target.dataset.val; render(); return; }
  if (act === "save-schedule") {
    const title = (document.getElementById("sched-title")?.value || "").trim() || "Recurring Bill";
    const amt = Math.max(1, parseFloat(document.getElementById("sched-amt")?.value) || 0);
    const d = state.schedDraft;
    SCHEDULES.push({
      id: "s" + Date.now(),
      title, amount: amt,
      direction: d.direction,
      category: d.direction === "income" ? "Salary" : "Bills",
      wallet: d.wallet, due: d.due, repeat: d.repeat, reminder: true,
    });
    showToast("Schedule added");
    navigate("sheet/schedules");
    return;
  }
  if (act === "save-favorite") {
    const name = (document.getElementById("fav-name-input")?.value || "").trim();
    if (!name) { showToast("Enter favorite name"); return; }
    const amt = parseFloat(document.getElementById("fav-amt-input")?.value) || null;
    FAVORITES.push({
      id: "f" + Date.now(),
      name, direction: "expense", category: "Food", wallet: WALLETS[0]?.id || "gcash", defaultAmount: amt,
    });
    showToast("Favorite saved");
    navigate(state.lastParentRoute || "home");
    return;
  }

  // Budgets, Profile, PIN
  if (act === "preset-budget") {
    const inp = document.getElementById("budget-input");
    if (inp) inp.value = target.dataset.val;
    return;
  }
  if (act === "save-monthly-budget") {
    const v = Math.max(1000, parseFloat(document.getElementById("budget-input")?.value) || MONTHLY_BUDGET);
    state.monthlyBudget = v;
    showToast("Monthly budget updated");
    navigate(state.lastParentRoute || "activity");
    return;
  }
  if (act === "save-cat-budget") {
    const cat = target.dataset.cat;
    const v = Math.max(100, parseFloat(document.getElementById("cat-limit-input")?.value) || 1000);
    CATEGORY_LIMITS[cat] = v;
    showToast(`${cat} limit updated`);
    navigate(state.lastParentRoute || "activity/budgets");
    return;
  }
  if (act === "save-profile") {
    const fn = (document.getElementById("prof-name")?.value || "").trim() || PROFILE.fullName;
    const em = (document.getElementById("prof-email")?.value || "").trim() || PROFILE.email;
    PROFILE.fullName = fn;
    PROFILE.firstName = fn.split(" ")[0];
    PROFILE.initials = fn.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();
    PROFILE.email = em;
    showToast("Profile saved");
    navigate("settings");
    return;
  }
  if (act === "save-pin") {
    const np = (document.getElementById("new-pin-input")?.value || "").replace(/\D/g, "").slice(0, 4);
    if (np.length !== 4) { showToast("Enter 4 digits"); return; }
    state.pin = np;
    showToast("PIN updated");
    navigate("settings");
    return;
  }
});

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
