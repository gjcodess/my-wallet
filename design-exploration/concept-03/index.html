    /* ========================================================================
       6. ROUTER & RENDER ENGINE
       ======================================================================== */
    function parseHash() {
      const raw = window.location.hash.replace(/^#\/?/, "");
      const [pathPart, queryPart = ""] = raw.split("?");
      const path = pathPart.replace(/\/+$/, "");
      return { path, query: queryPart };
    }

    function navigate(route) {
      window.location.hash = `#/${route.replace(/^\/+/, "")}`;
    }

    function closeSheet() {
      state.draftTx = null;
      state.draftFavId = null;
      const bd = document.getElementById("sheet-backdrop");
      bd.classList.remove("open");
      bd.setAttribute("aria-hidden", "true");
      if (window.location.hash.startsWith("#/sheet/")) {
        navigate(state.parentRoute || "home");
      }
    }

    function updateNavChrome(routePath) {
      const nav = document.getElementById("bottom-nav");
      const fab = document.getElementById("fab-entry");
      const hideNav = routePath === "intro" || routePath === "lock" || routePath === "auth";
      nav.classList.toggle("hidden", hideNav);
      fab.classList.toggle("hidden", hideNav || routePath === "empty");

      let active = "home";
      if (routePath.startsWith("wallet")) active = "wallets";
      else if (routePath.startsWith("activity")) active = "activity";
      else if (routePath.startsWith("settings")) active = "settings";
      else if (routePath === "home" || routePath === "empty") active = "home";
      else active = state.activeNav;

      state.activeNav = active;
      nav.querySelectorAll(".nav-item").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.nav === active);
      });
    }

    function renderRoute() {
      parseQueryFlags();
      clearTimeout(state.introTimer);

      const { path, query } = parseHash();
      const route = path || "intro";
      const host = document.getElementById("screen-host");
      const backdrop = document.getElementById("sheet-backdrop");
      const sheetContent = document.getElementById("sheet-content");

      const isSheet = route.startsWith("sheet/");
      let screenRoute = isSheet ? (state.parentRoute || "home") : route;

      // Natural parent inference for direct sheet deep links
      if (isSheet && !state.parentRoute) screenRoute = "home";
      if (isSheet) {
        if (route.startsWith("sheet/budget") || route.startsWith("sheet/category-budget")) screenRoute = "activity/budgets";
        else if (route.startsWith("sheet/edit-wallet/")) screenRoute = "wallets";
        else if (route.startsWith("sheet/profile") || route.startsWith("sheet/pin") || route.startsWith("sheet/schedules") || route.startsWith("sheet/schedule-edit") || route.startsWith("sheet/favorite")) {
          if (state.parentRoute === "settings") screenRoute = "settings";
        }
      }

      if (!isSheet) state.parentRoute = screenRoute;
      updateNavChrome(screenRoute);

      // Render underlying screen
      let html = "";
      if (screenRoute === "intro") {
        html = renderIntro();
        state.introTimer = setTimeout(() => {
          if (parseHash().path === "" || parseHash().path === "intro") navigate("lock");
        }, 1800);
      } else if (screenRoute === "lock") {
        html = renderLock();
      } else if (screenRoute === "auth") {
        html = renderAuth();
      } else if (screenRoute === "empty") {
        html = renderEmpty();
      } else if (screenRoute === "wallets") {
        html = renderWallets();
      } else if (screenRoute.startsWith("wallet/")) {
        html = renderWalletDetail(screenRoute.slice("wallet/".length));
      } else if (screenRoute === "activity") {
        html = renderActivity("overview");
      } else if (screenRoute === "activity/budgets") {
        html = renderActivity("budgets");
      } else if (screenRoute === "settings") {
        html = renderSettings();
      } else {
        html = renderHome();
      }

      host.innerHTML = html;
      host.scrollTop = 0;

      // Subtle editorial count-up on Home hero balance
      if (screenRoute === "home" && !isSheet && !state.hideBalances && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const heroEl = host.querySelector("[data-count-hero]");
        if (heroEl) {
          const target = parseFloat(heroEl.dataset.countHero);
          if (target > 0) {
            const start = performance.now();
            const dur = 320;
            const tick = (now) => {
              const p = Math.min(1, (now - start) / dur);
              const eased = 1 - Math.pow(1 - p, 3);
              heroEl.innerHTML = maskHeroHtml(target * (0.85 + 0.15 * eased));
              if (p < 1) requestAnimationFrame(tick);
              else heroEl.innerHTML = maskHeroHtml(target);
            };
            requestAnimationFrame(tick);
          }
        }
      }

      // Sheet overlay
      if (isSheet) {
        let sHtml = "";
        if (route === "sheet/add-tx") sHtml = renderAddTxSheet("expense");
        else if (route === "sheet/add-income") sHtml = renderAddTxSheet("income");
        else if (route === "sheet/transfer") sHtml = renderTransferSheet(query);
        else if (route === "sheet/update") sHtml = renderUpdateBalanceSheet(query);
        else if (route === "sheet/add-wallet") sHtml = renderAddWalletSheet();
        else if (route.startsWith("sheet/edit-wallet/")) sHtml = renderEditWalletSheet(route.slice("sheet/edit-wallet/".length));
        else if (route.startsWith("sheet/tx/")) sHtml = renderTxDetailSheet(route.slice("sheet/tx/".length));
        else if (route.startsWith("sheet/edit-tx/")) {
          const tx = TRANSACTIONS.find((x) => x.id === route.slice("sheet/edit-tx/".length));
          sHtml = renderAddTxSheet("expense", tx);
        }
        else if (route === "sheet/search") sHtml = renderSearchSheet();
        else if (route === "sheet/schedules") sHtml = renderSchedulesSheet();
        else if (route === "sheet/schedule-edit") sHtml = renderScheduleEditSheet(state.draftScheduleId);
        else if (route.startsWith("sheet/schedule-edit/")) sHtml = renderScheduleEditSheet(route.slice("sheet/schedule-edit/".length));
        else if (route === "sheet/budget") sHtml = renderBudgetSheet();
        else if (route.startsWith("sheet/category-budget/")) sHtml = renderCategoryBudgetSheet(route.slice("sheet/category-budget/".length));
        else if (route === "sheet/favorite") sHtml = renderFavoriteSheet();
        else if (route === "sheet/profile") sHtml = renderProfileSheet();
        else if (route === "sheet/pin") sHtml = renderPinSheet();
        else if (route === "sheet/confirm-delete") sHtml = renderConfirmDeleteSheet();
        else sHtml = renderAddTxSheet("expense");

        sheetContent.innerHTML = sHtml;
        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");
        bindSheetForms();
      } else {
        backdrop.classList.remove("open");
        backdrop.setAttribute("aria-hidden", "true");
      }
    }

    /* ========================================================================
       7. INTERACTIONS, MUTATIONS & FORM HANDLERS
       ======================================================================== */
    function handlePinDigit(d) {
      if (state.pinBuffer.length >= 4) return;
      state.pinError = false;
      state.pinBuffer += d;
      renderRoute();
      if (state.pinBuffer.length === 4) {
        setTimeout(() => {
          if (state.pinBuffer === state.pinCode || state.pinBuffer === "1234") {
            state.pinBuffer = "";
            navigate("home");
          } else {
            state.pinError = true;
            state.pinBuffer = "";
            renderRoute();
          }
        }, 160);
      }
    }

    function recordTransaction({ title, kind, walletId, amount, dateStr, note }) {
      const w = walletById(walletId);
      if (!w) return;
      const id = "t" + Date.now();
      const at = `${dateStr || "2026-11-24"}T${String(TODAY.getHours()).padStart(2, "0")}:${String(TODAY.getMinutes()).padStart(2, "0")}`;
      const tx = { id, title, kind, wallet: w.id, amount, at, ...(note ? { note } : {}) };
      TRANSACTIONS.unshift(tx);
      w.balance = +(w.balance + amount).toFixed(2);
      return tx;
    }

    function exportCsv() {
      const rows = [["Date", "Title", "Kind", "Wallet", "Amount", "Note"]];
      TRANSACTIONS.forEach((t) => {
        const w = walletById(t.wallet);
        rows.push([t.at, t.title, t.kind, w ? w.name : t.wallet, t.amount.toFixed(2), t.note || ""]);
      });
      const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
      try {
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pitaka-gazette-nov-2026.csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch {}
      showToast(`Exported ${TRANSACTIONS.length} ledger rows to CSV`);
    }

    function bindSheetForms() {
      // Entry slip form (Add / Edit)
      const entryForm = document.getElementById("entry-slip-form");
      if (entryForm) {
        entryForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const amtRaw = parseFloat(document.getElementById("entry-amount").value);
          if (!amtRaw || amtRaw <= 0) return;
          const title = document.getElementById("entry-title").value.trim() || "Untitled entry";
          const kind = document.getElementById("entry-cat").value;
          const walletId = document.getElementById("entry-wallet").value;
          const dateStr = document.getElementById("entry-date").value || "2026-11-24";
          const note = document.getElementById("entry-note").value.trim();
          const dir = entryForm.dataset.dir;
          const signedAmt = dir === "income" ? Math.abs(amtRaw) : -Math.abs(amtRaw);
          const editId = entryForm.dataset.editId;

          if (editId) {
            const old = TRANSACTIONS.find((x) => x.id === editId);
            if (old) {
              const oldW = walletById(old.wallet);
              if (oldW) oldW.balance = +(oldW.balance - old.amount).toFixed(2);
              old.title = title;
              old.kind = kind;
              old.wallet = walletId;
              old.amount = signedAmt;
              old.at = `${dateStr}T${old.at.slice(11, 16) || "12:00"}`;
              old.note = note || undefined;
              const newW = walletById(walletId);
              if (newW) newW.balance = +(newW.balance + signedAmt).toFixed(2);
            }
            showToast("Ledger entry updated");
          } else {
            recordTransaction({ title, kind, walletId, amount: signedAmt, dateStr, note });
            const saveFav = document.getElementById("entry-save-fav")?.checked;
            if (saveFav) {
              FAVORITES.push({
                id: "f" + Date.now(),
                name: title,
                direction: dir,
                category: kind,
                wallet: walletId,
                defaultAmount: Math.round(amtRaw),
              });
            }
            showToast(dir === "income" ? "Money-in recorded" : "Expense filed to ledger");
          }
          closeSheet();
        });
      }

      // Transfer form
      const txfForm = document.getElementById("transfer-form");
      if (txfForm) {
        txfForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const fromId = document.getElementById("txf-from").value;
          const toId = document.getElementById("txf-to").value;
          const amt = parseFloat(document.getElementById("txf-amount").value);
          const fee = parseFloat(document.getElementById("txf-fee").value) || 0;
          if (fromId === toId) { showToast("Choose two different wallets"); return; }
          if (!amt || amt <= 0) return;
          const wFrom = walletById(fromId);
          const wTo = walletById(toId);
          if (!wFrom || !wTo) return;
          wFrom.balance = +(wFrom.balance - amt - fee).toFixed(2);
          wTo.balance = +(wTo.balance + amt).toFixed(2);
          TRANSACTIONS.unshift({
            id: "t" + Date.now(),
            title: `${wFrom.name} to ${wTo.name}`,
            kind: "Transfer",
            wallet: wFrom.id,
            to: wTo.id,
            amount: -amt,
            at: "2026-11-24T19:05",
            ...(fee > 0 ? { note: `Includes ₱${fee.toFixed(2)} fee` } : {}),
          });
          showToast(`Transferred ${fmt(amt)} to ${wTo.name}`);
          closeSheet();
        });
      }

      // Update balance form
      const updForm = document.getElementById("update-balance-form");
      if (updForm) {
        updForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const w = walletById(document.getElementById("upd-wallet").value);
          const mode = document.getElementById("upd-mode").value;
          const amt = parseFloat(document.getElementById("upd-amount").value);
          const note = document.getElementById("upd-note").value.trim();
          if (!w || isNaN(amt)) return;
          let delta = 0;
          if (mode === "set") delta = +(amt - w.balance).toFixed(2);
          else if (mode === "add") delta = +amt.toFixed(2);
          else delta = -amt.toFixed(2);
          w.balance = +(w.balance + delta).toFixed(2);
          TRANSACTIONS.unshift({
            id: "t" + Date.now(),
            title: "Balance adjustment",
            kind: "Updated",
            wallet: w.id,
            amount: delta,
            at: "2026-11-24T19:05",
            ...(note ? { note } : {}),
          });
          showToast(`${w.name} reconciled to ${fmt(w.balance)}`);
          closeSheet();
        });
      }

      // Add wallet form + preset filter
      const presetSearch = document.getElementById("preset-search");
      if (presetSearch) {
        presetSearch.addEventListener("input", () => {
          const q = presetSearch.value.trim().toLowerCase();
          document.querySelectorAll("[data-preset-name]").forEach((btn) => {
            const match = btn.dataset.presetName.toLowerCase().includes(q);
            btn.style.display = match ? "" : "none";
          });
        });
      }
      const addWalletForm = document.getElementById("add-wallet-form");
      if (addWalletForm) {
        addWalletForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("nw-name").value.trim();
          if (!name) return;
          const type = document.getElementById("nw-type").value;
          const account = document.getElementById("nw-account").value.trim() || "Personal";
          const balance = parseFloat(document.getElementById("nw-balance").value) || 0;
          const brand = document.getElementById("nw-brand").value || "#1A1714";
          const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "") + Math.floor(Math.random() * 90 + 10);
          WALLETS.push({
            id,
            name,
            type,
            account,
            balance: +balance.toFixed(2),
            mark: name.slice(0, 2).toUpperCase(),
            logo: id,
            brand,
            number: type === "Cash" ? "Physical" : "•••• " + Math.floor(1000 + Math.random() * 8999),
          });
          showToast(`${name} added to your directory`);
          state.parentRoute = "wallets";
          closeSheet();
        });
      }

      // Edit wallet form
      const editWalletForm = document.getElementById("edit-wallet-form");
      if (editWalletForm) {
        editWalletForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const w = walletById(editWalletForm.dataset.walletId);
          if (w) {
            w.name = document.getElementById("ew-name").value.trim() || w.name;
            w.type = document.getElementById("ew-type").value;
            w.account = document.getElementById("ew-account").value.trim() || w.account;
            w.number = document.getElementById("ew-number").value.trim() || w.number;
            w.brand = document.getElementById("ew-brand").value;
          }
          showToast("Account dossier updated");
          closeSheet();
        });
      }

      // Search sheet input
      const idxInput = document.getElementById("index-search-input");
      if (idxInput) {
        idxInput.addEventListener("input", () => {
          state.searchQuery = idxInput.value;
          const pos = idxInput.selectionStart;
          document.getElementById("sheet-content").innerHTML = renderSearchSheet();
          bindSheetForms();
          const next = document.getElementById("index-search-input");
          if (next) { next.focus(); next.setSelectionRange(pos, pos); }
        });
      }

      // Schedule form
      const schedForm = document.getElementById("schedule-form");
      if (schedForm) {
        schedForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const id = schedForm.dataset.schedId;
          const obj = {
            id: id || "s" + Date.now(),
            title: document.getElementById("sc-title").value.trim(),
            direction: document.getElementById("sc-dir").value,
            amount: parseFloat(document.getElementById("sc-amount").value) || 0,
            category: document.getElementById("sc-cat").value,
            wallet: document.getElementById("sc-wallet").value,
            due: document.getElementById("sc-due").value,
            repeat: document.getElementById("sc-repeat").value,
            reminder: document.getElementById("sc-rem").checked,
          };
          if (id) {
            const idx = SCHEDULES.findIndex((x) => x.id === id);
            if (idx >= 0) SCHEDULES[idx] = obj;
          } else {
            SCHEDULES.push(obj);
          }
          state.draftScheduleId = null;
          showToast("Calendar schedule saved");
          navigate("sheet/schedules");
        });
      }

      // Monthly budget form
      const mbForm = document.getElementById("monthly-budget-form");
      if (mbForm) {
        mbForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const v = parseFloat(document.getElementById("mb-amount").value);
          if (v > 0) state.monthlyBudget = v;
          showToast(`Monthly plan set to ${fmt(state.monthlyBudget, { cents: false })}`);
          closeSheet();
        });
      }

      // Category budget form
      const cbForm = document.getElementById("cat-budget-form");
      if (cbForm) {
        cbForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const cat = cbForm.dataset.cat;
          const v = parseFloat(document.getElementById("cb-amount").value);
          if (v > 0) CATEGORY_LIMITS[cat] = v;
          showToast(`${cat} limit set to ${fmt(v, { cents: false })}`);
          closeSheet();
        });
      }

      // Favorite form
      const favForm = document.getElementById("favorite-form");
      if (favForm) {
        favForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const id = favForm.dataset.favId;
          const amtRaw = document.getElementById("fv-amt").value;
          const obj = {
            id: id || "f" + Date.now(),
            name: document.getElementById("fv-name").value.trim(),
            direction: "expense",
            category: document.getElementById("fv-cat").value,
            wallet: document.getElementById("fv-wallet").value,
            defaultAmount: amtRaw ? parseFloat(amtRaw) : null,
          };
          if (id) {
            const idx = FAVORITES.findIndex((f) => f.id === id);
            if (idx >= 0) FAVORITES[idx] = obj;
          } else {
            FAVORITES.push(obj);
          }
          state.draftFavId = null;
          showToast("Classifieds updated");
          renderRoute();
        });
      }

      // Profile form
      const profForm = document.getElementById("profile-form");
      if (profForm) {
        profForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const full = document.getElementById("pr-name").value.trim();
          const email = document.getElementById("pr-email").value.trim();
          if (full) {
            PROFILE.fullName = full;
            PROFILE.firstName = full.split(/\s+/)[0];
            PROFILE.initials = full.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
          }
          if (email) PROFILE.email = email;
          showToast("Editor profile updated");
          closeSheet();
        });
      }

      // PIN change form
      const pinForm = document.getElementById("pin-change-form");
      if (pinForm) {
        pinForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const p1 = document.getElementById("pin-new").value;
          const p2 = document.getElementById("pin-confirm").value;
          if (!/^\d{4}$/.test(p1) || p1 !== p2) {
            showToast("Enter matching 4-digit PINs");
            return;
          }
          state.pinCode = p1;
          state.appLock = true;
          showToast("Press code updated");
          closeSheet();
        });
      }

      // Confirm delete action
      const confirmGo = document.getElementById("confirm-delete-go");
      if (confirmGo && state.confirmPayload?.onConfirm) {
        confirmGo.addEventListener("click", state.confirmPayload.onConfirm);
      }
    }

    /* ========================================================================
       8. GLOBAL EVENT DELEGATION & BOOT
       ======================================================================== */
    document.addEventListener("click", (e) => {
      const target = e.target.closest("button, [data-nav-to], [data-action], [data-chart-idx], [data-nav]");
      if (!target) return;

      // Bottom nav
      if (target.dataset.nav) {
        navigate(target.dataset.nav);
        return;
      }

      // FAB
      if (target.id === "fab-entry") {
        navigate("sheet/add-tx");
        return;
      }

      // Direct route links
      if (target.dataset.navTo) {
        navigate(target.dataset.navTo);
        return;
      }

      // PIN keypad
      if (target.dataset.pin) {
        handlePinDigit(target.dataset.pin);
        return;
      }

      // Actions
      const act = target.dataset.action;
      if (act === "skip-intro") { navigate("lock"); return; }
      if (act === "pin-backspace") { state.pinBuffer = state.pinBuffer.slice(0, -1); renderRoute(); return; }
      if (act === "biometric-unlock") { showToast("Biometric verified"); navigate("home"); return; }
      if (act === "toggle-hide") { state.hideBalances = !state.hideBalances; renderRoute(); return; }
      if (act === "open-search") { state.searchQuery = ""; navigate("sheet/search"); return; }
      if (act === "close-sheet") { closeSheet(); return; }
      if (act === "toggle-theme") {
        state.theme = state.theme === "dark" ? "light" : "dark";
        applyThemeTokens();
        renderRoute();
        return;
      }
      if (act === "toggle-applock") { state.appLock = !state.appLock; renderRoute(); return; }
      if (act === "toggle-bio") { state.biometric = !state.biometric; renderRoute(); return; }
      if (act === "sync-now") {
        state.synced = true;
        PROFILE.lastSyncedAt = "Just now";
        showToast("Archive synced cleanly");
        renderRoute();
        return;
      }
      if (act === "toggle-reorder") { state.walletReorderMode = !state.walletReorderMode; renderRoute(); return; }
      if (act === "export-csv") { exportCsv(); return; }
      if (act === "load-more-tx") { state.activityLimit += 12; renderRoute(); return; }
      if (act === "reset-demo") { resetDemo(); return; }
      if (act === "disable-pin") { state.appLock = false; showToast("App lock disabled"); closeSheet(); return; }
      if (act === "auth-mode") { state.authMode = target.dataset.mode; renderRoute(); return; }

      // Accent picker
      if (target.dataset.accentPick) {
        state.accent = target.dataset.accentPick;
        applyThemeTokens();
        renderRoute();
        return;
      }

      // Wallet move reorder
      if (target.dataset.moveWallet !== undefined) {
        const idx = +target.dataset.moveWallet;
        const dir = +target.dataset.dir;
        const swapIdx = idx + dir;
        if (swapIdx >= 0 && swapIdx < WALLETS.length) {
          const tmp = WALLETS[idx];
          WALLETS[idx] = WALLETS[swapIdx];
          WALLETS[swapIdx] = tmp;
          renderRoute();
        }
        return;
      }

      // Wallet detail filters
      if (target.dataset.walletFilter) {
        state.walletFilter = target.dataset.walletFilter;
        renderRoute();
        return;
      }

      // Activity range & filters
      if (target.dataset.range) {
        state.activityRange = target.dataset.range;
        state.selectedChartDay = null;
        renderRoute();
        return;
      }
      if (target.dataset.actFilter) {
        state.activityFilter = target.dataset.actFilter;
        state.activityLimit = 12;
        renderRoute();
        return;
      }
      if (target.dataset.chartIdx !== undefined) {
        state.selectedChartDay = +target.dataset.chartIdx;
        renderRoute();
        return;
      }

      // Favorite chip one-tap
      if (target.dataset.favId) {
        const fav = FAVORITES.find((f) => f.id === target.dataset.favId);
        if (!fav) return;
        if (fav.defaultAmount != null) {
          const amt = fav.direction === "income" ? fav.defaultAmount : -fav.defaultAmount;
          const tx = recordTransaction({ title: fav.name, kind: fav.category, walletId: fav.wallet, amount: amt });
          renderRoute();
          showToast(`Filed ${fav.name} (${fmt(amt, { cents: false })})`, () => {
            if (!tx) return;
            const i = TRANSACTIONS.findIndex((x) => x.id === tx.id);
            if (i >= 0) TRANSACTIONS.splice(i, 1);
            const w = walletById(tx.wallet);
            if (w) w.balance = +(w.balance - tx.amount).toFixed(2);
            renderRoute();
          });
        } else {
          state.draftTx = { title: fav.name, category: fav.category, wallet: fav.wallet };
          navigate("sheet/add-tx");
        }
        return;
      }

      // Schedule tap on Home -> prefill entry slip
      if (target.dataset.scheduleRecord) {
        const s = SCHEDULES.find((x) => x.id === target.dataset.scheduleRecord);
        if (s) {
          state.draftTx = { title: s.title, category: s.category, wallet: s.wallet, amount: s.amount };
          navigate(s.direction === "income" ? "sheet/add-income" : "sheet/add-tx");
        }
        return;
      }

      // Sheet-specific controls
      if (target.dataset.entryDir) {
        navigate(target.dataset.entryDir === "income" ? "sheet/add-income" : "sheet/add-tx");
        return;
      }
      if (target.dataset.amtAdd) {
        const inp = document.getElementById("entry-amount");
        if (inp) {
          if (target.dataset.amtAdd === "CLR") inp.value = "";
          else inp.value = ((parseFloat(inp.value) || 0) + parseFloat(target.dataset.amtAdd.replace("+", ""))).toFixed(2);
        }
        return;
      }
      if (target.dataset.pickCat) {
        document.getElementById("entry-cat").value = target.dataset.pickCat;
        document.querySelectorAll("[data-pick-cat]").forEach((b) => b.classList.toggle("active", b === target));
        return;
      }
      if (target.dataset.updMode) {
        document.getElementById("upd-mode").value = target.dataset.updMode;
        document.querySelectorAll("[data-upd-mode]").forEach((b) => b.classList.toggle("active", b === target));
        return;
      }
      if (target.dataset.presetName) {
        document.getElementById("nw-name").value = target.dataset.presetName;
        document.getElementById("nw-type").value = target.dataset.presetType;
        document.querySelectorAll("[data-preset-name]").forEach((b) => b.classList.toggle("active", b === target));
        return;
      }
      if (target.dataset.nwColor) {
        document.getElementById("nw-brand").value = target.dataset.nwColor;
        document.querySelectorAll("[data-nw-color]").forEach((b) => b.classList.toggle("active", b === target));
        return;
      }
      if (target.dataset.ewColor) {
        document.getElementById("ew-brand").value = target.dataset.ewColor;
        document.querySelectorAll("[data-ew-color]").forEach((b) => b.classList.toggle("active", b === target));
        return;
      }
      if (target.dataset.mbPreset) {
        document.getElementById("mb-amount").value = target.dataset.mbPreset;
        return;
      }
      if (target.dataset.clearCatBudget) {
        delete CATEGORY_LIMITS[target.dataset.clearCatBudget];
        showToast(`${target.dataset.clearCatBudget} quota cleared`);
        closeSheet();
        return;
      }
      if (target.dataset.editSchedule) {
        state.draftScheduleId = target.dataset.editSchedule;
        navigate("sheet/schedule-edit");
        return;
      }
      if (target.dataset.toggleSchedRem) {
        const s = SCHEDULES.find((x) => x.id === target.dataset.toggleSchedRem);
        if (s) { s.reminder = !s.reminder; renderRoute(); }
        return;
      }
      if (target.dataset.editFav) {
        state.draftFavId = target.dataset.editFav;
        renderRoute();
        return;
      }
      if (target.dataset.deleteFav) {
        const idx = FAVORITES.findIndex((f) => f.id === target.dataset.deleteFav);
        if (idx >= 0) FAVORITES.splice(idx, 1);
        showToast("Favorite removed");
        renderRoute();
        return;
      }
      if (target.dataset.favFromTx) {
        const t = TRANSACTIONS.find((x) => x.id === target.dataset.favFromTx);
        if (t) {
          FAVORITES.push({
            id: "f" + Date.now(),
            name: t.title,
            direction: t.amount >= 0 ? "income" : "expense",
            category: t.kind,
            wallet: t.wallet,
            defaultAmount: Math.round(Math.abs(t.amount)),
          });
          showToast(`Saved “${t.title}” to Classifieds`);
        }
        return;
      }
      if (target.dataset.recurFromTx) {
        const t = TRANSACTIONS.find((x) => x.id === target.dataset.recurFromTx);
        if (t) {
          SCHEDULES.push({
            id: "s" + Date.now(),
            title: t.title,
            amount: Math.abs(t.amount),
            direction: t.amount >= 0 ? "income" : "expense",
            category: t.kind,
            wallet: t.wallet,
            due: "2026-12-24",
            repeat: "monthly",
            reminder: true,
          });
          showToast(`Added “${t.title}” to monthly calendar`);
          closeSheet();
        }
        return;
      }
      if (target.dataset.deleteTx) {
        const id = target.dataset.deleteTx;
        const tx = TRANSACTIONS.find((x) => x.id === id);
        state.confirmPayload = {
          title: "Strike this entry?",
          body: tx ? `Remove “${tx.title}” (${fmt(tx.amount, { sign: true })}) and reverse its effect on the account balance?` : "Remove this entry?",
          confirmLabel: "Strike Entry",
          onConfirm: () => {
            const idx = TRANSACTIONS.findIndex((x) => x.id === id);
            if (idx >= 0) {
              const removed = TRANSACTIONS.splice(idx, 1)[0];
              const w = walletById(removed.wallet);
              if (w) w.balance = +(w.balance - removed.amount).toFixed(2);
              if (removed.to) {
                const toW = walletById(removed.to);
                if (toW) toW.balance = +(toW.balance - Math.abs(removed.amount)).toFixed(2);
              }
            }
            showToast("Entry struck from ledger");
            closeSheet();
          },
        };
        navigate("sheet/confirm-delete");
        return;
      }
      if (target.dataset.deleteWallet) {
        const id = target.dataset.deleteWallet;
        const w = walletById(id);
        state.confirmPayload = {
          title: `Close ${w ? w.name : "wallet"}?`,
          body: "This removes the wallet from your directory. Transactions remain archived in the ledger.",
          confirmLabel: "Delete Wallet",
          onConfirm: () => {
            const idx = WALLETS.findIndex((x) => x.id === id);
            if (idx >= 0) WALLETS.splice(idx, 1);
            showToast("Wallet closed");
            state.parentRoute = WALLETS.length ? "wallets" : "empty";
            closeSheet();
          },
        };
        navigate("sheet/confirm-delete");
        return;
      }
    });

    // Live inputs outside sheets (Activity search, wallet select, Auth form)
    document.addEventListener("input", (e) => {
      if (e.target.id === "activity-search") {
        state.activitySearch = e.target.value;
        const pos = e.target.selectionStart;
        renderRoute();
        const el = document.getElementById("activity-search");
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      }
    });
    document.addEventListener("change", (e) => {
      if (e.target.id === "activity-wallet-select") {
        state.activityWalletFilter = e.target.value;
        renderRoute();
      }
    });
    document.addEventListener("submit", (e) => {
      if (e.target.id === "auth-form") {
        e.preventDefault();
        state.signedIn = true;
        state.synced = true;
        PROFILE.lastSyncedAt = "Just now";
        showToast("Signed in to Ang Pitaka Archive");
        navigate("settings");
      }
    });

    // Backdrop click & Escape key close sheet
    document.getElementById("sheet-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "sheet-backdrop") closeSheet();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.getElementById("sheet-backdrop").classList.contains("open")) {
        closeSheet();
      }
    });

    window.addEventListener("hashchange", renderRoute);
    window.addEventListener("DOMContentLoaded", () => {
      if (!window.location.hash) window.location.hash = "#/intro";
      renderRoute();
    });
  </script>
</body>
</html>
