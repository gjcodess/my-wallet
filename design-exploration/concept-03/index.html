<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="red">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ang Pitaka Gazette — Personal Finance Broadsheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ========================================================================
       1. DESIGN TOKENS — ANG PITAKA GAZETTE
       Newsprint editorial system. Radius 0 everywhere (except avatar circle).
       ======================================================================== */
    :root {
      /* Surface & Ink — Newsprint Daylight Edition */
      --paper: #F2EDE3;
      --paper-2: #EAE3D6;
      --paper-elevated: #F6F2EA;
      --ink: #1A1714;
      --ink-2: #5C544B;
      --ink-muted: #766D62;
      --rule: #1A1714;
      --rule-soft: #CFC6B6;

      /* Editorial Spot & Semantic Colours */
      --accent: #C8361D;         /* Editor's Red */
      --accent-soft: rgba(200, 54, 29, 0.10);
      --ink-blue: #203A5C;       /* Money-In */
      --ink-blue-soft: rgba(32, 58, 92, 0.10);
      --salmon: #F0C9A9;         /* FT-Salmon chart & pace fill */
      --forest: #2E5E3E;
      --ochre: #B7791F;
      --danger: #C8361D;
      --warn: #9E6312;

      /* Typography */
      --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
      --font-sans: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      /* Type Scale */
      --t-hero: 64px;
      --t-h1: 36px;
      --t-h2: 26px;
      --t-h3: 20px;
      --t-body: 15px;
      --t-small: 13px;
      --t-kicker: 11px;
      --t-folio: 10px;

      /* Grid & Spacing (4/8 base, 20px page margins, 16px gutters) */
      --margin: 20px;
      --gutter: 16px;
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;

      /* Shape & Elevation */
      --radius: 0px;
      --sheet-shadow: 0 -8px 28px rgba(26, 23, 20, 0.16);
      --desktop-bg: #DFD8CA;

      /* Motion */
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      --t-fast: 160ms;
      --t-med: 250ms;
      --t-slow: 320ms;
    }

    /* Night Edition (Dark Theme) */
    [data-theme="dark"] {
      --paper: #15130F;
      --paper-2: #1E1B16;
      --paper-elevated: #231F19;
      --ink: #EEE6D6;
      --ink-2: #B3A998;
      --ink-muted: #8E8577;
      --rule: #E4DBC9;
      --rule-soft: #383229;

      --accent: #E2553B;
      --accent-soft: rgba(226, 85, 59, 0.16);
      --ink-blue: #7CA2D0;
      --ink-blue-soft: rgba(124, 162, 208, 0.15);
      --salmon: #8A5B40;
      --forest: #5EA476;
      --ochre: #DCA03D;
      --danger: #E2553B;
      --warn: #DCA03D;

      --sheet-shadow: 0 -10px 32px rgba(0, 0, 0, 0.55);
      --desktop-bg: #0D0C09;
    }

    /* Accent Picker Palettes */
    [data-theme="light"][data-accent="red"]    { --accent: #C8361D; --accent-soft: rgba(200, 54, 29, 0.10); }
    [data-theme="light"][data-accent="blue"]   { --accent: #203A5C; --accent-soft: rgba(32, 58, 92, 0.10); }
    [data-theme="light"][data-accent="forest"] { --accent: #2E5E3E; --accent-soft: rgba(46, 94, 62, 0.10); }
    [data-theme="light"][data-accent="ochre"]  { --accent: #B7791F; --accent-soft: rgba(183, 121, 31, 0.11); }

    [data-theme="dark"][data-accent="red"]    { --accent: #E2553B; --accent-soft: rgba(226, 85, 59, 0.16); }
    [data-theme="dark"][data-accent="blue"]   { --accent: #7CA2D0; --accent-soft: rgba(124, 162, 208, 0.16); }
    [data-theme="dark"][data-accent="forest"] { --accent: #5EA476; --accent-soft: rgba(94, 164, 118, 0.16); }
    [data-theme="dark"][data-accent="ochre"]  { --accent: #DCA03D; --accent-soft: rgba(220, 160, 61, 0.16); }

    /* ========================================================================
       2. RESET & BASE TYPOGRAPHY
       ======================================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: var(--t-body);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
      border-radius: 0;
      margin: 0;
    }

    button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active, .pressable:active {
      transform: scale(0.975);
      transition: transform 80ms var(--ease);
    }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    a { color: inherit; text-decoration: none; }

    .mono, .amt {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .serif { font-family: var(--font-serif); }
    .italic { font-style: italic; }

    .kicker {
      font-family: var(--font-sans);
      font-size: var(--t-kicker);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      line-height: 1.2;
    }

    .small-caps {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .folio {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.055em;
      text-transform: uppercase;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .money-in { color: var(--ink-blue); }
    .money-out { color: var(--ink); }
    .money-warn { color: var(--accent); }

    /* Drop cap for editorial standfirsts */
    .drop-cap::first-letter {
      font-family: var(--font-serif);
      float: left;
      font-size: 44px;
      line-height: 0.78;
      padding-top: 3px;
      padding-right: 0px;
      margin-right: -2px;
      color: var(--ink);
      font-weight: 400;
    }

    /* Harmonized superscript Peso glyph for Instrument Serif display figures */
    .peso-mark {
      font-family: var(--font-sans);
      font-style: normal;
      font-weight: 400;
      font-size: 0.56em;
      vertical-align: 0.30em;
      margin-right: 2px;
      color: var(--ink-2);
      letter-spacing: 0;
    }

    /* ========================================================================
       3. VIEWPORT & DESKTOP PHONE FRAME
       ======================================================================== */
    .stage {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--paper);
    }

    .desktop-caption { display: none; }

    .phone-frame {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 100%;
      background: var(--paper);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 501px) {
      .stage {
        background: var(--desktop-bg);
        padding: 20px 16px;
        gap: 12px;
      }
      .phone-frame {
        width: 390px;
        height: 844px;
        max-height: calc(100dvh - 64px);
        border: 2px solid var(--rule);
        box-shadow: 0 24px 60px rgba(26, 23, 20, 0.22);
      }
      .desktop-caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 390px;
        padding-top: 2px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--ink-2);
        text-transform: uppercase;
      }
      .desktop-caption a {
        border-bottom: 1px solid var(--rule-soft);
        padding-bottom: 1px;
      }
      .desktop-caption a:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
    }

    /* ========================================================================
       4. APP SHELL, SCROLL AREA, BOTTOM INDEX BAR & ENTRY BUTTON
       ======================================================================== */
    #screen-host {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    #screen-host::-webkit-scrollbar { display: none; }

    .screen {
      padding: 0 var(--margin) 104px;
      min-height: 100%;
      animation: fadeUp var(--t-med) var(--ease) both;
    }

    .screen.no-nav-pad {
      padding-bottom: 32px;
    }

    /* Bottom Section-Index Navigation */
    .gazette-nav {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--paper);
      border-top: 2px solid var(--rule);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      flex-shrink: 0;
    }
    .gazette-nav.hidden { display: none; }

    .nav-item {
      position: relative;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 8px 4px;
      border-right: 1px solid var(--rule-soft);
      color: var(--ink-2);
      transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
    }
    .nav-item:last-child { border-right: none; }
    .nav-item:hover { background: var(--paper-2); }

    .nav-num {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }
    .nav-label {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .nav-item.active {
      color: var(--ink);
      background: var(--paper);
    }
    .nav-item.active .nav-num { color: var(--accent); font-weight: 600; }
    .nav-item.active .nav-label { font-weight: 700; }
    .nav-item.active::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 5px;
      height: 2px;
      background: var(--accent);
    }

    /* Square Ink-Black Entry Button above bottom bar */
    .entry-fab {
      position: absolute;
      right: 16px;
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      z-index: 25;
      width: 58px;
      height: 58px;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      box-shadow: 3px 3px 0 var(--accent);
      transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
    }
    .entry-fab:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--accent);
    }
    .entry-fab:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--accent);
    }
    .entry-fab.hidden { display: none; }
    .entry-fab-plus {
      font-family: var(--font-serif);
      font-size: 28px;
      line-height: 0.85;
      font-weight: 400;
    }
    .entry-fab-txt {
      font-family: var(--font-sans);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ========================================================================
       5. EDITORIAL COMPONENTS (MASTHEAD, RULES, TABLES, LEADERS, CLASSIFIEDS)
       ======================================================================== */
    .masthead {
      padding-top: max(12px, env(safe-area-inset-top, 12px));
      margin-bottom: 14px;
    }

    .folio-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--rule-soft);
    }

    .folio-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      min-width: 38px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
    }
    .icon-btn:hover { background: var(--paper-2); color: var(--accent); }

    .masthead-main {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 8px 0 8px;
      gap: 10px;
    }

    .wordmark-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .wordmark-sub {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 16px;
      color: var(--ink-2);
      letter-spacing: 0.01em;
    }

    .double-rule {
      border-top: 2px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      height: 5px;
      width: 100%;
    }

    .rule-1 { border-top: 1px solid var(--rule); width: 100%; }
    .rule-soft { border-top: 1px solid var(--rule-soft); width: 100%; }
    .rule-2 { border-top: 2px solid var(--rule); width: 100%; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0 8px;
      border-top: 1px solid var(--rule);
    }

    .section-title-serif {
      font-family: var(--font-serif);
      font-size: 24px;
      line-height: 1.05;
      font-weight: 400;
      margin: 0;
    }

    .text-link {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .text-link:hover { color: var(--accent); border-color: var(--accent); }

    /* Lead Story */
    .lead-story {
      padding: 4px 0 16px;
    }
    .lead-kicker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .eye-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      min-height: 32px;
      border: 1px solid var(--rule-soft);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    .eye-toggle:hover { border-color: var(--rule); color: var(--ink); }

    .hero-figure {
      font-family: var(--font-serif);
      font-size: clamp(46px, 14.5vw, 66px);
      line-height: 0.94;
      letter-spacing: -0.02em;
      font-variant-numeric: lining-nums tabular-nums;
      margin: 4px 0 8px;
      color: var(--ink);
      white-space: nowrap;
    }
    .hero-figure .cents {
      font-size: 0.56em;
      vertical-align: baseline;
      color: var(--ink-2);
    }

    .lead-headline {
      font-family: var(--font-serif);
      font-size: 25px;
      line-height: 1.1;
      margin: 0 0 8px;
      font-weight: 400;
    }
    .lead-standfirst {
      font-size: 14px;
      line-height: 1.48;
      color: var(--ink-2);
      margin: 0;
    }

    /* Quick Desk 4-column Ruled Table */
    .quick-desk {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      margin-bottom: 18px;
    }
    .quick-cell {
      min-height: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 4px;
      border-right: 1px solid var(--rule-soft);
      transition: background var(--t-fast) var(--ease);
    }
    .quick-cell:last-child { border-right: none; }
    .quick-cell:hover { background: var(--paper-2); }
    .quick-cell span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    /* Dot-Leader Index (Wallets) */
    .leader-list {
      display: flex;
      flex-direction: column;
    }
    .leader-row {
      display: block;
      width: 100%;
      text-align: left;
      padding: 11px 0;
      border-bottom: 1px solid var(--rule-soft);
      transition: background var(--t-fast) var(--ease);
    }
    .leader-row:last-child { border-bottom: none; }
    .leader-row:hover { background: var(--paper-2); padding-left: 6px; padding-right: 6px; }

    .leader-top {
      display: flex;
      align-items: baseline;
      gap: 6px;
      width: 100%;
    }
    .leader-name {
      font-family: var(--font-serif);
      font-size: 21px;
      line-height: 1.1;
      flex-shrink: 0;
    }
    .leader-dots {
      flex: 1;
      border-bottom: 1px dotted var(--ink-muted);
      transform: translateY(-4px);
      min-width: 16px;
    }
    .leader-amt {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .leader-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14px;
      color: var(--ink-2);
    }
    .leader-num {
      font-family: var(--font-mono);
      font-style: normal;
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* Classifieds Box (Favorites) */
    .classifieds-box {
      border: 1px solid var(--rule);
      background: var(--paper-2);
      padding: 12px;
      margin-bottom: 18px;
    }
    .classifieds-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--rule);
    }
    .classifieds-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .classified-ad {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      min-height: 58px;
      padding: 8px 10px;
      background: var(--paper);
      border: 1px solid var(--rule-soft);
      text-align: left;
      transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
    }
    .classified-ad:hover { border-color: var(--rule); background: var(--paper-elevated); }
    .classified-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }
    .classified-meta {
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-2);
    }

    /* On the Calendar (Upcoming Events Listing) */
    .calendar-list {
      margin-bottom: 18px;
    }
    .calendar-row {
      width: 100%;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--rule-soft);
      text-align: left;
      min-height: 54px;
    }
    .calendar-row:hover { background: var(--paper-2); padding-left: 4px; padding-right: 4px; }
    .cal-date-box {
      border-right: 1px solid var(--rule-soft);
      padding-right: 8px;
      text-align: center;
      line-height: 1;
    }
    .cal-day {
      font-family: var(--font-serif);
      font-size: 26px;
      display: block;
    }
    .cal-mon {
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-2);
    }
    .cal-info-title {
      font-weight: 600;
      font-size: 14px;
      line-height: 1.25;
    }
    .cal-info-sub {
      font-size: 12px;
      color: var(--ink-2);
      margin-top: 2px;
    }
    .cal-due-urgent { color: var(--accent); font-weight: 600; }

    /* Ledger Table (Transactions) */
    .ledger-group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 10px 0 6px;
      border-bottom: 1px solid var(--rule);
      margin-top: 6px;
    }
    .ledger-group-date {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .ledger-group-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-2);
    }

    .ledger-row {
      width: 100%;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--rule-soft);
      text-align: left;
      min-height: 48px;
      transition: background var(--t-fast) var(--ease);
    }
    .ledger-row:hover { background: var(--paper-2); padding-left: 4px; padding-right: 4px; }
    .ledger-date {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-2);
      line-height: 1.25;
    }
    .ledger-desc {
      min-width: 0;
    }
    .ledger-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ledger-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-2);
    }
    .ledger-cat {
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 1px 4px;
      border: 1px solid var(--rule-soft);
      font-size: 9.5px;
    }
    .ledger-amt {
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
    }

    /* ========================================================================
       6. BUTTONS, CHIPS, TABS, INPUTS (ALL RADIUS 0)
       ======================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      border: 1px solid var(--rule);
      transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
    }
    .btn-ink {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .btn-ink:hover { background: var(--accent); border-color: var(--accent); color: #F2EDE3; }
    .btn-outline {
      background: transparent;
      color: var(--ink);
    }
    .btn-outline:hover { background: var(--paper-2); }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }
    .btn-danger:hover { background: var(--danger); color: #F2EDE3; }
    .btn-block { width: 100%; }

    /* Sub-navigation / Filter Tabs */
    .tab-strip {
      display: flex;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-strip::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1;
      min-height: 40px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-2);
      border-right: 1px solid var(--rule-soft);
      white-space: nowrap;
      position: relative;
    }
    .tab-btn:last-child { border-right: none; }
    .tab-btn.active { color: var(--ink); font-weight: 700; background: var(--paper-2); }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: var(--accent);
    }

    .chip-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag-chip {
      min-height: 30px;
      padding: 4px 8px;
      border: 1px solid var(--rule-soft);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
    }
    .tag-chip.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .tag-chip:hover:not(.active) { border-color: var(--rule); color: var(--ink); }

    /* Underlined Paper Form Fields */
    .field {
      margin-bottom: 11px;
    }
    .field-label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-2);
      margin-bottom: 3px;
    }
    .field-input, .field-select {
      width: 100%;
      min-height: 38px;
      padding: 6px 2px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--rule);
      font-size: 15px;
      color: var(--ink);
    }
    .field-select { background: var(--paper); }
    .field-input::placeholder { color: var(--ink-muted); }

    .amount-input-box {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 4px 0 8px;
      border-bottom: 2px solid var(--rule);
      margin-bottom: 10px;
    }
    .amount-currency {
      font-family: var(--font-serif);
      font-size: 30px;
      color: var(--ink-2);
    }
    .amount-input {
      width: 100%;
      background: transparent;
      border: none;
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      outline: none;
    }

    /* Toggle Switch (Rectangular editorial switch) */
    .switch-btn {
      width: 46px;
      height: 26px;
      border: 1px solid var(--rule);
      background: var(--paper-2);
      position: relative;
      flex-shrink: 0;
      transition: background var(--t-fast) var(--ease);
    }
    .switch-btn.on {
      background: var(--ink);
      border-color: var(--ink);
    }
    .switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: var(--ink);
      transition: transform var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
    }
    .switch-btn.on .switch-knob {
      transform: translateX(20px);
      background: var(--paper);
    }

    /* ========================================================================
       7. SCREENS: INTRO, LOCK, WALLETS, ACTIVITY, DESK, EMPTY
       ======================================================================== */
    /* Intro Press-Proof */
    .intro-screen {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px var(--margin) 36px;
      cursor: pointer;
    }
    .intro-center {
      margin: auto 0;
    }
    .intro-rule-draw {
      height: 2px;
      background: var(--rule);
      width: 100%;
      margin: 14px 0;
      transform-origin: left;
      animation: ruleDraw 650ms var(--ease) both;
    }
    .intro-wordmark {
      animation: fadeUp 450ms var(--ease) 120ms both;
    }

    /* Lock Screen (Cover Page) */
    .lock-screen {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px var(--margin) 24px;
    }
    .pin-boxes {
      display: flex;
      gap: 14px;
      margin: 18px 0 8px;
    }
    .pin-boxes.shake {
      animation: shakeX 360ms var(--ease);
    }
    .pin-box {
      width: 44px;
      height: 50px;
      border: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper-2);
    }
    .pin-dot {
      width: 12px;
      height: 12px;
      background: var(--ink);
      transform: scale(0);
      transition: transform 140ms var(--ease);
    }
    .pin-box.filled .pin-dot { transform: scale(1); }
    .pin-box.error { border-color: var(--accent); }
    .pin-box.error .pin-dot { background: var(--accent); }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 2px solid var(--rule);
      border-left: 1px solid var(--rule-soft);
    }
    .pin-key {
      min-height: 62px;
      border-right: 1px solid var(--rule-soft);
      border-bottom: 1px solid var(--rule-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 30px;
      color: var(--ink);
      transition: background var(--t-fast) var(--ease);
    }
    .pin-key:hover { background: var(--paper-2); }
    .pin-key-sub {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-2);
    }

    /* Two-column Newspaper Grid */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gutter);
      padding: 12px 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .col-divided {
      border-right: 1px solid var(--rule-soft);
      padding-right: 12px;
    }

    /* Infographic Charts & Thermometer */
    .chart-box {
      padding: 12px 0;
      border-bottom: 1px solid var(--rule);
    }
    .chart-legend {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .legend-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 5px;
      vertical-align: -1px;
    }

    .thermo-track {
      position: relative;
      height: 22px;
      border: 1px solid var(--rule);
      background: var(--paper-2);
      margin: 10px 0 8px;
    }
    .thermo-fill {
      height: 100%;
      background: var(--salmon);
      border-right: 2px solid var(--accent);
      transition: width 450ms var(--ease);
    }
    .thermo-fill.over {
      background: var(--accent);
    }
    .thermo-ideal {
      position: absolute;
      top: -5px;
      bottom: -5px;
      width: 2px;
      background: var(--ink);
    }
    .thermo-ideal-tag {
      position: absolute;
      top: -19px;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      color: var(--ink);
    }

    /* 100%-stacked Column Inches Bar */
    .col-inches-bar {
      display: flex;
      height: 26px;
      border: 1px solid var(--rule);
      overflow: hidden;
      margin: 10px 0;
    }
    .col-inches-seg {
      height: 100%;
      border-right: 1px solid var(--paper);
      transition: width 350ms var(--ease);
    }
    .col-inches-seg:last-child { border-right: none; }

    /* Category Budget Printed Table */
    .cat-budget-row {
      width: 100%;
      display: grid;
      grid-template-columns: 92px 1fr 90px;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--rule-soft);
      text-align: left;
      min-height: 50px;
    }
    .cat-budget-row:hover { background: var(--paper-2); }
    .spark-track {
      height: 8px;
      background: var(--paper-2);
      border: 1px solid var(--rule-soft);
      width: 100%;
    }
    .spark-fill {
      height: 100%;
      background: var(--ink);
    }
    .spark-fill.near { background: var(--warn); }
    .spark-fill.over { background: var(--accent); }

    /* Desk (Settings) */
    .desk-profile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
    }
    .avatar-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--rule);
      background: var(--ink);
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 22px;
      flex-shrink: 0;
    }
    .desk-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--rule-soft);
      min-height: 52px;
      text-align: left;
    }
    .desk-row-title { font-weight: 500; font-size: 14.5px; }
    .desk-row-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }

    .accent-swatches {
      display: flex;
      gap: 8px;
    }
    .swatch-btn {
      width: 30px;
      height: 30px;
      border: 1px solid var(--rule);
      position: relative;
    }
    .swatch-btn.active::after {
      content: "";
      position: absolute;
      inset: 3px;
      border: 2px solid var(--paper);
    }

    /* Wallet Reorder Controls */
    .reorder-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--rule-soft);
    }
    .reorder-btns {
      display: flex;
      gap: 4px;
    }
    .mini-square-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--rule);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
    }
    .mini-square-btn:disabled { opacity: 0.3; cursor: default; }

    /* ========================================================================
       8. PAPER SHEETS & TOAST
       ======================================================================== */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(26, 23, 20, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t-med) var(--ease);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-paper {
      background: var(--paper);
      border-top: 2px solid var(--rule);
      border-left: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      box-shadow: var(--sheet-shadow);
      max-height: 92%;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform var(--t-med) var(--ease);
    }
    .sheet-backdrop.open .sheet-paper {
      transform: translateY(0);
    }

    .sheet-handle-bar {
      display: flex;
      justify-content: center;
      padding: 7px 0 3px;
      cursor: grab;
    }
    .sheet-handle-rule {
      width: 44px;
      height: 3px;
      background: var(--rule);
    }

    .sheet-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 4px var(--margin) 8px;
      border-bottom: 1px solid var(--rule);
    }

    .sheet-body {
      padding: 12px var(--margin) calc(18px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      scrollbar-width: none;
    }
    .sheet-body::-webkit-scrollbar { display: none; }

    /* Ruled Entry Keypad (optional compact keypad for fast amount tap) */
    .mini-keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--rule);
      border-left: 1px solid var(--rule-soft);
      margin-bottom: 10px;
    }
    .mini-key {
      min-height: 33px;
      border-right: 1px solid var(--rule-soft);
      border-bottom: 1px solid var(--rule-soft);
      font-family: var(--font-mono);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-key:hover { background: var(--paper-2); }

    /* Toast */
    .toast-host {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 14px;
      z-index: 60;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .toast {
      pointer-events: auto;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      border-left: 4px solid var(--accent);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.22);
      animation: fadeDown 220ms var(--ease) both;
    }
    .toast-undo {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--salmon);
      border-bottom: 1px solid var(--salmon);
      padding-bottom: 1px;
      flex-shrink: 0;
    }

    /* ========================================================================
       9. ANIMATIONS & REDUCED MOTION
       ======================================================================== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes ruleDraw {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .stagger-1 { animation: fadeUp 240ms var(--ease) 30ms both; }
    .stagger-2 { animation: fadeUp 240ms var(--ease) 60ms both; }
    .stagger-3 { animation: fadeUp 240ms var(--ease) 90ms both; }
    .stagger-4 { animation: fadeUp 240ms var(--ease) 120ms both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <main class="phone-frame" id="phone-frame" aria-label="Ang Pitaka Gazette app">
      <div id="toast-host" class="toast-host" aria-live="polite"></div>

      <div id="screen-host" tabindex="-1"></div>

      <button class="entry-fab" id="fab-entry" data-qa="fab" aria-label="File new entry" title="File entry">
        <span class="entry-fab-plus">+</span>
        <span class="entry-fab-txt">Entry</span>
      </button>

      <nav class="gazette-nav" id="bottom-nav" aria-label="Gazette sections">
        <button class="nav-item" data-nav="home" aria-label="1 Front">
          <span class="nav-num">01</span>
          <span class="nav-label">Front</span>
        </button>
        <button class="nav-item" data-nav="wallets" aria-label="2 Wallets">
          <span class="nav-num">02</span>
          <span class="nav-label">Wallets</span>
        </button>
        <button class="nav-item" data-nav="activity" aria-label="3 Ledger">
          <span class="nav-num">03</span>
          <span class="nav-label">Ledger</span>
        </button>
        <button class="nav-item" data-nav="settings" aria-label="4 Desk">
          <span class="nav-num">04</span>
          <span class="nav-label">Desk</span>
        </button>
      </nav>

      <div class="sheet-backdrop" id="sheet-backdrop" aria-hidden="true">
        <section class="sheet-paper" id="sheet-paper" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <div class="sheet-handle-bar" id="sheet-handle"><div class="sheet-handle-rule"></div></div>
          <div id="sheet-content"></div>
        </section>
      </div>
    </main>

    <footer class="desktop-caption">
      <span>Ang Pitaka Gazette · Concept 03</span>
      <a href="../index.html">&larr; Design showcase</a>
    </footer>
  </div>

  <script>
    /* ==========================================================================
       PITAKA · My Wallet — shared mock dataset for ALL design concepts.
       Paste this block verbatim into each prototype's <script> (prototypes must
       stay self-contained). Every number shown in a prototype must be derived
       from this data so concepts stay comparable.
       "Today" is fixed to Tue, 24 Nov 2026.
       Mirrors the real app model: src/types/{wallet,schedule,budget,favorite}.ts
       ========================================================================== */
    const TODAY = new Date(2026, 10, 24, 19, 5); // 24 Nov 2026, 7:05 PM

    const PROFILE = {
      fullName: "Justin Santos",
      firstName: "Justin",
      initials: "JS",
      email: "justin.santos@gmail.com",
      lastSyncedAt: "Today, 6:58 PM",
    };

    /* Wallet.type in the app: "E-wallet" | "Bank" | "Cash" (+ preset group "Digital Bank") */
    const WALLETS = [
      { id: "gcash",  name: "GCash",       type: "E-wallet",     account: "Personal",       balance: 18450.75, mark: "G",   logo: "gcash",  brand: "#0a5bff", number: "0917 •••• 482" },
      { id: "bpi",    name: "BPI Savings", type: "Bank",         account: "Primary bank",   balance: 42840.50, mark: "BPI", logo: "bpi",    brand: "#c8102e", number: "•••• 3391" },
      { id: "gotyme", name: "GoTyme",      type: "Digital Bank", account: "Emergency fund", balance: 12700.00, mark: "GT",  logo: "gotyme", brand: "#16b3a6", number: "•••• 7720" },
      { id: "maya",   name: "Maya",        type: "E-wallet",     account: "Savings",        balance: 7680.25,  mark: "M",   logo: "maya",   brand: "#00b464", number: "0917 •••• 482" },
      { id: "cash",   name: "Cash",        type: "Cash",         account: "On hand",        balance: 6350.00,  mark: "₱",   logo: "cash",   brand: "#3f8f5a", number: "Physical" },
    ];

    /* Categories exactly as in the app (label, icon-name hint) */
    const EXPENSE_CATEGORIES = [
      ["Food","cup"],["Groceries","cart"],["Transport","car"],["Bills","bolt"],["Internet","wifi"],
      ["Rent","home"],["Shopping","bag"],["Health","heart"],["Debt","card"],["Loan","bank"],
      ["Leisure","film"],["Subs","sync"],["Education","book"],["Family","users"],["Other","adjust"],
    ];
    const INCOME_CATEGORIES = [
      ["Salary","briefcase"],["Freelance","phone"],["Business","cash"],["Bonus","star"],["Allowance","wallet"],
      ["Interest","trend"],["Cashback","tag"],["Repayment","swap"],["Loan","bank"],["Gift","gift"],
      ["Refund","arrow-down"],["Other","plus"],
    ];

    /* kind: expense category | income category | "Transfer" | "Updated" (balance adjustment)
       amount: negative = money out, positive = money in. Transfers carry `to`. */
    const TRANSACTIONS = [
      { id:"t01", title:"SM Supermarket",          kind:"Groceries", wallet:"gcash",  amount:-1856.35, at:"2026-11-24T18:42", note:"Weekly groceries" },

    function renderColumnChartSvg(series, isWeek) {
      const W = 350, H = 148;
      const padL = 4, padR = 4, padT = 14, padB = 24;
      const chartH = H - padT - padB;
      const maxVal = Math.max(1000, ...series.map((d) => Math.max(d.in, d.out)));
      const n = series.length;
      const slotW = (W - padL - padR) / n;
      const barW = isWeek ? Math.min(14, slotW * 0.34) : Math.max(4, slotW * 0.36);

      const bars = series.map((d, i) => {
        const cx = padL + i * slotW + slotW / 2;
        const outH = (d.out / maxVal) * chartH;
        const inH = (d.in / maxVal) * chartH;
        const isToday = isWeek ? i === n - 1 : d.day === TODAY.getDate();
        const outColor = isToday ? "var(--accent)" : "var(--ink)";
        const both = d.in > 0 && d.out > 0;
        const xOut = (isWeek || both) ? cx - barW - 0.5 : cx - barW / 2;
        const xIn = (isWeek || both) ? cx + 0.5 : cx - barW / 2;

        // Tick labels
        let tick = "";
        if (isWeek) {
          tick = `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="${isToday ? "var(--accent)" : "var(--ink-2)"}">${esc(d.label.toUpperCase())}</text>`;
        } else if (d.day === 1 || d.day === 8 || d.day === 15 || d.day === 22 || d.day === TODAY.getDate()) {
          tick = `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="${isToday ? "var(--accent)" : "var(--ink-2)"}">${d.day}</text>`;
        }

        const isSelected = state.selectedChartDay === i;
        return `
          <g class="chart-col" data-chart-idx="${i}" style="cursor:pointer;">
            ${isSelected ? `<rect x="${padL + i * slotW}" y="${padT}" width="${slotW}" height="${chartH}" fill="var(--accent-soft)"/>` : ""}
            ${d.in > 0 ? `<rect x="${xIn}" y="${padT + chartH - inH}" width="${barW}" height="${Math.max(2, inH)}" fill="url(#hatch-blue)" stroke="var(--ink-blue)" stroke-width="0.9"/>` : ""}
            ${d.out > 0 ? `<rect x="${xOut}" y="${padT + chartH - outH}" width="${barW}" height="${Math.max(2, outH)}" fill="${outColor}"/>` : ""}
            <rect x="${padL + i * slotW}" y="${padT}" width="${slotW}" height="${chartH + padB}" fill="transparent"/>
            ${tick}
          </g>
        `;
      }).join("");

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;" aria-label="Spending and income bar chart">
          <defs>
            <pattern id="hatch-blue" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="4" height="4" fill="var(--ink-blue-soft)"/>
              <line x1="0" y1="0" x2="0" y2="4" stroke="var(--ink-blue)" stroke-width="1.6"/>
            </pattern>
          </defs>
          <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="var(--rule-soft)" stroke-dasharray="2 2"/>
          <line x1="${padL}" y1="${padT + chartH / 2}" x2="${W - padR}" y2="${padT + chartH / 2}" stroke="var(--rule-soft)" stroke-dasharray="2 2"/>
          <line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" stroke="var(--rule)" stroke-width="1"/>
          <text x="${W - padR}" y="${padT - 3}" text-anchor="end" font-family="var(--font-mono)" font-size="9" fill="var(--ink-muted)">${fmtCompact(maxVal)}</text>
          ${bars}
        </svg>
      `;
    }

    function renderActivity(subRoute = "overview") {
      const isBudgets = subRoute === "budgets";
      const isWeek = state.activityRange === "week";
      const novSpent = monthSpent();
      const novIn = monthIncome();
      const budget = state.monthlyBudget;
      const pctBudget = Math.round((novSpent / budget) * 100);
      const idealPct = Math.round((TODAY.getDate() / 30) * 100); // 80%
      const daysLeft = 30 - TODAY.getDate();

      // Series
      const series = isWeek ? weekSeries() : dailySeries();
      const periodSpent = series.reduce((s, d) => s + d.out, 0);
      const periodIn = series.reduce((s, d) => s + d.in, 0);
      const periodNet = periodIn - periodSpent;

      const selectedItem = state.selectedChartDay != null && series[state.selectedChartDay]
        ? series[state.selectedChartDay]
        : series[series.length - 1];
      const selectedLabel = isWeek ? selectedItem.label : `Nov ${selectedItem.day}`;

      // Categories
      const cats = spendingByCategory();
      const catTotal = cats.reduce((s, [, v]) => s + v, 0) || 1;
      const colInchesColors = ["var(--ink)", "var(--accent)", "var(--ink-blue)", "var(--salmon)", "var(--ink-2)"];
      const top4 = cats.slice(0, 4);
      const restSum = cats.slice(4).reduce((s, [, v]) => s + v, 0);
      const stackSegs = [...top4, ...(restSum > 0 ? [["Other", restSum]] : [])];

      // Category budget map
      const spentMap = Object.fromEntries(cats);
      const budgetedRows = Object.entries(CATEGORY_LIMITS).map(([cat, limit]) => {
        const used = spentMap[cat] || 0;
        const pct = Math.round((used / limit) * 100);
        return { cat, limit, used, pct };
      }).sort((a, b) => b.pct - a.pct);

      // Filtered transactions for ledger
      const q = state.activitySearch.trim().toLowerCase();
      const filteredTx = [...TRANSACTIONS].sort((a, b) => txDate(b) - txDate(a)).filter((t) => {
        if (state.activityFilter === "expense" && !isExpense(t)) return false;
        if (state.activityFilter === "income" && !isIncome(t)) return false;
        if (state.activityFilter === "transfer" && !isTransfer(t)) return false;
        if (state.activityFilter === "adjust" && !isAdjust(t)) return false;
        if (state.activityWalletFilter !== "all" && t.wallet !== state.activityWalletFilter && t.to !== state.activityWalletFilter) return false;
        if (q) {
          const w = walletById(t.wallet);
          const hay = `${t.title} ${t.kind} ${t.note || ""} ${w ? w.name : ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      const shownTx = filteredTx.slice(0, state.activityLimit);

      // Group by day
      const groups = [];
      shownTx.forEach((t) => {
        const d = txDate(t);
        const key = d.toDateString();
        let g = groups.find((x) => x.key === key);
        if (!g) { g = { key, date: d, items: [], netOut: 0, netIn: 0 }; groups.push(g); }
        g.items.push(t);
        if (isExpense(t)) g.netOut -= t.amount;
        if (isIncome(t)) g.netIn += t.amount;
      });

      return `
        <div class="screen">
          ${mastheadHtml({ folio: "SECTION 03 · THE FINANCIAL SPREAD", showEye: true })}

          <div class="tab-strip" role="tablist">
            <button class="tab-btn ${!isBudgets ? "active" : ""}" data-nav-to="activity">Dispatches &amp; Flow</button>
            <button class="tab-btn ${isBudgets ? "active" : ""}" data-nav-to="activity/budgets">Budgets &amp; Pace</button>
          </div>

          ${isBudgets ? `
            <!-- BUDGETS SPREAD -->
            <section style="padding-bottom:14px;border-bottom:1px solid var(--rule);">
              <div class="kicker" style="margin-bottom:6px;">MONTHLY ALLOCATION · NOVEMBER</div>
              <h1 class="serif" style="font-size:34px;line-height:1.02;font-weight:400;margin:0 0 8px;">
                ${pctBudget >= 100 ? "Over plan" : `${pctBudget}% of plan`} — <span class="italic">${fmtSerif(Math.max(0, budget - novSpent), { cents: false })}</span> left for ${daysLeft} days.
              </h1>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;">
                <span class="mono" style="font-size:13px;">${maskAmt(novSpent)} spent</span>
                <span class="mono" style="font-size:12px;color:var(--ink-2);">Plan: ${maskAmt(budget, { cents: false })}</span>
              </div>
              <div class="thermo-track" style="margin-top:26px;">
                <div class="thermo-fill ${pctBudget >= 100 ? "over" : ""}" style="width:${Math.min(100, pctBudget)}%;"></div>
                <div class="thermo-ideal" style="left:${idealPct}%;">
                  <span class="thermo-ideal-tag">IDEAL ${idealPct}%</span>
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                <span class="folio" style="color:${pctBudget > idealPct ? "var(--accent)" : "var(--ink-2)"};font-weight:600;">
                  ${pctBudget > idealPct ? `+${pctBudget - idealPct}% AHEAD OF PACE` : "WITHIN IDEAL PACE"}
                </span>
                <button class="text-link" data-nav-to="sheet/budget">Adjust Monthly Plan</button>
              </div>
            </section>

            <section style="padding-top:12px;">
              <div class="section-head" style="border-top:none;padding-top:0;">
                <div>
                  <div class="kicker">CATEGORY QUOTAS</div>
                  <h2 class="section-title-serif">Printed Limits Table</h2>
                </div>
                <span class="folio">TAP ROW TO EDIT</span>
              </div>
              ${budgetedRows.map((r) => {
                const flag = r.pct >= 100 ? "OVER" : r.pct >= 85 ? "NEAR LIMIT" : `${r.pct}%`;
                const cls = r.pct >= 100 ? "over" : r.pct >= 85 ? "near" : "";
                return `
                  <button class="cat-budget-row" data-nav-to="sheet/category-budget/${encodeURIComponent(r.cat)}">
                    <div>
                      <div style="font-weight:600;font-size:13.5px;">${esc(r.cat)}</div>
                      <div class="folio" style="color:${r.pct >= 85 ? "var(--accent)" : "var(--ink-muted)"};font-weight:${r.pct >= 85 ? 700 : 400};">${flag}</div>
                    </div>
                    <div class="spark-track">
                      <div class="spark-fill ${cls}" style="width:${Math.min(100, r.pct)}%;"></div>
                    </div>
                    <div style="text-align:right;">
                      <div class="mono" style="font-size:12.5px;font-weight:500;">${maskAmt(r.used, { cents: false })}</div>
                      <div class="mono" style="font-size:10.5px;color:var(--ink-2);">/ ${maskAmt(r.limit, { cents: false })}</div>
                    </div>
                  </button>
                `;
              }).join("")}
            </section>

            <section style="margin-top:16px;">
              <div class="kicker" style="margin-bottom:8px;">UNBUDGETED NOVEMBER CATEGORIES</div>
              <div class="chip-strip">
                ${cats.filter(([c]) => !CATEGORY_LIMITS[c]).map(([c, amt]) => `
                  <button class="tag-chip" data-nav-to="sheet/category-budget/${encodeURIComponent(c)}">
                    ${esc(c)} · ${maskAmt(amt, { cents: false })} +
                  </button>
                `).join("")}
              </div>
            </section>
          ` : `
            <!-- DISPATCHES / ANALYTICS SPREAD -->
            <section style="padding-bottom:12px;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
                <span class="kicker">${isWeek ? "SEVEN-DAY DISPATCH" : "NOVEMBER ISSUE · SUMMARY"}</span>
                <div style="display:flex;border:1px solid var(--rule);">
                  <button class="tag-chip ${!isWeek ? "active" : ""}" style="border:none;min-height:28px;padding:3px 9px;" data-range="month">Month</button>
                  <button class="tag-chip ${isWeek ? "active" : ""}" style="border:none;min-height:28px;padding:3px 9px;" data-range="week">Week</button>
                </div>
              </div>

              <h1 class="serif" style="font-size:34px;line-height:1.02;font-weight:400;margin:0 0 12px;">
                ${isWeek
                  ? `You spent <span class="italic">${state.hideBalances ? "₱ ••••" : fmt(periodSpent, { cents: false })}</span> over the past seven days.`
                  : `You spent ${state.hideBalances ? "₱ ••••" : fmt(novSpent, { cents: false })} in <span class="italic">November</span> — ${pctBudget}% of plan, with ${daysLeft} days to go.`
                }
              </h1>

              <!-- 3-COL SERIF FLOW CALLOUTS -->
              <div style="display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0;">
                <div style="border-right:1px solid var(--rule-soft);padding-right:8px;">
                  <div class="folio">MONEY IN</div>
                  <div class="serif money-in" style="font-size:23px;line-height:1.1;margin-top:3px;">${fmtSerif(periodIn, { sign: true, cents: false })}</div>
                </div>
                <div style="border-right:1px solid var(--rule-soft);padding:0 8px;">
                  <div class="folio">SPENDING</div>
                  <div class="serif" style="font-size:23px;line-height:1.1;margin-top:3px;">${fmtSerif(-periodSpent, { cents: false })}</div>
                </div>
                <div style="padding-left:8px;">
                  <div class="folio">NET FLOW</div>
                  <div class="serif ${periodNet >= 0 ? "money-in" : ""}" style="font-size:23px;line-height:1.1;margin-top:3px;">${fmtSerif(periodNet, { sign: true, cents: false })}</div>
                </div>
              </div>
            </section>

            <!-- COLUMN CHART -->
            <section class="chart-box">
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
                <span class="small-caps">${isWeek ? "Daily Flow (7 Days)" : "Daily Flow (Nov 1–24)"}</span>
                <span class="mono" style="font-size:11px;">
                  <strong>${esc(selectedLabel)}</strong>:
                  Out ${maskAmt(-selectedItem.out, { cents: false })}
                  ${selectedItem.in > 0 ? ` · <span class="money-in">In ${maskAmt(selectedItem.in, { sign: true, cents: false })}</span>` : ""}
                </span>
              </div>
              ${renderColumnChartSvg(series, isWeek)}
              <div class="chart-legend">
                <span><span class="legend-swatch" style="background:var(--ink);"></span>Out</span>
                <span><span class="legend-swatch" style="background:var(--accent);"></span>Today</span>
                <span><span class="legend-swatch" style="background:var(--ink-blue);"></span>Money In (hatched)</span>
              </div>
            </section>

            <!-- 100%-STACKED COLUMN INCHES -->
            <section style="padding:12px 0;border-bottom:1px solid var(--rule);">
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <span class="small-caps">Column Inches · Category Share</span>
                <button class="text-link" data-nav-to="activity/budgets">Budgets ${icon("chevronRight", 11)}</button>
              </div>
              <div class="col-inches-bar" aria-label="Category spending proportions">
                ${stackSegs.map(([cat, amt], idx) => `
                  <div class="col-inches-seg" style="width:${(amt / catTotal) * 100}%;background:${colInchesColors[idx % colInchesColors.length]};" title="${esc(cat)}: ${Math.round((amt / catTotal) * 100)}%"></div>
                `).join("")}
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11px;">
                ${stackSegs.map(([cat, amt], idx) => `
                  <span style="display:inline-flex;align-items:center;gap:5px;">
                    <span style="width:8px;height:8px;background:${colInchesColors[idx % colInchesColors.length]};display:inline-block;"></span>
                    <span class="small-caps" style="font-size:10px;">${esc(cat)}</span>
                    <span class="mono" style="font-size:10.5px;color:var(--ink-2);">${Math.round((amt / catTotal) * 100)}%</span>
                  </span>
                `).join("")}
              </div>
            </section>

            <!-- BUDGET PACE THERMOMETER -->
            <section style="padding:12px 0;border-bottom:1px solid var(--rule);">
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <span class="small-caps">Monthly Plan Thermometer</span>
                <button class="text-link" data-nav-to="sheet/budget">Edit ₱${(budget / 1000).toFixed(0)}K</button>
              </div>
              <div class="thermo-track" style="margin-top:26px;">
                <div class="thermo-fill ${pctBudget >= 100 ? "over" : ""}" style="width:${Math.min(100, pctBudget)}%;"></div>
                <div class="thermo-ideal" style="left:${idealPct}%;">
                  <span class="thermo-ideal-tag">IDEAL ${idealPct}%</span>
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--ink-2);">
                <span>${maskAmt(novSpent)} / ${maskAmt(budget, { cents: false })}</span>
                <span style="color:${pctBudget > idealPct ? "var(--accent)" : "var(--ink)"};font-weight:600;">${pctBudget}% used · ${daysLeft}d left</span>
              </div>
            </section>

            <!-- FULL LEDGER WITH FILTERS & EXPORT -->
            <section style="padding-top:14px;">
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
                <div>
                  <div class="kicker">ARCHIVE LEDGER</div>
                  <h2 class="section-title-serif">All Transactions (${filteredTx.length})</h2>
                </div>
                <button class="text-link" data-action="export-csv">${icon("download", 13)} Export CSV</button>
              </div>

              <div class="chip-strip" style="margin-bottom:10px;">
                ${[["all", "All"], ["expense", "Expenses"], ["income", "Income"], ["transfer", "Transfers"], ["adjust", "Adjusted"]].map(([k, lbl]) => `
                  <button class="tag-chip ${state.activityFilter === k ? "active" : ""}" data-act-filter="${k}">${lbl}</button>
                `).join("")}
              </div>

              <div style="display:grid;grid-template-columns:1fr 124px;gap:10px;margin-bottom:12px;">
                <input class="field-input" id="activity-search" type="search" placeholder="Filter by merchant or note…" value="${esc(state.activitySearch)}" aria-label="Filter transactions" />
                <select class="field-select" id="activity-wallet-select" aria-label="Filter by wallet">
                  <option value="all" ${state.activityWalletFilter === "all" ? "selected" : ""}>All Wallets</option>
                  ${WALLETS.map((w) => `<option value="${esc(w.id)}" ${state.activityWalletFilter === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}
                </select>
              </div>

              ${groups.length ? groups.map((g) => {
                const subText = g.netOut > 0 ? `Out ${maskAmt(-g.netOut, { cents: false })}` : (g.netIn > 0 ? `In ${maskAmt(g.netIn, { sign: true, cents: false })}` : "");
                return `
                  <div class="ledger-group-head">
                    <span class="ledger-group-date">${esc(dayLabel(g.date))} · ${g.date.toLocaleDateString("en-PH", { weekday: "short", month: "short", day: "numeric" })}</span>
                    <span class="ledger-group-sub">${subText}</span>
                  </div>
                  ${g.items.map((t) => renderLedgerRowHtml(t)).join("")}
                `;
              }).join("") : `
                <p class="serif italic" style="font-size:19px;color:var(--ink-2);padding:20px 0;">
                  No entries match the current ledger filter.
                </p>
              `}

              ${filteredTx.length > state.activityLimit ? `
                <button class="btn btn-outline btn-block" style="margin-top:14px;" data-action="load-more-tx">
                  Load Earlier Dispatches (${filteredTx.length - state.activityLimit} remaining)
                </button>
              ` : ""}
            </section>
          `}
        </div>
      `;
    }

              <div>
                <div class="desk-row-title">Night Edition</div>

    /* ========================================================================
       5. PAPER SHEET RENDERERS

    function sheetHead(kicker, title) {
      return `
        <div class="sheet-head">
          <div>
            <div class="kicker" style="margin-bottom:2px;">${esc(kicker)}</div>
            <h2 class="serif" id="sheet-title" style="font-size:28px;line-height:1.05;font-weight:400;margin:0;">${title}</h2>
          </div>
          <button class="icon-btn" data-action="close-sheet" aria-label="Close slip">${icon("close", 18)}</button>
        </div>
      `;
    }

    function renderAddTxSheet(direction = "expense", editTx = null) {
      const isEdit = !!editTx;
      const dir = isEdit ? (editTx.amount >= 0 ? "income" : "expense") : direction;
      const cats = dir === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
      const draft = state.draftTx || {};
      const selCat = isEdit ? editTx.kind : (draft.category || cats[0][0]);
      const selWallet = isEdit ? editTx.wallet : (draft.wallet || (WALLETS[0] && WALLETS[0].id) || "gcash");
      const defaultAmt = isEdit ? Math.abs(editTx.amount).toFixed(2) : (draft.amount != null ? String(draft.amount) : "");
      const defaultTitle = isEdit ? editTx.title : (draft.title || "");
      const defaultNote = isEdit ? (editTx.note || "") : (draft.note || "");
      const defaultDate = isEdit ? editTx.at.slice(0, 10) : "2026-11-24";

      return `
        ${sheetHead(isEdit ? "AMENDMENT SLIP" : "PAPER ENTRY SLIP", isEdit ? "Edit Entry" : (dir === "income" ? "Record <span class='italic'>Money In</span>" : "File an <span class='italic'>Expense</span>"))}
        <div class="sheet-body">
          ${!isEdit ? `
            <div class="tab-strip" style="margin-bottom:12px;">
              <button type="button" class="tab-btn ${dir === "expense" ? "active" : ""}" data-entry-dir="expense">Expense Out</button>
              <button type="button" class="tab-btn ${dir === "income" ? "active" : ""}" data-entry-dir="income">Money In</button>
            </div>
          ` : ""}

          <form id="entry-slip-form" data-edit-id="${isEdit ? esc(editTx.id) : ""}" data-dir="${dir}">
            <div class="field-label">Amount (PHP)</div>
            <div class="amount-input-box">
              <span class="amount-currency">₱</span>
              <input class="amount-input" id="entry-amount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00" value="${esc(defaultAmt)}" required />
            </div>

            <!-- Compact 4-col ruled helper keypad -->
            <div class="mini-keypad" aria-label="Quick amount buttons">
              ${["+50", "+100", "+500", "CLR"].map((k) => `<button type="button" class="mini-key" data-amt-add="${k}">${k}</button>`).join("")}
            </div>

            <div class="field">
              <label class="field-label" for="entry-title">${dir === "income" ? "Source" : "Where it went"}</label>
              <input class="field-input" id="entry-title" type="text" placeholder="${dir === "income" ? "e.g. Client invoice, Bonus" : "e.g. Mercury Drug, Lunch"}" value="${esc(defaultTitle)}" required />
            </div>

            <div class="field">
              <div class="field-label">Category</div>
              <div class="chip-strip" id="entry-cat-chips">
                ${cats.map(([label]) => `
                  <button type="button" class="tag-chip ${selCat === label ? "active" : ""}" style="min-height:27px;padding:3px 7px;" data-pick-cat="${esc(label)}">${esc(label)}</button>
                `).join("")}
              </div>
              <input type="hidden" id="entry-cat" value="${esc(selCat)}" />
            </div>

            <div style="display:grid;grid-template-columns:1fr 130px;gap:12px;">
              <div class="field">
                <label class="field-label" for="entry-wallet">Account / Wallet</label>
                <select class="field-select" id="entry-wallet">
                  ${WALLETS.map((w) => `<option value="${esc(w.id)}" ${w.id === selWallet ? "selected" : ""}>${esc(w.name)} (${maskAmt(w.balance, { cents: false })})</option>`).join("")}
                </select>
              </div>
              <div class="field">
                <label class="field-label" for="entry-date">Date</label>
                <input class="field-input mono" id="entry-date" type="date" value="${esc(defaultDate)}" style="font-size:13px;" />
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="entry-note">Editorial Note (Optional)</label>
              <input class="field-input" id="entry-note" type="text" placeholder="Memo for the daybook…" value="${esc(defaultNote)}" />
            </div>

            ${!isEdit ? `
              <label style="display:flex;align-items:center;gap:10px;padding:6px 0 14px;cursor:pointer;font-size:13px;">
                <input type="checkbox" id="entry-save-fav" style="width:18px;height:18px;accent-color:var(--ink);" />
                <span>Save to Classifieds (one-tap favorite)</span>
              </label>
            ` : ""}

            <button type="submit" class="btn btn-ink btn-block">
              ${isEdit ? "Update Ledger Entry" : "File Entry to Ledger"}
            </button>
          </form>
        </div>
      `;
    }

      return `
        ${sheetHead("INTERNAL DISPATCH", "Move Funds <span class='italic'>Between</span> Wallets")}
        <div class="sheet-body">
          <form id="transfer-form">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div class="field">
                <label class="field-label" for="txf-from">From Account</label>
                <select class="field-select" id="txf-from">
                  ${WALLETS.map((w) => `<option value="${esc(w.id)}" ${w.id === fromDefault ? "selected" : ""}>${esc(w.name)} (${maskAmt(w.balance, { cents: false })})</option>`).join("")}
                </select>
              </div>
              <div class="field">
                <label class="field-label" for="txf-to">To Account</label>
                <select class="field-select" id="txf-to">
                  ${WALLETS.map((w) => `<option value="${esc(w.id)}" ${w.id === toDefault ? "selected" : ""}>${esc(w.name)} (${maskAmt(w.balance, { cents: false })})</option>`).join("")}
                </select>
              </div>
            </div>

            <div class="field-label">Transfer Amount</div>
            <div class="amount-input-box">
              <span class="amount-currency">₱</span>
              <input class="amount-input" id="txf-amount" type="number" step="0.01" min="1" inputmode="decimal" placeholder="2,000.00" value="2000" required />

              <label class="field-label" for="txf-fee">Optional Transfer Fee (InstaPay / PESONet)</label>

    function renderTxDetailSheet(txId) {
      const t = TRANSACTIONS.find((x) => x.id === txId) || TRANSACTIONS[0];

      const w = walletById(t.wallet);
      const toW = t.to ? walletById(t.to) : null;
      const d = txDate(t);
      const isIn = t.amount > 0 && !isAdjust(t);
      return `
        ${sheetHead(`DISPATCH CLIPPING · ${t.kind.toUpperCase()}`, esc(t.title))}
        <div class="sheet-body">
          <div style="padding:10px 0 14px;border-bottom:1px solid var(--rule);">
            <div class="serif ${isIn ? "money-in" : ""}" style="font-size:48px;line-height:0.95;font-variant-numeric:lining-nums tabular-nums;">
              ${fmtSerif(t.amount, { sign: true, cents: true })}
            </div>
            <div class="folio" style="margin-top:8px;">
              ${d.toLocaleDateString("en-PH", { weekday: "long", day: "numeric", month: "short", year: "numeric" })} · ${timeLabel(d)}
            </div>
          </div>

          <div class="leader-list" style="margin-bottom:16px;">
            <div class="leader-row" style="cursor:default;">
              <div class="leader-top">
                <span class="small-caps" style="color:var(--ink-2);">Account</span>
                <span class="leader-dots"></span>
                <span class="mono" style="font-size:13px;">${esc(w ? w.name : t.wallet)}${toW ? ` &rarr; ${esc(toW.name)}` : ""}</span>
              </div>
            </div>
            <div class="leader-row" style="cursor:default;">
              <div class="leader-top">
                <span class="small-caps" style="color:var(--ink-2);">Classification</span>
                <span class="leader-dots"></span>
                <span class="mono" style="font-size:13px;">${esc(t.kind)}</span>
              </div>
            </div>
            <div class="leader-row" style="cursor:default;">
              <div class="leader-top">
                <span class="small-caps" style="color:var(--ink-2);">Archive Status</span>
                <span class="leader-dots"></span>
                <span class="mono" style="font-size:12px;color:var(--forest);">${state.synced ? "Synced to Archive" : "Saved on device"}</span>
              </div>
            </div>
            ${t.note ? `
              <div class="leader-row" style="cursor:default;">
                <div class="small-caps" style="color:var(--ink-2);margin-bottom:3px;">Editorial Note</div>
                <div class="serif italic" style="font-size:18px;">“${esc(t.note)}”</div>
              </div>
            ` : ""}

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
            <button class="btn btn-outline" data-nav-to="sheet/edit-tx/${esc(t.id)}">${icon("edit", 14)} Edit</button>
            <button class="btn btn-outline" data-fav-from-tx="${esc(t.id)}">${icon("star", 14)} Favorite</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button class="btn btn-outline" data-recur-from-tx="${esc(t.id)}">${icon("calendar", 14)} Recurring</button>
            <button class="btn btn-danger" data-delete-tx="${esc(t.id)}">${icon("trash", 14)} Delete</button>
          </div>
        </div>
      `;
    }

    function renderSearchSheet() {
      const q = state.searchQuery.trim().toLowerCase();
      const matchedWallets = q ? WALLETS.filter((w) => `${w.name} ${w.type} ${w.account}`.toLowerCase().includes(q)) : WALLETS.slice(0, 3);
      const matchedTx = q ? TRANSACTIONS.filter((t) => `${t.title} ${t.kind} ${t.note || ""}`.toLowerCase().includes(q)) : TRANSACTIONS.slice(0, 4);
      const quickActions = [
        { label: "File new expense", route: "sheet/add-tx" },
        { label: "Record money in", route: "sheet/add-income" },
        { label: "Transfer between wallets", route: "sheet/transfer" },
        { label: "Monthly budgets & pace", route: "activity/budgets" },
        { label: "Toggle Night Edition", action: "toggle-theme" },
      ].filter((a) => !q || a.label.toLowerCase().includes(q));

      const emptyResults = q && matchedWallets.length === 0 && matchedTx.length === 0 && quickActions.length === 0;

      return `
        ${sheetHead("THE GAZETTE INDEX", "Search &amp; <span class='italic'>Commands</span>")}
        <div class="sheet-body">
          <div class="field">
            <input class="field-input" id="index-search-input" type="search" placeholder="Search wallets, merchants, categories, commands…" value="${esc(state.searchQuery)}" autofocus />
          </div>

          ${emptyResults ? `
            <p class="serif italic" style="font-size:20px;color:var(--ink-2);padding:16px 0;">
              No dispatches match “${esc(state.searchQuery)}”.
            </p>
          ` : `
            ${quickActions.length ? `
              <div style="margin-bottom:14px;">
                <div class="kicker" style="margin-bottom:6px;">QUICK COMMANDS</div>
                <div class="chip-strip">
                  ${quickActions.map((a) => a.route
                    ? `<button class="tag-chip" data-nav-to="${a.route}">${esc(a.label)}</button>`
                    : `<button class="tag-chip" data-action="${a.action}">${esc(a.label)}</button>`
                  ).join("")}
                </div>
              </div>
            ` : ""}

            ${matchedWallets.length ? `
              <div style="margin-bottom:14px;">
                <div class="kicker" style="margin-bottom:4px;">ACCOUNTS</div>
                ${matchedWallets.map((w) => `
                  <button class="leader-row" data-nav-to="wallet/${esc(w.id)}">
                    <div class="leader-top">
                      <span class="leader-name" style="font-size:18px;">${esc(w.name)}</span>
                      <span class="leader-dots"></span>
                      <span class="leader-amt">${maskAmt(w.balance)}</span>
                    </div>
                  </button>
                `).join("")}
              </div>
            ` : ""}

            ${matchedTx.length ? `
              <div>
                <div class="kicker" style="margin-bottom:4px;">LEDGER ENTRIES (${matchedTx.length})</div>
                ${matchedTx.slice(0, 6).map((t) => renderLedgerRowHtml(t, { showFullDate: true })).join("")}
              </div>
            ` : ""}
          `}
        </div>
      `;
    }

    function renderSchedulesSheet() {
      const sorted = [...SCHEDULES].sort((a, b) => new Date(a.due) - new Date(b.due));
      return `
        ${sheetHead("CALENDAR DESK", "Recurring <span class='italic'>Schedules</span>")}
        <div class="sheet-body">
          <div style="margin-bottom:14px;">
            ${sorted.map((s) => {
              const w = walletById(s.wallet);
              const away = daysAway(s.due);
