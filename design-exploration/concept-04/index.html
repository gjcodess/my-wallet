<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="champagne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>pitaka — Obsidian</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   DESIGN TOKENS — OBSIDIAN (DARK PRIMARY) & PORCELAIN (LIGHT)
   ========================================================================== */
:root {
  color-scheme: dark;
  --bg: #09090A;
  --surface-1: #111113;
  --surface-2: #18181B;
  --surface-3: #222226;
  --hairline: rgba(255, 255, 255, 0.07);
  --hairline-strong: rgba(255, 255, 255, 0.13);
  --text: #EEECE7;
  --text-2: #9C9890;
  --text-3: #64615B;

  --accent: #D8B98A;
  --accent-hi: #F1DDB9;
  --accent-lo: #9E8054;
  --accent-dim: rgba(216, 185, 138, 0.14);
  --accent-glow: rgba(216, 185, 138, 0.28);
  --on-accent: #12100C;

  --in: #86D6A8;
  --in-dim: rgba(134, 214, 168, 0.13);
  --out: #F2937E;
  --out-dim: rgba(242, 147, 126, 0.13);
  --warn: #E9C46A;
  --warn-dim: rgba(233, 196, 106, 0.15);

  --inner-hi: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  --shadow-deep: 0 20px 40px -20px rgba(0, 0, 0, 0.85);
  --shadow-card: 0 16px 36px -14px rgba(0, 0, 0, 0.9);
  --backdrop: rgba(4, 4, 5, 0.76);

  --r-card: 18px;
  --r-ctrl: 12px;
  --r-sheet: 28px;
  --r-pill: 999px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 180ms;
  --dur-med: 280ms;
  --dur-slow: 360ms;

  --font-ui: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SF Mono', monospace;
}

/* Porcelain Light Theme */
html[data-theme="light"] {
  color-scheme: light;
  --bg: #F2F1EE;
  --surface-1: #FFFFFF;
  --surface-2: #E8E6E1;
  --surface-3: #DCD9D2;
  --hairline: rgba(20, 20, 20, 0.08);
  --hairline-strong: rgba(20, 20, 20, 0.15);
  --text: #141414;
  --text-2: #59554F;
  --text-3: #878279;

  --accent: #9A7442;
  --accent-hi: #B88E56;
  --accent-lo: #75562E;
  --accent-dim: rgba(154, 116, 66, 0.12);
  --accent-glow: rgba(154, 116, 66, 0.22);
  --on-accent: #FFFFFF;

  --in: #1B7A4B;
  --in-dim: rgba(27, 122, 75, 0.11);
  --out: #C1422B;
  --out-dim: rgba(193, 66, 43, 0.11);
  --warn: #9E680A;
  --warn-dim: rgba(158, 104, 10, 0.12);

  --inner-hi: inset 0 1px 0 rgba(255, 255, 255, 0.75);
  --shadow-deep: 0 20px 40px -20px rgba(20, 18, 14, 0.18);
  --shadow-card: 0 14px 30px -14px rgba(20, 18, 14, 0.28);
  --backdrop: rgba(20, 20, 22, 0.45);
}

/* Accent Swatches (Dark + Light tuned) */
html[data-accent="platinum"] {
  --accent: #C9CED6;
  --accent-hi: #E7EBF1;
  --accent-lo: #8B929E;
  --accent-dim: rgba(201, 206, 214, 0.15);
  --accent-glow: rgba(201, 206, 214, 0.28);
  --on-accent: #0F1114;
}
html[data-theme="light"][data-accent="platinum"] {
  --accent: #5C6573;
  --accent-hi: #798394;
  --accent-lo: #3E4550;
  --accent-dim: rgba(92, 101, 115, 0.13);
  --on-accent: #FFFFFF;
}

html[data-accent="jade"] {
  --accent: #7FC8A9;
  --accent-hi: #B0E6CE;
  --accent-lo: #4E9375;
  --accent-dim: rgba(127, 200, 169, 0.15);
  --accent-glow: rgba(127, 200, 169, 0.28);
  --on-accent: #0B1611;
}
html[data-theme="light"][data-accent="jade"] {
  --accent: #277858;
  --accent-hi: #369771;
  --accent-lo: #19563D;
  --accent-dim: rgba(39, 120, 88, 0.13);
  --on-accent: #FFFFFF;
}

html[data-accent="rose"] {
  --accent: #E3A6A0;
  --accent-hi: #F7CCC8;
  --accent-lo: #AC706A;
  --accent-dim: rgba(227, 166, 160, 0.15);
  --accent-glow: rgba(227, 166, 160, 0.28);
  --on-accent: #1B0F0E;
}
html[data-theme="light"][data-accent="rose"] {
  --accent: #A55852;
  --accent-hi: #C2716A;
  --accent-lo: #7D3D38;
  --accent-dim: rgba(165, 88, 82, 0.12);
  --on-accent: #FFFFFF;
}

/* ==========================================================================
   RESET & BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, select { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
button { cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
svg { display: block; flex-shrink: 0; }

.tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ==========================================================================
   DESKTOP STAGE & MOBILE VIEWPORT FRAME
   ========================================================================== */
.stage {
  min-height: 100dvh;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
.stage-caption {
  display: none;
}
.phone {
  position: relative;
  width: 100%;
  height: 100dvh;
  background: var(--bg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

@media (min-width: 501px) {
  .stage {
    padding: 12px 16px;
    background: radial-gradient(circle at 50% 25%, #16161A 0%, #060607 100%);
  }
  html[data-theme="light"] .stage {
    background: radial-gradient(circle at 50% 25%, #E5E3DD 0%, #D3D0C8 100%);
  }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    border: 1px solid var(--hairline-strong);
    box-shadow: 0 36px 80px -24px rgba(0, 0, 0, 0.85), 0 0 0 8px rgba(255, 255, 255, 0.025);
  }
  html[data-theme="light"] .phone {
    box-shadow: 0 36px 80px -24px rgba(20, 18, 12, 0.25), 0 0 0 8px rgba(20, 20, 20, 0.04);
  }
  .stage-caption {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-2);
    letter-spacing: 0.02em;
  }
  .stage-caption a {
    color: var(--accent);
    font-weight: 500;
    transition: opacity var(--dur-fast);
  }
  .stage-caption a:hover { opacity: 0.8; }
  .stage-caption .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
}

/* Film grain overlay (non-blocking) */
.film-grain {
  pointer-events: none;
  position: absolute;
  inset: 0;
  z-index: 2;
  opacity: 0.032;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
html[data-theme="light"] .film-grain { opacity: 0.024; }

/* ==========================================================================
   LAYOUT CONTAINERS & SCROLLING
   ========================================================================== */
.app-scroll {
  position: relative;
  z-index: 3;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: max(16px, env(safe-area-inset-top)) 20px 112px;
  scrollbar-width: none;
}
.app-scroll::-webkit-scrollbar { display: none; }
.app-scroll.no-dock { padding-bottom: max(28px, env(safe-area-inset-bottom)); }

.screen-enter {
  animation: screenFadeUp var(--dur-med) var(--ease-spring) both;
}
@keyframes screenFadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   HEADER & WORDMARK
   ========================================================================== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  margin-bottom: 18px;
}
.wordmark {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--text);
}
.top-actions { display: flex; align-items: center; gap: 10px; }

.icon-btn {
  width: 40px;
  height: 40px;
  min-width: 40px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  box-shadow: var(--inner-hi);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  transition: transform var(--dur-fast) var(--ease-spring), background var(--dur-fast), border-color var(--dur-fast);
}
.icon-btn:active { transform: scale(0.94); box-shadow: inset 0 2px 6px rgba(0,0,0,0.45); }

.avatar-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--r-pill);
  background: var(--surface-1);
  border: 1.5px solid var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim), var(--inner-hi);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--accent-hi);
  transition: transform var(--dur-fast) var(--ease-spring);
}
html[data-theme="light"] .avatar-btn { color: var(--accent); }
.avatar-btn:active { transform: scale(0.94); }

.page-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  margin-bottom: 16px;
}
.page-title {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.025em;
  margin: 0;
}

/* ==========================================================================
   HOME HERO BALANCE
   ========================================================================== */
.greeting {
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 6px;
  font-weight: 400;
}
.hero-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}
.mono-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-3);
}
.hero-balance-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.hero-balance {
  font-size: 46px;
  line-height: 1.06;
  font-weight: 300;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  margin: 2px 0 8px;
}
.hero-balance .peso {
  color: var(--accent);
  font-weight: 400;
  margin-right: 2px;
}
.hero-balance .cents {
  color: var(--text-3);
  font-size: 32px;
  font-weight: 300;
}
.hero-balance .masked {
  letter-spacing: 0.08em;
  color: var(--text-2);
  font-size: 34px;
}
.eye-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--r-pill);
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform var(--dur-fast) var(--ease-spring), color var(--dur-fast);
}
.eye-btn:active { transform: scale(0.93); }
.eye-btn:hover { color: var(--text); }

.flow-inline {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--text-2);
  margin-bottom: 20px;
}
.flow-inline .in-val { color: var(--in); font-weight: 500; }
.flow-inline .out-val { color: var(--out); font-weight: 500; }
.flow-inline .sep { color: var(--text-3); }

/* ==========================================================================
   QUICK ACTIONS (4 ROUND BUTTONS)
   ========================================================================== */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.qa-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}
.qa-circle {
  width: 56px;
  height: 56px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  box-shadow: var(--inner-hi), 0 8px 18px -12px rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  transition: transform var(--dur-fast) var(--ease-spring), border-color var(--dur-fast), background var(--dur-fast);
}
.qa-item:active .qa-circle { transform: scale(0.94); box-shadow: inset 0 2px 6px rgba(0,0,0,0.5); }
.qa-item:hover .qa-circle { border-color: var(--hairline-strong); }
.qa-circle.accent-ring { border-color: rgba(216,185,138,0.35); color: var(--accent); }
.qa-label { font-size: 12px; color: var(--text-2); font-weight: 500; }

/* ==========================================================================
   PHYSICAL METAL WALLET CARD + 3D STACK
   ========================================================================== */
.section-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 10px;
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.section-link {
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
  padding: 6px 4px;
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.stack-wrap {
  position: relative;
  margin-bottom: 24px;
}
.card-stack {
  position: relative;
  width: 100%;
  height: 246px;
  touch-action: pan-y;
  user-select: none;
}
.metal-card {
  position: relative;
  width: 100%;
  aspect-ratio: 1.586 / 1;
  border-radius: var(--r-card);
  padding: 18px 20px 18px 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  color: #EEECE7;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
    linear-gradient(135deg, #25252A 0%, #151518 42%, #0E0E10 74%, #1A1A1F 100%);
  border: 1px solid rgba(255, 255, 255, 0.11);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), var(--shadow-card);
  transition: transform 340ms var(--ease-spring), opacity 300ms ease, filter 300ms ease;
}
.metal-card::before {
  /* subtle diagonal brushed specular sheen */
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(118deg, transparent 22%, rgba(255,255,255,0.045) 45%, rgba(216,185,138,0.04) 50%, transparent 64%);
  pointer-events: none;
}
.metal-card::after {
  /* brand-coloured left edge-light */
  content: "";
  position: absolute;
  left: 0;
  top: 14px;
  bottom: 14px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--card-brand, var(--accent));
  box-shadow: 0 0 14px 1px var(--card-brand, var(--accent));
}
.card-stack .metal-card {
  position: absolute;
  left: 0;
  top: 0;
  cursor: pointer;
}
.card-stack .metal-card.pos-0 {
  z-index: 4;
  transform: translate3d(0, 0, 0) scale(1);
  opacity: 1;
}
.card-stack .metal-card.pos-1 {
  z-index: 3;
  transform: translate3d(0, 15px, 0) scale(0.935);
  opacity: 0.92;
  filter: brightness(0.86);
  border-color: rgba(255, 255, 255, 0.14);
}
.card-stack .metal-card.pos-2 {
  z-index: 2;
  transform: translate3d(0, 28px, 0) scale(0.87);
  opacity: 0.74;
  filter: brightness(0.76);
  border-color: rgba(255, 255, 255, 0.13);
}
.card-stack .metal-card.pos-hidden {
  z-index: 1;
  transform: translate3d(0, 36px, 0) scale(0.82);
  opacity: 0;
  pointer-events: none;
}
.card-stack .metal-card.pos-0:active { transform: translate3d(0, 2px, 0) scale(0.985); }

.mc-top {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mc-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.mc-logo {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.14);
  background: #1B1B1E;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #EEECE7;
}
.mc-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mc-type {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(238, 236, 231, 0.56);
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.09);
  background: rgba(255,255,255,0.03);
}
.mc-mid {
  position: relative;
  z-index: 1;
  margin-top: 8px;
}
.mc-name {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #EEECE7;
}
.mc-account {
  font-size: 12px;
  color: rgba(238, 236, 231, 0.62);
  margin-top: 2px;
}
.mc-bottom {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
}
.mc-number {
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.06em;
  color: rgba(238, 236, 231, 0.55);
}
.mc-balance {
  font-size: 23px;
  font-weight: 500;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  color: #EEECE7;
}
.mc-balance .peso { color: var(--accent); margin-right: 1px; font-weight: 400; }
.mc-balance .cents { color: rgba(238, 236, 231, 0.5); font-size: 16px; font-weight: 400; }

.stack-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
  padding: 0 2px;
}
.stack-dots { display: flex; align-items: center; gap: 6px; }
.stack-dot {
  width: 6px;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--text-3);
  transition: width var(--dur-med) var(--ease-spring), background var(--dur-fast);
}
.stack-dot.active { width: 18px; background: var(--accent); }
.stack-nav-btns { display: flex; align-items: center; gap: 6px; }
.stack-mini-btn {
  height: 28px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.stack-mini-btn:active { transform: scale(0.95); }

/* ==========================================================================
   HORIZONTAL CHIPS (FAVORITES) & UPCOMING CARDS
   ========================================================================== */
.h-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  margin: 0 -20px 22px;
  padding: 2px 20px;
  scrollbar-width: none;
}
.h-scroll::-webkit-scrollbar { display: none; }

.fav-chip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 8px 13px 8px 9px;
  min-height: 44px;
  border-radius: var(--r-pill);
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  box-shadow: var(--inner-hi);
  transition: transform var(--dur-fast) var(--ease-spring), border-color var(--dur-fast);
}
.fav-chip:active { transform: scale(0.96); }
.fav-chip:hover { border-color: var(--hairline-strong); }
.fav-ico {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.fav-name { font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; }
.fav-amt { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); }

.upcoming-tile {
  flex: 0 0 172px;
  padding: 13px 14px;
  border-radius: var(--r-card);
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  box-shadow: var(--inner-hi);
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  transition: transform var(--dur-fast) var(--ease-spring), border-color var(--dur-fast);
}
.upcoming-tile:active { transform: scale(0.97); }
.upcoming-tile.urgent { border-color: rgba(233, 196, 106, 0.34); }
.up-due {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-2);
}
.upcoming-tile.urgent .up-due { color: var(--warn); font-weight: 500; }
.up-title { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.up-amt { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.up-amt.in { color: var(--in); }
.up-wallet { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }

/* ==========================================================================
   PANELS & TRANSACTION ROWS
   ========================================================================== */
.panel {
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-card);
  box-shadow: var(--inner-hi);
  overflow: hidden;
}
.panel-pad { padding: 16px; }

.tx-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  min-height: 60px;
  text-align: left;
  border-bottom: 1px solid var(--hairline);
  transition: background var(--dur-fast), transform var(--dur-fast) var(--ease-spring);
}
.tx-row:last-child { border-bottom: none; }
.tx-row:active { background: var(--surface-2); transform: scale(0.99); }
.tx-ico {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  flex-shrink: 0;
}
.tx-ico.income { color: var(--in); background: var(--in-dim); border-color: transparent; }
.tx-ico.transfer { color: var(--accent); background: var(--accent-dim); border-color: transparent; }
.tx-ico.adjusted { color: var(--warn); background: var(--warn-dim); border-color: transparent; }
.tx-main { flex: 1; min-width: 0; }
.tx-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tx-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--text-2);
}
.tx-meta .mono-time { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
.tx-right { text-align: right; flex-shrink: 0; }
.tx-amt { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tx-amt.in { color: var(--in); }
.tx-amt.out { color: var(--text); }
.tx-amt.transfer { color: var(--text-2); }
.tx-kind { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); margin-top: 2px; }

/* ==========================================================================
   WALLETS SCREEN — ALLOCATION DIAL & MINI METAL CARD EDGES
   ========================================================================== */
.dial-card {
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-card);
  box-shadow: var(--inner-hi), var(--shadow-deep);
  padding: 18px 16px 14px;
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.dial-svg-wrap {
  position: relative;
  width: 244px;
  height: 196px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dial-center {
  position: absolute;
  top: 56%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  width: 164px;
  pointer-events: none;
}
.dial-center-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.dial-center-val {
  font-size: 25px;
  font-weight: 400;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.dial-center-share {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  margin-top: 4px;
}
.dial-legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 12px;
  margin-top: 4px;
}
.dial-leg-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-2);
  padding: 4px 8px;
  border-radius: var(--r-pill);
  border: 1px solid transparent;
  transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
}
.dial-leg-item.active {
  background: var(--surface-2);
  border-color: var(--accent);
  color: var(--text);
}
.dial-swatch { width: 7px; height: 7px; border-radius: 50%; }

.wallet-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.mini-metal-card {
  position: relative;
  height: 76px;
  border-radius: var(--r-card);
  padding: 12px 16px 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  overflow: hidden;
  color: #EEECE7;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
    linear-gradient(125deg, #212126 0%, #141417 55%, #1A1A1E 100%);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 10px 24px -14px rgba(0,0,0,0.75);
  transition: transform var(--dur-fast) var(--ease-spring), border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.mini-metal-card::after {
  content: "";
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--card-brand, var(--accent));
  box-shadow: 0 0 10px var(--card-brand, var(--accent));
}
.mini-metal-card:active { transform: scale(0.985); }
.mini-metal-card.lifting {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 16px 32px -12px rgba(216,185,138,0.28);
  transform: scale(1.015);
}
.mmc-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mmc-info { min-width: 0; text-align: left; }
.mmc-name { font-size: 14.5px; font-weight: 600; color: #EEECE7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mmc-sub { font-family: var(--font-mono); font-size: 10.5px; color: rgba(238,236,231,0.56); margin-top: 2px; }
.mmc-right { text-align: right; flex-shrink: 0; }
.mmc-bal { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EEECE7; }
.mmc-type { font-family: var(--font-mono); font-size: 10px; color: rgba(238,236,231,0.48); margin-top: 2px; }

.reorder-btns { display: flex; align-items: center; gap: 6px; }
.reorder-btn {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #EEECE7;
  display: flex;
  align-items: center;
  justify-content: center;
}
.reorder-btn:disabled { opacity: 0.25; cursor: default; }

.add-wallet-dashed {
  width: 100%;
  height: 60px;
  border-radius: var(--r-card);
  border: 1.5px dashed var(--hairline-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-2);
  transition: border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-spring);
}
.add-wallet-dashed:hover { border-color: var(--accent); color: var(--accent); }
.add-wallet-dashed:active { transform: scale(0.985); }

/* ==========================================================================
   SEGMENTED CONTROL & CHIPS
   ========================================================================== */
.seg-ctrl {
  position: relative;
  display: grid;
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  border-radius: var(--r-ctrl);
  padding: 3px;
  gap: 2px;
}
.seg-ctrl.cols-2 { grid-template-columns: repeat(2, 1fr); }
.seg-ctrl.cols-3 { grid-template-columns: repeat(3, 1fr); }
.seg-ctrl.cols-4 { grid-template-columns: repeat(4, 1fr); }
.seg-btn {
  position: relative;
  z-index: 1;
  height: 34px;
  border-radius: 9px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-2);
  transition: color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast);
}
.seg-btn.active {
  background: var(--surface-1);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--inner-hi), 0 4px 12px -4px rgba(0,0,0,0.45);
}

.chips-row {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0;
  scrollbar-width: none;
}
.chips-row::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  height: 34px;
  padding: 0 13px;
  border-radius: var(--r-pill);
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform var(--dur-fast) var(--ease-spring), border-color var(--dur-fast), color var(--dur-fast), background var(--dur-fast);
}
.chip:active { transform: scale(0.95); }
.chip.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent-hi);
}
html[data-theme="light"] .chip.active { color: var(--accent); }

/* ==========================================================================
   ACTIVITY SCREEN — BUDGET HERO, LUMINOUS CHART, BARS & LEDGER
   ========================================================================== */
.act-hero {
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-card);
  box-shadow: var(--inner-hi);
  padding: 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.act-hero-val {
  font-size: 32px;
  font-weight: 300;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}
.act-hero-sub {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 4px;
}
.act-hero-sub.warn { color: var(--warn); }

.ring-btn {
  position: relative;
  width: 68px;
  height: 68px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ring-pct {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
}

.chart-panel {
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-card);
  box-shadow: var(--inner-hi);
  padding: 14px 14px 12px;
  margin-bottom: 14px;
}
.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  gap: 8px;
}
.chart-readout {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  padding: 4px 9px;
  border-radius: 8px;
  white-space: nowrap;
}
.chart-svg { width: 100%; height: 156px; touch-action: none; cursor: crosshair; }

.trio-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-card);
  box-shadow: var(--inner-hi);
  margin-bottom: 18px;
}
.trio-cell {
  padding: 13px 12px;
  border-right: 1px solid var(--hairline);
}
.trio-cell:last-child { border-right: none; }
.trio-val {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}

/* Progress track & ranked bars */
.budget-row {
  width: 100%;
  padding: 13px 16px;
  border-bottom: 1px solid var(--hairline);
  text-align: left;
  transition: background var(--dur-fast);
}
.budget-row:last-child { border-bottom: none; }
.budget-row:active { background: var(--surface-2); }
.budget-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
  font-size: 13.5px;
}
.budget-row-title { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.budget-row-nums { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); }
.budget-row-nums strong { color: var(--text); font-weight: 500; }
.budget-row.near .budget-row-nums strong { color: var(--warn); }
.budget-row.over .budget-row-nums strong { color: var(--out); }

.track {
  width: 100%;
  height: 5px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}
.track-fill {
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--accent);
  transition: width 420ms var(--ease-spring);
}
.track-fill.near { background: var(--warn); }
.track-fill.over { background: var(--out); }

.ranked-row {
  padding: 11px 16px;
  border-bottom: 1px solid var(--hairline);
}
.ranked-row:last-child { border-bottom: none; }
.ranked-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
}
.ranked-pct { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); margin-left: 6px; }

/* Search & filter bar */
.input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  min-width: 0;
  width: 100%;
  padding: 0 13px;
  border-radius: var(--r-ctrl);
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  color: var(--text);
}
.input-wrap:focus-within { border-color: var(--accent); }
.input-wrap input, .input-wrap select {
  flex: 1;
  width: 100%;
  min-width: 0;
  font-size: 13.5px;
  background: transparent;
}
.input-wrap select option { background: var(--surface-1); color: var(--text); }

.day-group-hd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 12px 16px 6px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--hairline);
}

/* ==========================================================================
   SETTINGS SCREEN & METALLIC TOGGLES
   ========================================================================== */
.profile-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: var(--surface-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-card);
  box-shadow: var(--inner-hi);
  margin-bottom: 18px;
}
.profile-ring {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1.5px solid var(--accent);
  box-shadow: 0 0 0 4px var(--accent-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 600;
  color: var(--accent-hi);
  flex-shrink: 0;
}
html[data-theme="light"] .profile-ring { color: var(--accent); }

.set-group-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 16px 0 8px 4px;
}
.set-row {
  width: 100%;
  min-height: 54px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--hairline);
  text-align: left;
}
.set-row:last-child { border-bottom: none; }
.set-row-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.set-ico {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
}
.set-title { font-size: 14px; font-weight: 500; color: var(--text); }
.set-sub { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }

.toggle {
  position: relative;
  width: 48px;
  height: 28px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  border: 1px solid var(--hairline-strong);
  transition: background var(--dur-fast), border-color var(--dur-fast);
  flex-shrink: 0;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: linear-gradient(145deg, #F5F3EE, #B6B2AA);
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
  transition: transform 260ms var(--ease-spring), background var(--dur-fast);
}
.toggle.on {
  background: var(--accent-dim);
  border-color: var(--accent);
}
.toggle.on::after {
  transform: translateX(20px);
  background: linear-gradient(145deg, var(--accent-hi), var(--accent));
}

.swatch-row { display: flex; align-items: center; gap: 10px; }
.swatch-disc {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.2);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.45), 0 4px 10px -4px rgba(0,0,0,0.6);
  transition: transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast);
}
.swatch-disc.active {
  transform: scale(1.12);
  box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 3.5px var(--text);
}

.sync-pulse {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--in);
  margin-right: 6px;
}
.sync-pulse.syncing {
  background: var(--accent);
  animation: pulseGlow 0.9s ease-in-out infinite alternate;
}
@keyframes pulseGlow {
  from { transform: scale(0.8); box-shadow: 0 0 0 0 var(--accent-glow); }
  to { transform: scale(1.2); box-shadow: 0 0 0 6px transparent; }
}

/* ==========================================================================
   FLOATING DOCK + RADIAL FAN MENU
   ========================================================================== */
.dock-wrap {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 30;
  pointer-events: none;
}
.dock {
  pointer-events: auto;
  position: relative;
  height: 64px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  border: 1px solid var(--hairline-strong);
  box-shadow: var(--inner-hi), var(--shadow-deep);
  display: grid;
  grid-template-columns: 1fr 1fr 72px 1fr 1fr;
  align-items: center;
  padding: 0 8px;
}
.dock-item {
  height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-3);
  border-radius: var(--r-pill);
  transition: color var(--dur-fast), transform var(--dur-fast) var(--ease-spring);
}
.dock-item:active { transform: scale(0.93); }
.dock-item.active { color: var(--accent); }
.dock-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.01em; }

.dock-fab-slot {
  display: flex;
  align-items: center;
  justify-content: center;
}
.dock-fab {
  width: 56px;
  height: 56px;
  margin-top: -20px;
  border-radius: 50%;
  background: #09090A;
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 4px var(--surface-2), 0 12px 26px -6px rgba(0,0,0,0.85), inset 0 1px 0 rgba(241,221,185,0.35);
  color: var(--accent-hi);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 280ms var(--ease-spring), box-shadow 240ms ease;
}
html[data-theme="light"] .dock-fab {
  background: #141414;
  color: #F1DDB9;
  box-shadow: 0 0 0 4px var(--surface-2), 0 12px 24px -6px rgba(20,18,14,0.38);
}
.dock-fab:active { transform: scale(0.93); }
.dock-fab.open { transform: rotate(45deg); background: var(--accent); color: var(--on-accent); }

/* Radial fan menu */
.fan-backdrop {
  position: absolute;
  inset: 0;
  z-index: 25;
  background: var(--backdrop);
  opacity: 0;
  pointer-events: none;

/* ----------------------------- helpers ---------------------------------- */
const fmt = (v, { sign = false, cents = true } = {}) => {
  const abs = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  return `${v < 0 ? "−" : sign && v > 0 ? "+" : ""}₱${abs}`;
};
const fmtCompact = (v) => Math.abs(v) >= 1000 ? `₱${(v / 1000).toFixed(1).replace(/\.0$/, "")}K` : `₱${Math.round(v)}`;
const splitMoney = (v) => { const [w, c] = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).split("."); return { whole: w, cents: c }; };
const walletById = (id) => WALLETS.find((w) => w.id === id);
const isTransfer = (t) => t.kind === "Transfer";
const isAdjust = (t) => t.kind === "Updated";
const isExpense = (t) => t.amount < 0 && !isTransfer(t) && !isAdjust(t);
const isIncome = (t) => t.amount > 0 && !isTransfer(t) && !isAdjust(t);
const txDate = (t) => new Date(t.at);
const sameMonth = (d, ref = TODAY) => d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
const totalBalance = () => WALLETS.reduce((s, w) => s + w.balance, 0);
const monthTx = (ref = TODAY) => TRANSACTIONS.filter((t) => sameMonth(txDate(t), ref));
const monthSpent = (ref = TODAY) => monthTx(ref).filter(isExpense).reduce((s, t) => s - t.amount, 0);
const monthIncome = (ref = TODAY) => monthTx(ref).filter(isIncome).reduce((s, t) => s + t.amount, 0);
const spendingByCategory = (ref = TODAY) => {
  const m = {}; monthTx(ref).filter(isExpense).forEach((t) => { m[t.kind] = (m[t.kind] || 0) - t.amount; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
};
const dailySeries = (ref = TODAY) => Array.from({ length: ref.getDate() }, (_, i) => {
  const day = i + 1; const tx = monthTx(ref).filter((t) => txDate(t).getDate() === day);
  return { day, in: tx.filter(isIncome).reduce((s, t) => s + t.amount, 0), out: tx.filter(isExpense).reduce((s, t) => s - t.amount, 0) };
});
const weekSeries = (ref = TODAY) => Array.from({ length: 7 }, (_, i) => {
  const d = new Date(ref); d.setDate(ref.getDate() - 6 + i);
  const tx = TRANSACTIONS.filter((t) => txDate(t).toDateString() === d.toDateString());
  return { label: d.toLocaleDateString("en-PH", { weekday: "short" }), date: d, in: tx.filter(isIncome).reduce((s, t) => s + t.amount, 0), out: tx.filter(isExpense).reduce((s, t) => s - t.amount, 0) };
});
const walletTx = (id) => TRANSACTIONS.filter((t) => t.wallet === id || t.to === id)
  .map((t) => (t.to === id ? { ...t, amount: Math.abs(t.amount), incoming: true } : t));
const dayLabel = (d) => {
  const diff = Math.round((new Date(TODAY.toDateString()) - new Date(d.toDateString())) / 864e5);
  return diff === 0 ? "Today" : diff === 1 ? "Yesterday" : d.toLocaleDateString("en-PH", { month: "short", day: "numeric" });
};
const timeLabel = (d) => d.toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" });
const daysAway = (iso) => Math.round((new Date(iso + "T00:00:00") - new Date(TODAY.toDateString())) / 864e5);
const dueLabel = (n) => n === 0 ? "Due today" : n === 1 ? "Due tomorrow" : n < 0 ? `${-n} days overdue` : `Due in ${n} days`;

};

function getUrlParams() {
  const out = new URLSearchParams(window.location.search);
  const hash = window.location.hash || "";
  const qIdx = hash.indexOf("?");
  if (qIdx !== -1) {
    const hParams = new URLSearchParams(hash.slice(qIdx + 1));
    hParams.forEach((v, k) => { if (!out.has(k)) out.set(k, v); });
  }
  return out;
}

function applyThemeAndParams() {
  const params = getUrlParams();
  const qTheme = params.get("theme");
  if (qTheme === "light" || qTheme === "dark") STATE.theme = qTheme;
  const qAccent = params.get("accent");
  if (["champagne","platinum","jade","rose"].includes(qAccent)) STATE.accent = qAccent;
  if (params.get("hidden") === "1") STATE.hideBalances = true;
  document.documentElement.setAttribute("data-theme", STATE.theme);
  document.documentElement.setAttribute("data-accent", STATE.accent);
}

function maskAmt(str) {
  return STATE.hideBalances ? "₱ •••••" : str;
}

function heroMoneyHtml(val) {
  if (STATE.hideBalances) return `<span class="peso">₱</span><span class="masked">•••••</span>`;
  const { whole, cents } = splitMoney(val);
  return `${val < 0 ? "−" : ""}<span class="peso">₱</span>${whole}<span class="cents">.${cents}</span>`;
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.innerHTML = `<span style="color:var(--accent);display:flex;">${icon("check", 15)}</span><span>${msg}</span>`;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

function resetDemoData() {
  Object.assign(PROFILE, JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.profile)));
  WALLETS.splice(0, WALLETS.length, ...JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.wallets)));
  TRANSACTIONS.splice(0, TRANSACTIONS.length, ...JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.transactions)));
  MONTHLY_BUDGET = INITIAL_SNAPSHOT.monthlyBudget;
  Object.keys(CATEGORY_LIMITS).forEach((k) => delete CATEGORY_LIMITS[k]);
  Object.assign(CATEGORY_LIMITS, JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.categoryLimits)));
  FAVORITES.splice(0, FAVORITES.length, ...JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.favorites)));
  SCHEDULES.splice(0, SCHEDULES.length, ...JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.schedules)));
  STATE.activeCardIdx = 0;
  STATE.hideBalances = false;
  STATE.pinCode = "1234";
  STATE.emptyPreview = false;
  showToast("Demo data restored");
  render();
}

function logoKeyForPreset(name) {
  const k = String(name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  if (k === "coinsph") return "coinsph";
  return LOGOS[k] ? k : null;
}

function renderWalletLogo(w, size = 30) {
  const src = w.logo && LOGOS[w.logo] ? LOGOS[w.logo] : null;
  if (src) {
    return `<div class="mc-logo" style="width:${size}px;height:${size}px;"><img src="${src}" alt="${esc(w.name)}" /></div>`;
  }
  return `<div class="mc-logo" style="width:${size}px;height:${size}px;background:linear-gradient(135deg,${w.brand || '#333'}33,#111);border-color:${w.brand || '#555'}66;">${esc(w.mark || w.name.slice(0,2).toUpperCase())}</div>`;
}

function renderMetalCard(w, cls = "", attrs = "") {

    </div>
  </div>`;
}

function renderTxRow(t, { contextWalletId = null, showDate = false } = {}) {
  const w = walletById(t.wallet);
  const toW = t.to ? walletById(t.to) : null;
  const d = txDate(t);
  let icoCls = "";
  let amtCls = "out";
  let signStr = "";
  if (isTransfer(t)) {
    icoCls = "transfer";
    amtCls = t.incoming ? "in" : "transfer";
    signStr = t.incoming ? fmt(Math.abs(t.amount), { sign: true }) : fmt(-Math.abs(t.amount));
  } else if (isAdjust(t)) {
    icoCls = "adjusted";
    amtCls = t.amount >= 0 ? "in" : "out";
    signStr = fmt(t.amount, { sign: true });
  } else if (t.amount > 0) {
    icoCls = "income";
    amtCls = "in";
    signStr = fmt(t.amount, { sign: true });
  } else {
    amtCls = "out";
    signStr = fmt(t.amount);
  }
  const subParts = [];
  if (isTransfer(t) && toW) {
    subParts.push(t.incoming ? `From ${w ? w.name : t.wallet}` : `${w ? w.name : t.wallet} → ${toW.name}`);
  } else if (w) {
    subParts.push(w.name);
  }
  subParts.push(`<span class="mono-time">${showDate ? dayLabel(d) + " · " : ""}${timeLabel(d)}</span>`);
  return `
  <button class="tx-row" data-action="open-tx" data-id="${esc(t.id)}">
    <div class="tx-ico ${icoCls}">${icon(categoryIconName(t.kind), 18)}</div>
    <div class="tx-main">
      <div class="tx-title">${esc(t.title)}</div>
      <div class="tx-meta">${subParts.join(" · ")}</div>
    </div>
    <div class="tx-right">
      <div class="tx-amt ${amtCls} tabular">${maskAmt(signStr)}</div>
      <div class="tx-kind">${esc(t.kind)}</div>
    </div>
  </button>`;
}

/* ==========================================================================
   SCREEN: WALLETS (ALLOCATION DIAL + MINI CARDS + REORDER)
   ========================================================================== */
function renderAllocationDial(wallets, selectedId) {
  const total = wallets.reduce((s, w) => s + Math.max(0, w.balance), 0);
  const cx = 122, cy = 110, r = 82;
  const startDeg = 135, totalSweep = 270;
  const polar = (deg, rad) => {
    const rads = (deg * Math.PI) / 180;
    return [cx + rad * Math.cos(rads), cy + rad * Math.sin(rads)];
  };
  const arcPath = (a1, a2, rad) => {
    const [x1, y1] = polar(a1, rad);
    const [x2, y2] = polar(a2, rad);
    const large = a2 - a1 > 180 ? 1 : 0;
    return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${rad} ${rad} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  };

  // 37 watch-bezel ticks along 270°
  const ticks = Array.from({ length: 37 }, (_, i) => {
    const a = startDeg + (i / 36) * totalSweep;
    const major = i % 6 === 0;
    const [x1, y1] = polar(a, major ? 95 : 97);
    const [x2, y2] = polar(a, 102);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${major ? "var(--text-3)" : "var(--hairline-strong)"}" stroke-width="${major ? 1.5 : 1}" stroke-linecap="round"/>`;
  }).join("");

  let cur = startDeg;
  const gap = wallets.length > 1 ? 3.5 : 0;
  const usableSweep = totalSweep - gap * wallets.length;
  const segments = wallets.map((w, idx) => {
    const share = total > 0 ? Math.max(0, w.balance) / total : 1 / Math.max(1, wallets.length);
    const segSweep = Math.max(6, share * usableSweep);
    const a1 = cur;
    const a2 = cur + segSweep;
    cur = a2 + gap;
    const isSel = selectedId ? selectedId === w.id : idx === 0;
    const strokeCol = isSel ? "var(--accent)" : (w.brand || "var(--text-3)");
    const op = isSel ? 1 : 0.68;
    return `<path d="${arcPath(a1, a2, r)}" fill="none" stroke="${strokeCol}" stroke-width="${isSel ? 11 : 8}" stroke-linecap="round" opacity="${op}" ${isSel ? 'filter="url(#dialGlow)"' : ""} style="cursor:pointer;transition:all 260ms var(--ease-spring);" data-action="dial-select" data-id="${esc(w.id)}"/>`;
  }).join("");

  const activeW = wallets.find((w) => w.id === selectedId) || null;
  const centerSub = activeW ? activeW.name.toUpperCase() : "COMBINED BALANCE";
  const centerVal = activeW ? maskAmt(fmt(activeW.balance)) : maskAmt(fmt(total));
  const centerShare = activeW && total > 0
    ? `${Math.round((Math.max(0, activeW.balance) / total) * 100)}% OF PORTFOLIO`
    : `${wallets.length} ACTIVE INSTRUMENTS`;

  return `
  <div class="dial-card">
    <div class="dial-svg-wrap">
      <svg width="244" height="196" viewBox="0 0 244 196" aria-label="Wallet allocation dial">
        <defs>
          <filter id="dialGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        ${ticks}
        <path d="${arcPath(startDeg, startDeg + totalSweep, r)}" fill="none" stroke="var(--surface-3)" stroke-width="8" stroke-linecap="round"/>
        ${segments}
      </svg>
      <div class="dial-center">
        <div class="dial-center-sub">${esc(centerSub)}</div>
        <div class="dial-center-val tabular">${centerVal}</div>
        <div class="dial-center-share">${esc(centerShare)}</div>
      </div>
    </div>
    <div class="dial-legend">
      ${wallets.map((w, i) => {
        const isSel = selectedId ? selectedId === w.id : i === 0;
        const pct = total > 0 ? Math.round((Math.max(0, w.balance) / total) * 100) : 0;
        return `<button class="dial-leg-item ${isSel ? "active" : ""}" data-action="dial-select" data-id="${esc(w.id)}">
          <span class="dial-swatch" style="background:${isSel ? "var(--accent)" : esc(w.brand)}"></span>
          <span>${esc(w.name)}</span>
          <span class="mono" style="font-size:10px;color:var(--text-3);">${pct}%</span>
        </button>`;
      }).join("")}
    </div>
  </div>`;
}

/* ==========================================================================
   SCREEN: ACTIVITY & BUDGETS (LUMINOUS CHART + RANKED BARS + LEDGER)
   ========================================================================== */
function renderActivityChart(series, range) {
  const W = 322, H = 136, padL = 6, padR = 6, padT = 14, padB = 20;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const maxVal = Math.max(1000, ...series.map((d) => Math.max(d.in, d.out)));
  const n = series.length;
  const stepX = n > 1 ? innerW / (n - 1) : innerW;
  const xAt = (i) => padL + (n > 1 ? i * stepX : innerW / 2);
  const yAt = (val) => padT + innerH - (val / maxVal) * innerH;

  // Build smooth luminous spending curve points
  const pts = series.map((d, i) => [xAt(i), yAt(d.out)]);
  let linePath = "";
  let areaPath = "";
  if (pts.length > 0) {
    linePath = pts.map(([x, y], i) => (i === 0 ? `M ${x.toFixed(1)} ${y.toFixed(1)}` : `L ${x.toFixed(1)} ${y.toFixed(1)}`)).join(" ");
    areaPath = `${linePath} L ${pts[pts.length - 1][0].toFixed(1)} ${(padT + innerH).toFixed(1)} L ${pts[0][0].toFixed(1)} ${(padT + innerH).toFixed(1)} Z`;
  }

  const colW = range === "month" ? 4.5 : 11;
  const bars = series.map((d, i) => {
    const cx = xAt(i);
    const inH = (d.in / maxVal) * innerH;
    const outH = (d.out / maxVal) * innerH;
    return `
      ${d.in > 0 ? `<rect x="${(cx - colW - 1).toFixed(1)}" y="${(padT + innerH - inH).toFixed(1)}" width="${colW}" height="${Math.max(2, inH).toFixed(1)}" rx="2" fill="var(--in)" opacity="0.65"/>` : ""}
      ${d.out > 0 ? `<rect x="${(cx + 1).toFixed(1)}" y="${(padT + innerH - outH).toFixed(1)}" width="${colW}" height="${Math.max(2, outH).toFixed(1)}" rx="2" fill="var(--out)" opacity="0.52"/>` : ""}
    `;
  }).join("");

  const activeIdx = STATE.scrubIdx !== null && STATE.scrubIdx < n ? STATE.scrubIdx : n - 1;
  const activePt = series[activeIdx];
  const ax = xAt(activeIdx), ay = yAt(activePt ? activePt.out : 0);
  const lbl = range === "month" ? `Nov ${activePt.day}` : activePt.label;

  const axisLabels = range === "month"
    ? [[0, "Nov 1"], [Math.floor((n - 1) / 2), `Nov ${series[Math.floor((n - 1) / 2)].day}`], [n - 1, "Nov 24"]]
    : series.map((d, i) => [i, d.label]);

  return `
  <div class="chart-panel">
    <div class="chart-header">
      <div>
        <div class="mono-label">CASHFLOW &amp; SPEND</div>
      </div>
      <div class="chart-readout" id="chart-readout">
        ${esc(lbl)} · <span style="color:var(--in);">+${fmtCompact(activePt.in)}</span> · <span style="color:var(--out);">−${fmtCompact(activePt.out)}</span>
      </div>
    </div>
    <svg class="chart-svg" id="activity-chart" viewBox="0 0 ${W} ${H}" data-count="${n}" aria-label="Money in vs spending chart">
      <defs>
        <linearGradient id="lumeArea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.24"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
        <filter id="lumeGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <line x1="${padL}" y1="${padT + innerH * 0.5}" x2="${W - padR}" y2="${padT + innerH * 0.5}" stroke="var(--hairline)" stroke-dasharray="3 4"/>
      <line x1="${padL}" y1="${padT + innerH}" x2="${W - padR}" y2="${padT + innerH}" stroke="var(--hairline-strong)"/>
      ${bars}
      <path d="${areaPath}" fill="url(#lumeArea)"/>
      <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" filter="url(#lumeGlow)"/>
      <line x1="${ax.toFixed(1)}" y1="${padT}" x2="${ax.toFixed(1)}" y2="${padT + innerH}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity="0.8"/>
      <circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="4.5" fill="var(--bg)" stroke="var(--accent-hi)" stroke-width="2.2" filter="url(#lumeGlow)"/>
      ${axisLabels.map(([i, txt]) => `<text x="${xAt(i).toFixed(1)}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" fill="var(--text-3)" font-family="var(--font-mono)" font-size="9">${esc(txt)}</text>`).join("")}
    </svg>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
      <div style="display:flex;align-items:center;gap:12px;font-size:11px;color:var(--text-2);">
        <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:2px;background:var(--in);"></span>Money in</span>
        <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:2px;background:var(--out);"></span>Spending</span>
        <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:2px;background:var(--accent);"></span>Spend curve</span>
      </div>
      <span class="mono" style="font-size:10px;color:var(--text-3);">Drag to inspect</span>
    </div>
  </div>`;
}

function renderActivity(focusBudgets = false) {
  const isMonth = STATE.activityRange === "month";
  const series = isMonth ? dailySeries(TODAY) : weekSeries(TODAY);
  const periodIn = isMonth ? monthIncome(TODAY) : series.reduce((s, d) => s + d.in, 0);
  const periodOut = isMonth ? monthSpent(TODAY) : series.reduce((s, d) => s + d.out, 0);
  const net = periodIn - periodOut;

  const budgetPct = Math.round((monthSpent(TODAY) / Math.max(1, MONTHLY_BUDGET)) * 100);
  const ringR = 26, ringC = 2 * Math.PI * ringR;
  const ringDash = ringC * Math.min(1, budgetPct / 100);
  const daysLeft = 30 - TODAY.getDate(); // Nov has 30 days -> 6 days left
  const ringColor = budgetPct >= 100 ? "var(--out)" : budgetPct >= 80 ? "var(--warn)" : "var(--accent)";

  const catSpend = spendingByCategory(TODAY);
  const catMap = Object.fromEntries(catSpend);
  const maxCat = catSpend.length ? catSpend[0][1] : 1;

  // Ledger filtering
  const f = STATE.activityFilter;
  const wf = STATE.activityWalletFilter;
  const q = STATE.activitySearch.trim().toLowerCase();
  const ledgerList = [...TRANSACTIONS]
    .sort((a, b) => new Date(b.at) - new Date(a.at))
    .filter((t) => {
      if (f === "Expenses" && !isExpense(t)) return false;
      if (f === "Income" && !isIncome(t)) return false;
      if (f === "Transfers" && !isTransfer(t)) return false;
      if (f === "Adjusted" && !isAdjust(t)) return false;
      if (wf !== "all" && t.wallet !== wf && t.to !== wf) return false;
      if (q) {
        const wName = walletById(t.wallet)?.name.toLowerCase() || "";
        if (!t.title.toLowerCase().includes(q) && !t.kind.toLowerCase().includes(q) && !wName.includes(q) && !(t.note || "").toLowerCase().includes(q)) return false;
      }
      return true;
    });

  const shownLedger = ledgerList.slice(0, STATE.activityLimit);
  const groups = [];
  shownLedger.forEach((t) => {
    const lbl = dayLabel(txDate(t));
    let g = groups.find((x) => x.lbl === lbl);
    if (!g) { g = { lbl, items: [] }; groups.push(g); }
    g.items.push(t);
  });

  return `
  <div class="app-scroll screen-enter">
    <div class="page-title-row">
      <h1 class="page-title">Activity</h1>
      <button class="stack-mini-btn" style="height:36px;padding:0 12px;font-size:11.5px;gap:6px;" data-action="export-csv" aria-label="Export CSV">
        ${icon("download", 14)} CSV
      </button>
    </div>

    <div class="seg-ctrl cols-2" style="margin-bottom:14px;">
      <button class="seg-btn ${isMonth ? "active" : ""}" data-action="act-range" data-range="month">Month</button>
      <button class="seg-btn ${!isMonth ? "active" : ""}" data-action="act-range" data-range="week">Week</button>
    </div>

    <div class="act-hero">
      <div>
        <div class="mono-label">${isMonth ? "SPENT THIS MONTH" : "SPENT LAST 7 DAYS"}</div>
        <div class="act-hero-val tabular">${maskAmt(fmt(periodOut))}</div>
        <div class="act-hero-sub ${budgetPct >= 80 ? "warn" : ""}">
          ${budgetPct}% of ${maskAmt(fmt(MONTHLY_BUDGET, { cents: false }))} budget · ${daysLeft} days left
        </div>
      </div>
      <button class="ring-btn" data-action="nav" data-route="#/sheet/budget" aria-label="Edit monthly budget">
        <svg width="68" height="68" viewBox="0 0 68 68">
          <circle cx="34" cy="34" r="${ringR}" fill="none" stroke="var(--surface-3)" stroke-width="5"/>
          <circle cx="34" cy="34" r="${ringR}" fill="none" stroke="${ringColor}" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="${ringDash.toFixed(1)} ${ringC.toFixed(1)}" transform="rotate(-90 34 34)"/>
        </svg>
        <span class="ring-pct">${budgetPct}%</span>
      </button>
    </div>

    ${renderActivityChart(series, STATE.activityRange)}

    <div class="trio-row">
      <div class="trio-cell">
        <div class="mono-label">MONEY IN</div>
        <div class="trio-val tabular" style="color:var(--in);">${maskAmt(fmt(periodIn, { sign: true, cents: false }))}</div>
      </div>
      <div class="trio-cell">
        <div class="mono-label">SPENT</div>
        <div class="trio-val tabular" style="color:var(--out);">${maskAmt(fmt(-periodOut, { cents: false }))}</div>
      </div>
      <div class="trio-cell">
        <div class="mono-label">NET FLOW</div>
        <div class="trio-val tabular" style="color:${net >= 0 ? "var(--in)" : "var(--text)"};">${maskAmt(fmt(net, { sign: true, cents: false }))}</div>
      </div>
    </div>

    <div class="section-hd" id="budgets-section">
      <h2 class="section-title">Category budgets</h2>
      <button class="section-link" data-action="nav" data-route="#/sheet/budget">Monthly limit ${icon("chevronRight", 14)}</button>
    </div>
    <div class="panel" style="margin-bottom:20px;${focusBudgets ? "border-color:var(--accent);" : ""}">
      ${Object.entries(CATEGORY_LIMITS).map(([cat, limit]) => {
        const spent = catMap[cat] || 0;
        const pct = Math.round((spent / Math.max(1, limit)) * 100);
        const stCls = pct > 100 ? "over" : pct >= 85 ? "near" : "";
        return `
        <button class="budget-row ${stCls}" data-action="nav" data-route="#/sheet/category-budget/${encodeURIComponent(cat)}">
          <div class="budget-row-top">
            <span class="budget-row-title">
              <span style="color:${stCls === "over" ? "var(--out)" : stCls === "near" ? "var(--warn)" : "var(--accent)"};display:flex;">${icon(categoryIconName(cat), 16)}</span>
              ${esc(cat)}
            </span>
            <span class="budget-row-nums"><strong>${maskAmt(fmt(spent, { cents: false }))}</strong> / ${maskAmt(fmt(limit, { cents: false }))} · ${pct}%</span>
          </div>
          <div class="track"><div class="track-fill ${stCls}" style="width:${Math.min(100, pct)}%;"></div></div>
        </button>`;
      }).join("")}
    </div>

    <div class="section-hd">
      <h2 class="section-title">Categories breakdown</h2>
      <span class="mono-label">NOVEMBER</span>
    </div>
    <div class="panel" style="margin-bottom:20px;">
      ${catSpend.map(([cat, amt]) => {
        const share = Math.round((amt / Math.max(1, monthSpent(TODAY))) * 100);
        const wPct = Math.round((amt / maxCat) * 100);
        return `
        <div class="ranked-row">
          <div class="ranked-top">
            <span style="display:flex;align-items:center;gap:8px;font-weight:500;">
              <span style="color:var(--text-2);display:flex;">${icon(categoryIconName(cat), 15)}</span>
              ${esc(cat)}
              <span class="ranked-pct">${share}%</span>
            </span>
            <span class="tabular" style="font-weight:600;">${maskAmt(fmt(amt))}</span>
          </div>
          <div class="track"><div class="track-fill" style="width:${wPct}%;"></div></div>
        </div>`;
      }).join("")}
    </div>

    <div class="section-hd">
      <h2 class="section-title">Ledger</h2>
      <span class="mono-label">${ledgerList.length} ENTRIES</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 122px;gap:8px;margin-bottom:10px;">
      <div class="input-wrap">
        ${icon("search", 16)}
        <input type="search" id="act-search" value="${esc(STATE.activitySearch)}" placeholder="Search merchant or note" aria-label="Search transactions" />
      </div>
      <div class="input-wrap" style="padding:0 10px;">
        <select id="act-wallet" aria-label="Filter by wallet">
          <option value="all" ${wf === "all" ? "selected" : ""}>All wallets</option>
          ${WALLETS.map((w) => `<option value="${esc(w.id)}" ${wf === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="chips-row" style="margin-bottom:12px;">
      ${["All","Expenses","Income","Transfers","Adjusted"].map((chip) => `
        <button class="chip ${f === chip ? "active" : ""}" data-action="act-filter" data-filter="${chip}">${chip}</button>
      `).join("")}
    </div>

    ${groups.length ? `
      <div class="panel" style="margin-bottom:12px;">
        ${groups.map((g) => `
          <div class="day-group-hd">${esc(g.lbl)}</div>
          ${g.items.map((t) => renderTxRow(t)).join("")}
        `).join("")}
      </div>
      ${ledgerList.length > STATE.activityLimit ? `
        <button class="btn-secondary" data-action="act-more">Load more (${ledgerList.length - STATE.activityLimit} remaining)</button>
      ` : ""}
    ` : `
      <div class="panel panel-pad" style="text-align:center;color:var(--text-2);font-size:13px;">
        No transactions match your current filter.
      </div>
    `}
  </div>
  ${renderDock("activity")}`;
}

function sheetShell(title, bodyHtml, { closeRoute = null, extraHdr = "" } = {}) {
  const backTarget = closeRoute || `#/${STATE.lastBaseRoute || "home"}`;
  return `
  <div class="sheet-overlay open" data-action="sheet-backdrop" data-close="${esc(backTarget)}">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-grab" aria-hidden="true"></div>
      <div class="sheet-hd">
        <div class="sheet-title">${esc(title)}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${extraHdr}
          <button class="icon-btn" style="width:34px;height:34px;min-width:34px;" data-action="close-sheet" data-close="${esc(backTarget)}" aria-label="Close">
            ${icon("close", 17)}
          </button>
        </div>
      </div>
      <div class="sheet-body">${bodyHtml}</div>
    </div>
  </div>`;
}

function formatKeypadNum(str) {
  if (!str || str === "0") return "0";
  const [intPart, decPart] = str.split(".");
  const cleanInt = (intPart || "0").replace(/^0+(?=\d)/, "");
  const withCommas = Number(cleanInt || 0).toLocaleString("en-US");
  return decPart !== undefined ? `${withCommas}.${decPart}` : withCommas;
}

function ensureDraftTx(mode = "expense") {
  if (!STATE.draftTx) {
    STATE.draftTx = {
      direction: mode === "income" ? "income" : "expense",
      amountStr: "0",
      category: mode === "income" ? "Salary" : "Food",
      wallet: WALLETS[0]?.id || "gcash",
      note: "",
      date: "2026-11-24",
      saveFav: false,
    };
  }
  return STATE.draftTx;
}

function renderSheetAddTx(mode = "expense") {
  const d = ensureDraftTx(mode);
  const cats = d.direction === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;

/* ==========================================================================
   ROUTER & RENDER PIPELINE
   ========================================================================== */
let introTimer = null;

function parseRoute() {
  let raw = (window.location.hash || "").replace(/^#\/?/, "");
  const qIdx = raw.indexOf("?");
  const queryStr = qIdx !== -1 ? raw.slice(qIdx + 1) : "";
  const path = (qIdx !== -1 ? raw.slice(0, qIdx) : raw).replace(/\/+$/, "");
  return { path, params: new URLSearchParams(queryStr) };
}

function navTo(hash) {
  STATE.fanOpen = false;
  if (window.location.hash === hash) render();
  else window.location.hash = hash;
}

function render() {
  applyThemeAndParams();
  clearTimeout(introTimer);
  const { path, params } = parseRoute();
  const parts = path ? path.split("/") : [];

  const appEl = document.getElementById("app");
  const sheetEl = document.getElementById("sheet-root");

  // No hash -> intro
  if (!path) {
    window.location.replace("#/intro");
    return;
  }

  let baseHtml = "";
  let sheetHtml = "";

  if (path === "intro") {
    baseHtml = renderIntro();
    introTimer = setTimeout(() => {
      if (parseRoute().path === "intro") navTo("#/lock");
    }, 1500);
  } else if (path === "lock") {
    baseHtml = renderLock();
  } else if (path === "auth") {
    baseHtml = renderAuth();
  } else if (path === "empty") {
    STATE.lastBaseRoute = "empty";
    baseHtml = renderEmpty();
  } else if (path === "wallets") {
    STATE.lastBaseRoute = "wallets";
    baseHtml = renderWallets();
  } else if (parts[0] === "wallet" && parts[1]) {
    STATE.lastBaseRoute = `wallet/${parts[1]}`;
    baseHtml = renderWalletDetail(parts[1]);
  } else if (path === "activity") {
    STATE.lastBaseRoute = "activity";
    baseHtml = renderActivity(false);
  } else if (path === "activity/budgets") {
    STATE.lastBaseRoute = "activity/budgets";
    baseHtml = renderActivity(true);
  } else if (path === "settings") {
    STATE.lastBaseRoute = "settings";
    baseHtml = renderSettings();
  } else if (parts[0] === "sheet") {
    // Determine natural parent screen behind sheet
    const sheetName = parts[1];
    let parent = STATE.lastBaseRoute || "home";
    if (sheetName === "edit-wallet" && parts[2]) parent = `wallet/${parts[2]}`;
    else if (sheetName === "budget" || sheetName === "category-budget") parent = "activity/budgets";
    else if (sheetName === "schedules" || sheetName === "schedule-edit" || sheetName === "profile" || sheetName === "pin") parent = "settings";

    if (parent === "wallets") baseHtml = renderWallets();
    else if (parent.startsWith("wallet/")) baseHtml = renderWalletDetail(parent.split("/")[1]);
    else if (parent === "activity") baseHtml = renderActivity(false);
    else if (parent === "activity/budgets") baseHtml = renderActivity(true);
    else if (parent === "settings") baseHtml = renderSettings();
    else if (parent === "empty") baseHtml = renderEmpty();
    else baseHtml = renderHome();

    if (sheetName === "add-tx") sheetHtml = renderSheetAddTx("expense");
    else if (sheetName === "add-income") sheetHtml = renderSheetAddTx("income");
    else if (sheetName === "transfer") sheetHtml = renderSheetTransfer();
    else if (sheetName === "update") sheetHtml = renderSheetUpdate();
    else if (sheetName === "add-wallet") sheetHtml = renderSheetAddWallet();
    else if (sheetName === "edit-wallet") sheetHtml = renderSheetEditWallet(parts[2]);
    else if (sheetName === "tx") sheetHtml = renderSheetTxDetail(parts[2]);
    else if (sheetName === "edit-tx") sheetHtml = renderSheetEditTx(parts[2]);
    else if (sheetName === "search") sheetHtml = renderSheetSearch();
    else if (sheetName === "schedules") sheetHtml = renderSheetSchedules();
    else if (sheetName === "schedule-edit") sheetHtml = renderSheetScheduleEdit();
    else if (sheetName === "budget") sheetHtml = renderSheetBudget();
    else if (sheetName === "category-budget") sheetHtml = renderSheetCategoryBudget(parts[2]);
    else if (sheetName === "favorite") sheetHtml = renderSheetFavorite();
    else if (sheetName === "profile") sheetHtml = renderSheetProfile();
    else if (sheetName === "pin") sheetHtml = renderSheetPin();
    else if (sheetName === "confirm-delete") sheetHtml = renderSheetConfirmDelete(params);
  } else {
    STATE.lastBaseRoute = "home";
    baseHtml = renderHome();
  }

  appEl.innerHTML = baseHtml;
  sheetEl.innerHTML = sheetHtml;
  bindDynamicInputs();

  if (path === "activity/budgets") {
    const bEl = document.getElementById("budgets-section");
    if (bEl) bEl.scrollIntoView({ block: "start" });
  }
}

   INTERACTIVE HANDLERS, SWIPE STACK, CHART SCRUB, CSV EXPORT
   ========================================================================== */
function exportCsv() {
  const header = ["ID","Title","Category","Wallet","To","Amount","DateTime","Note"];
  const rows = TRANSACTIONS.map((t) => [
    t.id,
    `"${(t.title || "").replace(/"/g, '""')}"`,
    t.kind,
    walletById(t.wallet)?.name || t.wallet,
    t.to ? (walletById(t.to)?.name || t.to) : "",
    t.amount.toFixed(2),
    t.at,
    `"${(t.note || "").replace(/"/g, '""')}"`
  ].join(","));
  const csv = [header.join(","), ...rows].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pitaka-transactions-2026-11.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("Exported CSV ledger");
}

function bindDynamicInputs() {
  // Activity search & wallet filter
  const actSearch = document.getElementById("act-search");
  if (actSearch) {
    actSearch.addEventListener("input", (e) => {
      STATE.activitySearch = e.target.value;
      const caretPos = e.target.selectionStart;
      render();
      const next = document.getElementById("act-search");
      if (next) { next.focus(); next.setSelectionRange(caretPos, caretPos); }
    });
  }
  const actWal = document.getElementById("act-wallet");
  if (actWal) {
    actWal.addEventListener("change", (e) => {
      STATE.activityWalletFilter = e.target.value;
      render();
    });
  }
  // Command search
  const cmdSearch = document.getElementById("cmd-search");
  if (cmdSearch) {
    cmdSearch.addEventListener("input", (e) => {
      STATE.searchQuery = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const next = document.getElementById("cmd-search");
      if (next) { next.focus(); next.setSelectionRange(pos, pos); }
    });
  }
  // Add wallet search
  const awSearch = document.getElementById("aw-search");
  if (awSearch) {
    awSearch.addEventListener("input", (e) => {
      STATE.draftWallet.search = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const next = document.getElementById("aw-search");
      if (next) { next.focus(); next.setSelectionRange(pos, pos); }
    });
  }
  // Monthly budget live slider sync
  const mbRange = document.getElementById("mb-range");
  const mbInput = document.getElementById("mb-input");
  const mbDisp = document.getElementById("mb-val-disp");
  if (mbRange && mbInput && mbDisp) {
    mbRange.addEventListener("input", (e) => {
      mbInput.value = e.target.value;
      mbDisp.textContent = fmt(Number(e.target.value), { cents: false });
    });
    mbInput.addEventListener("input", (e) => {
      const v = Number(e.target.value) || 0;
      mbRange.value = Math.min(80000, Math.max(10000, v));
      mbDisp.textContent = fmt(v, { cents: false });
    });
  }
  // Card stack swipe gesture
  const stack = document.getElementById("card-stack");
  if (stack) {
    let startX = null;
    stack.addEventListener("pointerdown", (e) => { startX = e.clientX; });
    stack.addEventListener("pointerup", (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      startX = null;
      if (Math.abs(dx) > 40 && WALLETS.length > 1) {
        STATE.activeCardIdx = (STATE.activeCardIdx + (dx < 0 ? 1 : -1) + WALLETS.length) % WALLETS.length;
        render();
      }
    });
  }
  // Activity chart scrubbing
  const chart = document.getElementById("activity-chart");
  if (chart) {
    const scrubAt = (clientX) => {
      const rect = chart.getBoundingClientRect();
      const n = Number(chart.dataset.count) || 1;
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const idx = Math.round(ratio * (n - 1));
      if (STATE.scrubIdx !== idx) {
        STATE.scrubIdx = idx;
        render();
      }
    };
    let scrubbing = false;
    chart.addEventListener("pointerdown", (e) => { scrubbing = true; scrubAt(e.clientX); });
    chart.addEventListener("pointermove", (e) => { if (scrubbing) scrubAt(e.clientX); });
    window.addEventListener("pointerup", () => { scrubbing = false; }, { once: true });
    chart.addEventListener("click", (e) => scrubAt(e.clientX));
  }
}

document.addEventListener("click", (e) => {

    STATE.fanOpen = false;
    STATE.draftTx = null;
    STATE.draftTransfer = null;
    STATE.draftUpdate = null;
    navTo(btn.dataset.route);

  }

    STATE.draftTransfer = null;
    STATE.draftUpdate = null;
    STATE.draftWallet = null;
    STATE.draftSchedule = null;
    navTo(btn.dataset.close || `#/${STATE.lastBaseRoute || "home"}`);
    return;

      setTimeout(() => {
        if (STATE.pinEntry === STATE.pinCode) {
          STATE.pinEntry = "";
          navTo("#/home");

          STATE.pinError = true;
          STATE.pinEntry = "";
          render();
        }

    return;

    STATE.pinEntry = STATE.pinEntry.slice(0, -1);

    return;

  }

    STATE.signedIn = true;
    PROFILE.lastSyncedAt = "Just now";

    navTo("#/home");
    return;
  }

  // Home interactions

    STATE.hideBalances = !STATE.hideBalances;

    return;
  }

    STATE.activeCardIdx = (STATE.activeCardIdx + 1) % WALLETS.length;

    return;
  }
  if (act === "stack-prev") {
    STATE.activeCardIdx = (STATE.activeCardIdx - 1 + WALLETS.length) % WALLETS.length;
    render();
    return;
  }
  if (act === "stack-goto") {
    STATE.activeCardIdx = Number(btn.dataset.idx) || 0;
    render();
    return;
  }
  if (act === "stack-card") {

  if (act === "quick-fav") {

      direction: fav.direction,

    const obj = {

    const idx = SCHEDULES.findIndex((x) => x.id === obj.id);

    if (f.entry.length >= 4) return;
    f.entry += k;
    render();
    if (f.entry.length === 4) {
      setTimeout(() => {
        if (f.step === "verify") {
          if (f.entry === STATE.pinCode) { f.step = "new"; f.entry = ""; }
          else { f.error = true; f.entry = ""; }

          f.firstPin = f.entry;
          f.step = "confirm";
          f.entry = "";
          render();

          if (f.entry === f.firstPin) {
            STATE.pinCode = f.entry;
            STATE.pinFlow = { step: "verify", firstPin: "", entry: "", error: false };
            showToast("PIN updated");
            navTo("#/settings");
          } else {
            f.error = true;
            f.entry = "";
            f.step = "new";
            render();
          }
        }
      }, 150);
    }
    return;
  }

  // Confirm delete
  if (act === "confirm-delete") {
    const type = btn.dataset.type;
    const id = btn.dataset.id;
    if (type === "tx") {
      const idx = TRANSACTIONS.findIndex((x) => x.id === id);
      if (idx !== -1) {
        const t = TRANSACTIONS[idx];
        const w = walletById(t.wallet);
        if (w) w.balance = Math.round((w.balance - t.amount) * 100) / 100;
        if (t.to) {
          const tw = walletById(t.to);
          if (tw) tw.balance = Math.round((tw.balance - Math.abs(t.amount)) * 100) / 100;
        }
        TRANSACTIONS.splice(idx, 1);
      }
      showToast("Transaction deleted");
      navTo("#/activity");
    } else if (type === "wallet") {
      const idx = WALLETS.findIndex((w) => w.id === id);
      if (idx !== -1) WALLETS.splice(idx, 1);
      STATE.activeCardIdx = 0;
      showToast("Wallet removed");
      navTo(WALLETS.length ? "#/wallets" : "#/empty");
    } else if (type === "schedule") {
      const idx = SCHEDULES.findIndex((s) => s.id === id);
      if (idx !== -1) SCHEDULES.splice(idx, 1);
      STATE.draftSchedule = null;
      showToast("Schedule deleted");
      navTo("#/sheet/schedules");
    }
    return;
  }
});

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
