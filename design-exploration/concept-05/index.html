        confirmText: "Reset",
        destructive: true,
        onConfirm: () => resetDemoData(),
      };
      render();
    }

    function dismissAlert() {
      state.alert = null;
      if (location.hash === "#/sheet/confirm-delete") navigate("#/home");
      else render();
    }

    function confirmAlertAction() {
      const fn = state.alert?.onConfirm;
      state.alert = null;
      if (fn) fn();
      if (location.hash === "#/sheet/confirm-delete") navigate("#/home");
      else render();
    }

    /* PIN Lock Actions */
    function pressPinDigit(d) {
      if (state.pinInput.length >= 4) return;
      state.pinError = false;
      state.pinInput += d;
      render();
      if (state.pinInput.length === 4) {
        setTimeout(() => {
          if (state.pinInput === state.pin || state.pinTries >= 1) {
            state.pinInput = "";
            state.pinTries = 0;
            navigate("#/home");
          } else {
            state.pinTries += 1;
            state.pinError = true;
            render();
            setTimeout(() => {
              state.pinInput = "";
              state.pinError = false;
              render();
            }, 520);
          }
        }, 140);
      }
    }

    function deletePinDigit() {
      if (!state.pinInput.length) {
        navigate("#/home");
        return;
      }
      state.pinInput = state.pinInput.slice(0, -1);
      render();
    }

    function unlockBiometric() {
      state.pinInput = "1234";
      render();
      showToast("Unlocked with Face ID", "faceid");
      setTimeout(() => { state.pinInput = ""; navigate("#/home"); }, 220);
    }

    /* ========================================================================
       HASH ROUTER
       ======================================================================== */
    let lastBaseScreen = "#/home";
    let swipeOpenCell = null;

    function navigate(hash) {
      state.contextMenu = null;
      if (location.hash !== hash) {
        location.hash = hash;
      } else {
        render();
      }
    }

    function closeSheet() {
      state.txDraft = null;
      state.transferDraft = null;
      state.updateDraft = null;
      state.walletDraft = null;
      state.scheduleDraft = null;
      state.favoriteDraft = null;
      state.profileDraft = null;
      state.budgetInput = null;
      state.catBudgetInput = null;
      navigate(lastBaseScreen || "#/home");
    }

    function parseRoute() {
      const full = (location.hash || "").replace(/^#\/?/, "");
      const raw = full.split("?")[0];
      const parts = raw.split("/").filter(Boolean);
      return { raw, parts };
    }

    function render() {
      applyQueryParams();
      const app = document.getElementById("app");
      const { raw, parts } = parseRoute();

      clearTimeout(state.introTimer);

      if (!raw || raw === "intro") {
        app.innerHTML = renderIntro() + `<div id="toastLayer"></div>`;
        renderToastOverlay();
        state.introTimer = setTimeout(() => {
          if ((location.hash || "").replace(/^#\/?/, "") === "intro" || !location.hash) {
            navigate(state.appLock ? "#/lock" : "#/home");
          }
        }, 1700);
        return;
      }

      if (raw === "lock") {
        app.innerHTML = renderLock() + `<div id="toastLayer"></div>`;
        renderToastOverlay();
        return;
      }

      /* Determine underlying base screen + optional sheet */
      let baseHtml = "";
      let sheetHtml = "";

      if (raw === "empty") {
        lastBaseScreen = "#/empty";
        baseHtml = renderHome(true);
      } else if (raw === "home") {
        lastBaseScreen = "#/home";
        baseHtml = renderHome(false);
      } else if (raw === "wallets") {
        lastBaseScreen = "#/wallets";
        baseHtml = renderWallets();
      } else if (parts[0] === "wallet" && parts[1]) {
        lastBaseScreen = `#/wallet/${parts[1]}`;
        baseHtml = renderWalletDetail(parts[1]);
      } else if (raw === "activity") {
        lastBaseScreen = "#/activity";
        baseHtml = renderActivity();
      } else if (raw === "activity/budgets") {
        lastBaseScreen = "#/activity/budgets";
        baseHtml = renderBudgets();
      } else if (raw === "settings") {
        lastBaseScreen = "#/settings";
        baseHtml = renderSettings();
      } else if (raw === "auth") {
        const parent = lastBaseScreen === "#/settings" ? "#/settings" : "#/settings";
        baseHtml = renderSettings();
        sheetHtml = renderAuthSheet();
      } else if (parts[0] === "sheet") {
        /* Render natural parent underneath */
        const sub = parts[1];
        if (sub === "edit-wallet" && parts[2]) {
          baseHtml = renderWalletDetail(parts[2]);
        } else if (sub === "budget" || sub === "category-budget") {
          baseHtml = renderBudgets();
        } else if (sub === "profile" || sub === "pin") {
          baseHtml = renderSettings();
        } else if (lastBaseScreen === "#/wallets") {
          baseHtml = renderWallets();
        } else if (lastBaseScreen === "#/activity") {
          baseHtml = renderActivity();
        } else if (lastBaseScreen === "#/settings") {
          baseHtml = renderSettings();
        } else {
          baseHtml = renderHome(false);
        }

        if (sub === "add-tx") sheetHtml = renderAddOrEditTxSheet("expense", null);
        else if (sub === "add-income") sheetHtml = renderAddOrEditTxSheet("income", null);
        else if (sub === "edit-tx" && parts[2]) sheetHtml = renderAddOrEditTxSheet("expense", parts[2]);
        else if (sub === "transfer") sheetHtml = renderTransferSheet();
        else if (sub === "update") sheetHtml = renderUpdateBalanceSheet();
        else if (sub === "add-wallet") sheetHtml = renderAddWalletSheet();
        else if (sub === "edit-wallet" && parts[2]) sheetHtml = renderEditWalletSheet(parts[2]);
        else if (sub === "tx" && parts[2]) sheetHtml = renderTxDetailSheet(parts[2]);
        else if (sub === "search") sheetHtml = renderSearchSheet();
        else if (sub === "schedules") sheetHtml = renderSchedulesSheet();
        else if (sub === "schedule-edit") sheetHtml = renderScheduleEditSheet(parts[2] || null);
        else if (sub === "budget") sheetHtml = renderBudgetSheet();
        else if (sub === "category-budget") sheetHtml = renderCategoryBudgetSheet(parts[2]);
        else if (sub === "favorite") sheetHtml = renderFavoriteSheet(parts[2] || null);
        else if (sub === "profile") sheetHtml = renderProfileSheet();
        else if (sub === "pin") sheetHtml = renderPinSheet();
        else if (sub === "confirm-delete") {
          baseHtml = renderHome(false);
          if (!state.alert) {
            state.alert = {
              title: "Delete Transaction?",
              message: `Remove "${TRANSACTIONS[0]?.title || "SM Supermarket"}" (${fmt(TRANSACTIONS[0]?.amount || -1856.35, { sign: true })})?`,
              confirmText: "Delete",
              destructive: true,
              onConfirm: () => showToast("Transaction deleted"),
            };
          }
        }
      } else {
        /* Unknown hash falls back to home */
        lastBaseScreen = "#/home";
        baseHtml = renderHome(false);
      }

      app.innerHTML = baseHtml + sheetHtml + renderContextMenuOverlay() + renderAlertOverlay() + `<div id="toastLayer"></div>`;
      renderToastOverlay();
      attachScrollAndRowHandlers();
    }

    /* ========================================================================
       SCROLL COLLAPSE, SWIPE ACTIONS & LONG-PRESS CONTEXT MENU
       ======================================================================== */
    function handleTxRowClick(event, txId) {
      if (swipeOpenCell) {
        swipeOpenCell.style.transform = "";
        swipeOpenCell = null;
        return;
      }
      navigate(`#/sheet/tx/${txId}`);
    }

    function attachScrollAndRowHandlers() {
      const scroller = document.getElementById("screenScroll");
      const navBar = document.getElementById("navBar");
      if (scroller && navBar) {
        const onScroll = () => {
          if (scroller.scrollTop > 22) navBar.classList.add("scrolled");
          else navBar.classList.remove("scrolled");
        };
        scroller.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
      }

      /* Lift context-active row if open */
      if (state.contextMenu) {
        const activeCell = document.querySelector(`.tx-swipe-cell[data-tx-id="${state.contextMenu.txId}"]`);
        if (activeCell) activeCell.classList.add("context-lifted");
      }

      /* Attach pointer swipe + long-press on transaction rows */
      document.querySelectorAll(".tx-swipe-cell").forEach((cell) => {
        let startX = 0, startY = 0, dragging = false, lpTimer = null;
        cell.addEventListener("pointerdown", (e) => {
          if (e.target.closest("button")) return;
          startX = e.clientX;
          startY = e.clientY;
          dragging = false;
          lpTimer = setTimeout(() => {
            openTxContextMenu(cell.dataset.txId, cell);
          }, 460);
        });
        cell.addEventListener("pointermove", (e) => {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.abs(dx) > 8 || Math.abs(dy) > 8) clearTimeout(lpTimer);
          if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4 && dx < 0) {
            dragging = true;
            const clamp = Math.max(-144, dx);
            cell.style.transform = `translateX(${clamp}px)`;
          }
        });
        const finish = (e) => {
          clearTimeout(lpTimer);
          if (!dragging) return;
          const dx = e.clientX - startX;
          if (dx < -54) {
            if (swipeOpenCell && swipeOpenCell !== cell) swipeOpenCell.style.transform = "";
            cell.style.transform = "translateX(-144px)";
            swipeOpenCell = cell;
          } else {
            cell.style.transform = "";
            if (swipeOpenCell === cell) swipeOpenCell = null;
          }
        };
        cell.addEventListener("pointerup", finish);
        cell.addEventListener("pointercancel", () => clearTimeout(lpTimer));
      });
    }

    /* Keyboard shortcuts */
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (state.alert) dismissAlert();
        else if (state.contextMenu) closeContextMenu();
        else if (location.hash.startsWith("#/sheet/") || location.hash === "#/auth") closeSheet();
      }
    });

    /* Boot */
    applyQueryParams();
    window.addEventListener("hashchange", render);
    if (!location.hash) {
      location.hash = "#/intro";
    } else {
      render();
    }
  </script>
</body>
</html>
