<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="teal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Pitaka Native — My Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ========================================================================
       DESIGN TOKENS — Pitaka Native (Concept 05)
       Directly maps to Expo / React Native StyleSheet theme tokens.
       ======================================================================== */
    :root {
      /* Typography */
      --font-sans: -apple-system, "SF Pro Text", "SF Pro Display", "Inter", system-ui, Roboto, "Segoe UI", sans-serif;
      --font-rounded: ui-rounded, "SF Pro Rounded", -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif;

      /* Type Scale (iOS HIG) */
      --text-large-title: 34px;
      --lh-large-title: 41px;
      --text-hero: 40px;
      --lh-hero: 46px;
      --text-title2: 22px;
      --lh-title2: 28px;
      --text-headline: 17px;
      --lh-headline: 22px;
      --text-body: 17px;
      --lh-body: 22px;
      --text-callout: 16px;
      --lh-callout: 21px;
      --text-subhead: 15px;
      --lh-subhead: 20px;
      --text-footnote: 13px;
      --lh-footnote: 18px;
      --text-caption: 12px;
      --lh-caption: 16px;

      /* Spacing Scale (4/8 grid) */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;

      /* Radii */
      --r-tile: 7px;
      --r-seg: 9px;
      --r-btn: 12px;
      --r-list: 12px;
      --r-sheet: 14px;
      --r-card: 16px;
      --r-pill: 9999px;

      /* Motion */
      --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-std: cubic-bezier(0.2, 0.8, 0.2, 1);
      --dur-fast: 180ms;
      --dur-mid: 280ms;
      --dur-sheet: 380ms;

      /* Light Palette (Primary) */
      --bg-grouped: #F2F2F7;
      --bg-cell: #FFFFFF;
      --bg-cell-pressed: #E5E5EA;
      --bg-elevated: #FFFFFF;
      --bg-bar: rgba(249, 249, 249, 0.94);
      --bg-backdrop: rgba(0, 0, 0, 0.36);
      --bg-desktop: #E8E8EE;

      --fill-primary: rgba(120, 120, 128, 0.16);
      --fill-secondary: rgba(120, 120, 128, 0.12);
      --fill-tertiary: rgba(118, 118, 128, 0.12);

      --separator: rgba(60, 60, 67, 0.18);
      --hairline: rgba(60, 60, 67, 0.22);

      --label: #000000;
      --label-secondary: rgba(60, 60, 67, 0.68);
      --label-tertiary: rgba(60, 60, 67, 0.44);
      --label-quaternary: rgba(60, 60, 67, 0.20);

      /* Accent & Semantic (Light) */
      --tint: #0A8A78;
      --tint-fg: #FFFFFF;
      --tint-soft: rgba(10, 138, 120, 0.12);
      --tint-soft-pressed: rgba(10, 138, 120, 0.20);

      --money-in: #1E9E57;
      --money-in-soft: rgba(30, 158, 87, 0.12);
      --destructive: #FF3B30;
      --destructive-soft: rgba(255, 59, 48, 0.12);
      --warning: #D97706;
      --warning-bar: #FF9F0A;
      --warning-soft: rgba(255, 159, 10, 0.14);

      /* Shadows (only on floating elements) */
      --shadow-pass: 0 6px 18px rgba(0, 0, 0, 0.16), 0 1px 4px rgba(0, 0, 0, 0.10);
      --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, 0.18);
      --shadow-menu: 0 14px 36px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-toast: 0 8px 24px rgba(0, 0, 0, 0.16);
      --shadow-seg: 0 2px 6px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    html[data-theme="dark"] {
      --bg-grouped: #000000;
      --bg-cell: #1C1C1E;
      --bg-cell-pressed: #2C2C2E;
      --bg-elevated: #2C2C2E;
      --bg-bar: rgba(28, 28, 30, 0.94);
      --bg-backdrop: rgba(0, 0, 0, 0.60);
      --bg-desktop: #0C0C0E;

      --fill-primary: rgba(120, 120, 128, 0.30);
      --fill-secondary: rgba(120, 120, 128, 0.24);
      --fill-tertiary: rgba(118, 118, 128, 0.24);

      --separator: rgba(84, 84, 88, 0.60);
      --hairline: rgba(84, 84, 88, 0.65);

      --label: #FFFFFF;
      --label-secondary: rgba(235, 235, 245, 0.68);
      --label-tertiary: rgba(235, 235, 245, 0.44);
      --label-quaternary: rgba(235, 235, 245, 0.20);

      --tint: #2BC4AE;
      --tint-fg: #001B17;
      --tint-soft: rgba(43, 196, 174, 0.18);
      --tint-soft-pressed: rgba(43, 196, 174, 0.28);

      --money-in: #30D158;
      --money-in-soft: rgba(48, 209, 88, 0.16);
      --destructive: #FF453A;
      --destructive-soft: rgba(255, 69, 58, 0.18);
      --warning: #FF9F0A;
      --warning-bar: #FF9F0A;
      --warning-soft: rgba(255, 159, 10, 0.18);

      --shadow-pass: 0 8px 22px rgba(0, 0, 0, 0.45);
      --shadow-sheet: 0 -10px 36px rgba(0, 0, 0, 0.60);
      --shadow-menu: 0 14px 40px rgba(0, 0, 0, 0.65);
      --shadow-toast: 0 8px 24px rgba(0, 0, 0, 0.55);
      --shadow-seg: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    /* Accent Color Overrides */
    html[data-accent="blue"] {
      --tint: #007AFF; --tint-fg: #FFFFFF;
      --tint-soft: rgba(0, 122, 255, 0.12); --tint-soft-pressed: rgba(0, 122, 255, 0.20);
    }
    html[data-theme="dark"][data-accent="blue"] {
      --tint: #0A84FF; --tint-fg: #FFFFFF;
      --tint-soft: rgba(10, 132, 255, 0.18); --tint-soft-pressed: rgba(10, 132, 255, 0.28);
    }
    html[data-accent="indigo"] {
      --tint: #5856D6; --tint-fg: #FFFFFF;
      --tint-soft: rgba(88, 86, 214, 0.12); --tint-soft-pressed: rgba(88, 86, 214, 0.20);
    }
    html[data-theme="dark"][data-accent="indigo"] {
      --tint: #5E5CE6; --tint-fg: #FFFFFF;
      --tint-soft: rgba(94, 92, 230, 0.20); --tint-soft-pressed: rgba(94, 92, 230, 0.30);
    }
    html[data-accent="orange"] {
      --tint: #D97706; --tint-fg: #FFFFFF;
      --tint-soft: rgba(217, 119, 6, 0.13); --tint-soft-pressed: rgba(217, 119, 6, 0.22);
    }
    html[data-theme="dark"][data-accent="orange"] {
      --tint: #FF9F0A; --tint-fg: #000000;
      --tint-soft: rgba(255, 159, 10, 0.18); --tint-soft-pressed: rgba(255, 159, 10, 0.28);
    }
    html[data-accent="pink"] {
      --tint: #E11D48; --tint-fg: #FFFFFF;
      --tint-soft: rgba(225, 29, 72, 0.12); --tint-soft-pressed: rgba(225, 29, 72, 0.20);
    }
    html[data-theme="dark"][data-accent="pink"] {
      --tint: #FF375F; --tint-fg: #FFFFFF;
      --tint-soft: rgba(255, 55, 95, 0.20); --tint-soft-pressed: rgba(255, 55, 95, 0.30);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ========================================================================
       BASE & DESKTOP PHONE SHELL
       ======================================================================== */
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-sans);
      font-size: var(--text-body);
      line-height: var(--lh-body);
      color: var(--label);
      background: var(--bg-grouped);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .tnum { font-variant-numeric: tabular-nums; }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--tint);
      outline-offset: 2px;
    }

    .desktop-stage {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-grouped);
    }

    .desktop-caption { display: none; }

    .phone-frame {
      position: relative;
      width: 100%;
      height: 100dvh;
      background: var(--bg-grouped);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status-bar { display: none; }

    @media (min-width: 501px) {
      body {
        background: var(--bg-desktop);
        overflow: hidden;
      }
      .desktop-stage {
        background: radial-gradient(circle at 50% 25%, rgba(10, 138, 120, 0.07), transparent 60%), var(--bg-desktop);
        padding: 18px 24px;
        gap: 12px;
      }
      .phone-frame {
        width: 390px;
        height: min(844px, calc(100dvh - 64px));
        border-radius: 46px;
        box-shadow:
          0 0 0 9px #1C1C1E,
          0 0 0 11px rgba(255, 255, 255, 0.14),
          0 28px 70px rgba(0, 0, 0, 0.28);
      }
      html[data-theme="dark"] .phone-frame {
        box-shadow:
          0 0 0 9px #262629,
          0 0 0 11px rgba(255, 255, 255, 0.08),
          0 28px 80px rgba(0, 0, 0, 0.72);
      }
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 44px;
        padding: 12px 26px 0;
        flex-shrink: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.2px;
        color: var(--label);
        background: var(--bg-grouped);
        z-index: 20;
        position: relative;
        user-select: none;
      }
      .status-bar .dynamic-island {
        position: absolute;
        left: 50%;
        top: 10px;
        transform: translateX(-50%);
        width: 112px;
        height: 30px;
        border-radius: 20px;
        background: #000000;
        pointer-events: none;
      }
      .status-icons {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .desktop-caption {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--label-secondary);
      }
      .desktop-caption a {
        color: var(--tint);
        text-decoration: none;
        font-weight: 600;
      }
      .desktop-caption a:hover { text-decoration: underline; }
    }

    /* ========================================================================
       APP SHELL: NAVIGATION, SCROLL CONTAINER, TAB BAR
       ======================================================================== */
    .app-shell {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg-grouped);
      overflow: hidden;
    }

    /* Top Nav Bar (collapsing title bar) */
    .nav-bar {
      height: 44px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 15;
      flex-shrink: 0;
      background: var(--bg-grouped);
      border-bottom: 0.5px solid transparent;
      transition: background var(--dur-fast) ease, border-color var(--dur-fast) ease;
    }
    .nav-bar.scrolled {
      background: var(--bg-bar);
      border-bottom-color: var(--hairline);
    }
    .nav-bar-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--label);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-fast) ease;
      white-space: nowrap;
      max-width: 56%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-bar.scrolled .nav-bar-center,
    .nav-bar.always-title .nav-bar-center {
      opacity: 1;
    }
    .nav-btn {
      min-width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 17px;
      color: var(--tint);
      font-weight: 400;
    }
    .nav-btn.bold { font-weight: 600; }
    .nav-btn.right { justify-content: flex-end; }
    .nav-btn:active { opacity: 0.55; }
    .nav-btn-pill {
      width: 34px;
      height: 34px;
      border-radius: var(--r-pill);
      background: var(--fill-secondary);
      color: var(--label);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--dur-fast) var(--ease-std), background var(--dur-fast);
    }
    .nav-btn-pill:active { transform: scale(0.94); }

    /* Home Custom Header */
    .home-header {
      height: 52px;
      padding: 4px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--bg-grouped);
      border-bottom: 0.5px solid transparent;
      transition: background var(--dur-fast), border-color var(--dur-fast);
      z-index: 15;
    }
    .home-header.scrolled {
      background: var(--bg-bar);
      border-bottom-color: var(--hairline);
    }
    .home-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--r-pill);
      background: var(--tint);
      color: var(--tint-fg);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--dur-fast) var(--ease-std);
    }
    .avatar-btn:active { transform: scale(0.94); }

    /* Scroll Viewport */
    .screen-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 24px;
    }
    .screen-scroll::-webkit-scrollbar { display: none; }

    .screen-enter {
      animation: screenFade var(--dur-mid) var(--ease-std);
    }
    .screen-push {
      animation: screenPush var(--dur-mid) var(--ease-spring);
    }
    @keyframes screenFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes screenPush {
      from { opacity: 0.6; transform: translateX(28px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Large Title */
    .large-title-wrap {
      padding: 4px 16px 10px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .large-title {
      margin: 0;
      font-size: var(--text-large-title);
      line-height: var(--lh-large-title);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--label);
    }

    /* Standard Tab Bar */
    .tab-bar {
      flex-shrink: 0;
      background: var(--bg-bar);
      border-top: 0.5px solid var(--hairline);
      padding: 4px 6px calc(6px + env(safe-area-inset-bottom, 12px));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 16;
    }
    @media (min-width: 501px) {
      .tab-bar { padding-bottom: 18px; }
    }
    .tab-item {
      height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--label-secondary);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1px;
      transition: color var(--dur-fast), transform var(--dur-fast) var(--ease-std);
    }
    .tab-item.active {
      color: var(--tint);
      font-weight: 600;
    }
    .tab-item:active { transform: scale(0.93); }
    .tab-add-btn {
      width: 44px;
      height: 44px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-add-circle {
      width: 38px;
      height: 38px;
      border-radius: var(--r-pill);
      background: var(--tint);
      color: var(--tint-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(10, 138, 120, 0.28);
      transition: transform var(--dur-fast) var(--ease-std), opacity var(--dur-fast);
    }
    .tab-add-btn:active .tab-add-circle { transform: scale(0.92); }

    /* Home Indicator bar in desktop frame */
    .home-indicator {
      display: none;
    }
    @media (min-width: 501px) {
      .home-indicator {
        display: block;
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        border-radius: 99px;
        background: var(--label);
        opacity: 0.22;
        pointer-events: none;
        z-index: 90;
      }
    }

    /* ========================================================================
       SHARED COMPONENTS: SECTION HEADERS, INSET GROUPED LISTS, ROWS, BUTTONS
       ======================================================================== */
    .section {
      margin-top: 20px;
    }
    .section-tight { margin-top: 14px; }
    .section-header {
      padding: 0 20px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.35px;
      color: var(--label-secondary);
      margin: 0;
    }
    .section-title-headline {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.35px;
      color: var(--label);
      margin: 0;
    }
    .section-action {
      font-size: 15px;
      font-weight: 500;
      color: var(--tint);
      min-height: 28px;
      padding: 0 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .section-action:active { opacity: 0.55; }
    .section-footer {
      padding: 6px 20px 0;
      font-size: 13px;
      line-height: 17px;
      color: var(--label-secondary);
    }

    /* Inset Grouped List */
    .grouped-list {
      margin: 0 16px;
      background: var(--bg-cell);
      border-radius: var(--r-list);
      overflow: hidden;
    }
    .row-wrap {
      position: relative;
      overflow: hidden;
      background: var(--bg-cell);
    }
    .row-actions-behind {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: stretch;
      z-index: 1;
    }
    .swipe-action {
      width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 600;
    }
    .swipe-action.fav { background: var(--tint); color: var(--tint-fg); }
    .swipe-action.del { background: var(--destructive); }

    .cell {
      position: relative;
      z-index: 2;
      min-height: 52px;
      padding: 10px 12px 10px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      background: var(--bg-cell);
      width: 100%;
      text-align: left;
      transition: background var(--dur-fast) ease, transform 220ms var(--ease-spring);
    }
    .cell.compact { min-height: 44px; padding: 9px 12px 9px 14px; }
    .cell.clickable { cursor: pointer; }
    .cell.clickable:active { background: var(--bg-cell-pressed); }
    .cell.context-lifted {
      transform: scale(1.02) !important;
      border-radius: 12px;
      box-shadow: var(--shadow-menu);
      z-index: 65;
    }

    /* Inset separator starting after leading icon */
    .row-wrap:not(:last-child)::after,
    .cell-sep:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 55px;
      right: 0;
      bottom: 0;
      height: 0.5px;
      background: var(--separator);
      z-index: 3;
      pointer-events: none;
    }
    .cell-sep-plain:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 0;
      bottom: 0;
      height: 0.5px;
      background: var(--separator);
      z-index: 3;
      pointer-events: none;
    }

    .cell-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cell-title {
      font-size: 16px;
      line-height: 20px;
      font-weight: 500;
      color: var(--label);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell-sub {
      font-size: 13px;
      line-height: 17px;
      color: var(--label-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell-trailing {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .cell-amount {
      font-size: 16px;
      line-height: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--label);
    }
    .cell-amount.in { color: var(--money-in); }
    .cell-amount.adj { color: var(--label-secondary); }
    .cell-value {
      font-size: 15px;
      color: var(--label-secondary);
      font-variant-numeric: tabular-nums;
    }
    .chevron {
      color: var(--label-tertiary);
      flex-shrink: 0;
      display: inline-flex;
    }

    /* 29px iOS Settings-style category icon tile */
    .cat-tile {
      width: 29px;
      height: 29px;
      border-radius: var(--r-tile);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }
    .cat-tile.lg {
      width: 38px;
      height: 38px;
      border-radius: 10px;
    }
    .wallet-logo-img {
      width: 29px;
      height: 29px;
      border-radius: var(--r-tile);
      object-fit: cover;
      flex-shrink: 0;
      display: block;
    }
    .wallet-logo-img.lg {
      width: 36px;
      height: 36px;
      border-radius: 9px;
    }
    .wallet-logo-fallback {
      width: 29px;
      height: 29px;
      border-radius: var(--r-tile);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Buttons (12px radius, filled / tinted / gray) */
    .btn {
      min-height: 46px;
      padding: 0 18px;
      border-radius: var(--r-btn);
      font-size: 16px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform var(--dur-fast) var(--ease-std), opacity var(--dur-fast), background var(--dur-fast);
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.38; pointer-events: none; }
    .btn-block { width: 100%; }
    .btn-filled { background: var(--tint); color: var(--tint-fg); }
    .btn-tinted { background: var(--tint-soft); color: var(--tint); }
    .btn-tinted:active { background: var(--tint-soft-pressed); }
    .btn-gray { background: var(--fill-secondary); color: var(--label); }
    .btn-destructive { background: var(--destructive-soft); color: var(--destructive); }
    .btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }

    /* Segmented Control (iOS style with sliding thumb) */
    .segmented {
      position: relative;
      display: grid;
      background: var(--fill-tertiary);
      border-radius: var(--r-seg);
      padding: 2px;
      user-select: none;
    }
    .seg-thumb {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 2px;
      border-radius: 7px;
      background: var(--bg-cell);
      box-shadow: var(--shadow-seg);
      transition: transform 240ms var(--ease-spring), width 240ms var(--ease-spring);
      pointer-events: none;
    }
    html[data-theme="dark"] .seg-thumb {
      background: #3A3A3C;
    }
    .seg-btn {
      position: relative;
      z-index: 1;
      height: 30px;
      font-size: 13px;
      font-weight: 500;
      color: var(--label);
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      padding: 0 6px;
    }
    .seg-btn.active { font-weight: 600; }

    /* iOS Switch Toggle */
    .ios-switch {
      width: 51px;
      height: 31px;
      border-radius: 99px;
      background: var(--fill-primary);
      padding: 2px;
      position: relative;
      flex-shrink: 0;
      transition: background 220ms var(--ease-std);
    }
    .ios-switch.on { background: var(--tint); }
    .ios-switch-knob {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.22);
      transition: transform 240ms var(--ease-spring);
    }
    .ios-switch.on .ios-switch-knob { transform: translateX(20px); }

    /* ========================================================================
       HOME SCREEN: HERO, QUICK ACTIONS, WALLET PASSES STACK, 2x2 WIDGETS, FAVORITES
       ======================================================================== */
    .hero-balance {
      padding: 6px 16px 2px;
    }
    .hero-label-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hero-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--label-secondary);
    }
    .eye-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--r-pill);
      color: var(--label-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--fill-secondary);
    }
    .eye-btn:active { transform: scale(0.92); }
    .hero-amount {
      margin: 2px 0 4px;
      font-family: var(--font-rounded);
      font-size: var(--text-hero);
      line-height: var(--lh-hero);
      font-weight: 600;
      letter-spacing: -0.9px;
      font-variant-numeric: tabular-nums;
      color: var(--label);
    }
    .hero-cents {
      font-size: 26px;
      font-weight: 600;
      color: var(--label-secondary);
    }
    .hero-flow {
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      color: var(--label-secondary);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hero-flow .in { color: var(--money-in); font-weight: 600; }
    .hero-flow .out { color: var(--label); font-weight: 600; }

    /* 4 Quick Actions (Tinted circular buttons) */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px 16px 2px;
    }
    .qa-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-height: 44px;
    }
    .qa-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--tint-soft);
      color: var(--tint);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--dur-fast) var(--ease-std), background var(--dur-fast);
    }
    .qa-btn:active .qa-circle {
      transform: scale(0.92);
      background: var(--tint-soft-pressed);
    }
    .qa-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--label);
    }

    /* Apple Wallet Passes Stack */
    .passes-stack {
      margin: 0 16px;
      position: relative;
      transition: height 340ms var(--ease-spring);
    }
    .wallet-pass {
      width: 100%;
      border-radius: var(--r-card);
      padding: 13px 16px 15px;
      color: #FFFFFF;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-pass);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      transition: transform 340ms var(--ease-spring), top 340ms var(--ease-spring), box-shadow var(--dur-fast);
      cursor: pointer;
    }
    .wallet-pass::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 52%, rgba(0,0,0,0.20) 100%);
      pointer-events: none;
    }
    .passes-stack.stacked .wallet-pass {
      position: absolute;
      left: 0;
      right: 0;
      height: 142px;
    }
    .passes-stack.fanned {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .passes-stack.fanned .wallet-pass {
      height: 136px;
    }
    .wallet-pass:active { transform: scale(0.985); }
    .pass-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .pass-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .pass-logo {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.16);
      flex-shrink: 0;
    }
    .pass-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pass-type-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(255,255,255,0.20);
      color: #FFFFFF;
      white-space: nowrap;
    }
    .pass-top-bal {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      opacity: 0.95;
      white-space: nowrap;
    }
    .pass-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
    }
    .pass-account {
      font-size: 12px;
      opacity: 0.85;
      font-weight: 500;
    }
    .pass-number {
      font-size: 12px;
      opacity: 0.78;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }
    .pass-balance {
      font-family: var(--font-rounded);
      font-size: 26px;
      line-height: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    /* 2x2 iOS Widgets Grid */
    .widgets-grid {
      margin: 0 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .widget-card {
      background: var(--bg-cell);
      border-radius: var(--r-card);
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 112px;
      text-align: left;
      transition: background var(--dur-fast), transform var(--dur-fast) var(--ease-std);
    }
    .widget-card:active {
      transform: scale(0.975);
      background: var(--bg-cell-pressed);
    }
    .widget-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .widget-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--label-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .widget-body {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
      margin-top: 8px;
    }
    .widget-val {
      font-family: var(--font-rounded);
      font-size: 21px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      font-variant-numeric: tabular-nums;
      color: var(--label);
    }
    .widget-val.in { color: var(--money-in); }
    .widget-val.warn { color: var(--warning); }
    .widget-sub {
      margin-top: 4px;
      font-size: 12px;
      line-height: 15px;
      color: var(--label-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .widget-sub .warn-txt { color: var(--warning); font-weight: 600; }

    /* Favorites Horizontal Pills */
    .fav-rail {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 16px 4px;
      scrollbar-width: none;
    }
    .fav-rail::-webkit-scrollbar { display: none; }
    .fav-pill {
      flex-shrink: 0;
      height: 40px;
      padding: 0 12px 0 8px;
      border-radius: var(--r-pill);
      background: var(--bg-cell);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--label);
      transition: transform var(--dur-fast) var(--ease-std), background var(--dur-fast);
    }
    .fav-pill:active {
      transform: scale(0.96);
      background: var(--bg-cell-pressed);
    }
    .fav-pill-amt {
      font-weight: 600;
      color: var(--tint);
      font-variant-numeric: tabular-nums;
    }

    /* ========================================================================
       WALLETS TAB & WALLET DETAIL
       ======================================================================== */
    .wallets-summary-card {
      margin: 4px 16px 14px;
      padding: 14px 16px;
      background: var(--bg-cell);
      border-radius: var(--r-list);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wallets-edit-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .edit-minus-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--destructive);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .reorder-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      color: var(--label-tertiary);
    }
    .reorder-btn {
      width: 28px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--label-secondary);
      border-radius: 6px;
    }
    .reorder-btn:active { background: var(--fill-secondary); }
    .reorder-btn:disabled { opacity: 0.25; }

    .detail-actions {
      margin: 14px 16px 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    /* ========================================================================
       ACTIVITY & CHARTS & BUDGETS
       ======================================================================== */
    .chart-card {
      margin: 12px 16px 0;
      background: var(--bg-cell);
      border-radius: var(--r-card);
      padding: 16px;
    }
    .chart-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chart-hero-num {
      font-family: var(--font-rounded);
      font-size: 28px;
      line-height: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }
    .chart-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--label-secondary);
      font-weight: 500;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
    .chart-callout {
      min-height: 22px;
      margin-bottom: 6px;
      padding: 3px 10px;
      border-radius: 8px;
      background: var(--fill-secondary);
      font-size: 12px;
      font-weight: 500;
      color: var(--label);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }
    .chart-flow-row {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 0.5px solid var(--separator);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .flow-stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--label-secondary);
    }
    .flow-stat-val {
      font-size: 15px;
      font-weight: 600;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* Progress Bars */
    .progress-track {
      height: 7px;
      border-radius: 99px;
      background: var(--fill-secondary);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--tint);
      transition: width 360ms var(--ease-spring);
    }
    .progress-fill.warn { background: var(--warning-bar); }
    .progress-fill.over { background: var(--destructive); }

    /* Stacked Category Bar */
    .cat-stacked-bar {
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      gap: 2px;
      background: var(--fill-secondary);
      margin: 8px 0 12px;
    }
    .cat-stacked-seg { height: 100%; }

    /* iOS Search Bar */
    .ios-search-row {
      margin: 0 16px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ios-search-field {
      flex: 1;
      height: 38px;
      border-radius: 10px;
      background: var(--fill-tertiary);
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--label-secondary);
    }
    .ios-search-field input {
      flex: 1;
      border: 0;
      background: transparent;
      font-size: 16px;
      color: var(--label);
      outline: none;
      min-width: 0;
    }
    .ios-search-field input::placeholder { color: var(--label-tertiary); }
    .filter-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 16px 10px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .filter-chip {
      height: 32px;
      padding: 0 12px;
      border-radius: var(--r-pill);
      background: var(--bg-cell);
      font-size: 13px;
      font-weight: 500;
      color: var(--label-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-chip.active {
      background: var(--tint);
      color: var(--tint-fg);
      font-weight: 600;
    }
    .day-group-label {
      padding: 12px 20px 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--label-secondary);
      display: flex;
      justify-content: space-between;
    }

    /* ========================================================================
       SETTINGS PROFILE & ACCENT PICKER
       ======================================================================== */
    .profile-avatar-lg {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--tint);
      color: var(--tint-fg);
      font-size: 21px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .accent-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .accent-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 0;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--dur-fast);
    }
    .accent-dot.active {
      box-shadow: 0 0 0 2px var(--bg-cell), 0 0 0 4px var(--tint);
    }
    .accent-dot:active { transform: scale(0.9); }

    .date-pill-wrap {
      position: relative;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
    }
    .date-pill-display {
      padding: 5px 11px;
      border-radius: 8px;
      background: var(--fill-secondary);
      color: var(--tint);
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
    }
    .date-pill-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .peso-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      min-width: 0;
    }
    .peso-input-wrap .cell-input {
      flex: 0 0 auto;
      width: auto;
      min-width: 68px;
      max-width: 150px;
      text-align: right;
    }
    .peso-prefix {
      font-size: 19px;
      font-weight: 700;
      color: var(--label-secondary);
    }

    /* ========================================================================
       SHEETS (DETENTS), KEYPAD, CONTEXT MENU, ALERTS, TOAST
       ======================================================================== */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: var(--bg-backdrop);
      z-index: 40;
      animation: fadeIn 220ms ease;
    }
    .sheet-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 41;
      background: var(--bg-grouped);
      border-radius: var(--r-sheet) var(--r-sheet) 0 0;
      box-shadow: var(--shadow-sheet);
      display: flex;
      flex-direction: column;
      max-height: 92%;
      overflow: hidden;
      animation: sheetUp var(--dur-sheet) var(--ease-spring);
    }
    .sheet-panel.tall { height: 90%; }
    .sheet-panel.medium { height: auto; max-height: 78%; }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .sheet-grabber-wrap {
      padding: 7px 0 2px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .sheet-grabber {
      width: 36px;
      height: 5px;
      border-radius: 99px;
      background: var(--label-quaternary);
    }
    .sheet-nav {
      height: 44px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid var(--hairline);
      flex-shrink: 0;
      position: relative;
    }
    .sheet-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 17px;
      font-weight: 600;
      color: var(--label);
      white-space: nowrap;
    }
    .sheet-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 0 calc(20px + env(safe-area-inset-bottom, 12px));
      -webkit-overflow-scrolling: touch;
    }
    .sheet-body::-webkit-scrollbar { display: none; }

    /* Custom iOS Keypad & Amount Display */
    .amount-stage {
      padding: 8px 16px 12px;
      text-align: center;
    }
    .amount-display {
      font-family: var(--font-rounded);
      font-size: 42px;
      line-height: 48px;
      font-weight: 700;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      color: var(--label);
    }
    .amount-display.in { color: var(--money-in); }
    .amount-display.empty { color: var(--label-tertiary); }

    .ios-keypad {
      margin: 12px 16px 0;
      background: var(--fill-secondary);
      border-radius: 14px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .key-btn {
      height: 46px;
      border-radius: 9px;
      background: var(--bg-cell);
      box-shadow: 0 1px 0 rgba(0,0,0,0.12);
      font-size: 21px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--label);
      display: flex;
      align-items: center;
      justify-content: center;

  const abs = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  return `${v < 0 ? "−" : sign && v > 0 ? "+" : ""}₱${abs}`;
};
const fmtCompact = (v) => Math.abs(v) >= 1000 ? `₱${(v / 1000).toFixed(Math.abs(v) >= 10000 ? 1 : 1).replace(/\.0$/, "")}K` : `₱${Math.round(v)}`;
const splitMoney = (v) => { const [w, c] = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).split("."); return { whole: w, cents: c }; };

const isIncome = (t) => t.amount > 0 && !isTransfer(t) && !isAdjust(t);
const txDate = (t) => new Date(t.at);

const monthIncome = (ref = TODAY) => monthTx(ref).filter(isIncome).reduce((s, t) => s + t.amount, 0);

    function applyQueryParams() {
      const hashQuery = (location.hash.split("?")[1] || "");
      const qs = new URLSearchParams(window.location.search || (hashQuery ? "?" + hashQuery : ""));
      const hashQs = new URLSearchParams(hashQuery);
      const t = hashQs.get("theme") || qs.get("theme");
      if (t === "dark" || t === "light") state.theme = t;
      if (hashQs.get("hidden") === "1" || qs.get("hidden") === "1") state.hideBalances = true;
      document.documentElement.setAttribute("data-theme", state.theme);
      document.documentElement.setAttribute("data-accent", state.accent);
    }

    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      render();
    }

    function setAccent(accent) {
      state.accent = accent;
      document.documentElement.setAttribute("data-accent", accent);
      render();
    }

      return `

    function renderSegmented(name, options, activeVal, onClickFn) {
      const idx = Math.max(0, options.findIndex((o) => o.value === activeVal));
      const pct = 100 / options.length;
      const thumbStyle = `width:calc(${pct}% - 4px);transform:translateX(calc(${idx * 100}% + ${idx * 4}px))`;
      return `
        <div class="segmented" style="grid-template-columns:repeat(${options.length},1fr);" role="tablist" aria-label="${esc(name)}">
          <div class="seg-thumb" style="${thumbStyle}"></div>
          ${options.map((o) => `
            <button class="seg-btn ${o.value === activeVal ? "active" : ""}" role="tab" aria-selected="${o.value === activeVal}" onclick="${onClickFn}('${esc(o.value)}')">${esc(o.label)}</button>
          `).join("")}
        </div>`;
    }

    function shadeColor(hex, pct) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!m) return hex;
      const clamp = (n) => Math.max(0, Math.min(255, n));
      const f = (h) => clamp(Math.round(parseInt(h, 16) + (pct / 100) * 255));
      return `rgb(${f(m[1])}, ${f(m[2])}, ${f(m[3])})`;
    }

    function renderWalletPass(w, { style = "", compactTop = false, onClick = "" } = {}) {
      const logoUri = LOGOS[w.logo] || LOGOS[presetKeyForName(w.name)];
      const logoEl = logoUri
        ? `<img class="pass-logo" src="${logoUri}" alt="" />`
        : `<span class="pass-logo" style="display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;">${esc(w.mark)}</span>`;
      const grad = `background: linear-gradient(155deg, ${w.brand} 0%, ${shadeColor(w.brand, -22)} 100%)`;
      return `
        <button class="wallet-pass" style="${grad};${style}" onclick="${onClick}">
          <div class="pass-top">
            <div class="pass-brand">
              ${logoEl}
              <span class="pass-name">${esc(w.name)}</span>
              <span class="pass-type-pill">${esc(w.type)}</span>
            </div>
            ${compactTop ? `<span class="pass-top-bal tnum">${fmtHidden(w.balance)}</span>` : ""}
          </div>
          <div class="pass-bottom">
            <div>
              <div class="pass-account">${esc(w.account)}</div>
              <div class="pass-number">${esc(w.number || "Tracked")}</div>
            </div>
            <div class="pass-balance tnum">${fmtHidden(w.balance)}</div>
          </div>
        </button>`;
    }

    function renderTxRow(t, { showDate = false } = {}) {
      const w = walletById(t.wallet);
      const toW = t.to ? walletById(t.to) : null;
      const d = txDate(t);
      const isInc = t.amount > 0 && !isAdjust(t);
      const isAdj = isAdjust(t);
      const amtClass = isAdj ? "adj" : isInc ? "in" : "";
      const amtText = state.hideBalances
        ? "₱ •••••"
        : isTransfer(t) && !t.incoming
          ? `−₱${Math.abs(t.amount).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
          : fmt(t.amount, { sign: true });
      const subParts = [];
      if (isTransfer(t) && toW && !t.incoming) subParts.push(`${w ? w.name : t.wallet} → ${toW.name}`);
      else if (t.incoming && w) subParts.push(`From ${w.name}`);
      else subParts.push(w ? w.name : t.wallet);
      subParts.push(showDate ? `${dayLabel(d)} · ${timeLabel(d)}` : timeLabel(d));
      if (t.note) subParts.push(t.note);

      return `
        <div class="row-wrap" data-tx-id="${esc(t.id)}">
          <div class="row-actions-behind">
            <button class="swipe-action fav" onclick="event.stopPropagation();saveTxAsFavorite('${esc(t.id)}')" aria-label="Favorite ${esc(t.title)}">
              ${svgIcon("star", { size: 17 })}
              <span>Favorite</span>
            </button>
            <button class="swipe-action del" onclick="event.stopPropagation();confirmDeleteTx('${esc(t.id)}')" aria-label="Delete ${esc(t.title)}">
              ${svgIcon("trash", { size: 17 })}
              <span>Delete</span>
            </button>
          </div>

    function renderBudgetRing(pct, warn, over) {
      const r = 17;
      const c = 2 * Math.PI * r;
      const clamped = Math.max(0, Math.min(100, pct));
      const offset = c - (clamped / 100) * c;
      const stroke = over ? "var(--destructive)" : warn ? "var(--warning-bar)" : "var(--tint)";
      return `
        <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--fill-secondary)" stroke-width="4.5"/>
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="${stroke}" stroke-width="4.5" stroke-linecap="round"
            stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 21 21)"/>
          <text x="21" y="24.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--label)" class="tnum">${Math.round(pct)}%</text>
        </svg>`;
    }

    function renderActivity() {
      const isMonth = state.activityRange === "Month";
      const series = isMonth ? buildSixDayBuckets() : weekSeries();
      const periodIn = isMonth ? monthIncome() : series.reduce((s, d) => s + d.in, 0);
      const periodOut = isMonth ? monthSpent() : series.reduce((s, d) => s + d.out, 0);
      const periodNet = periodIn - periodOut;

      const maxVal = Math.max(1000, ...series.flatMap((d) => [d.in, d.out]));
      const inspected = state.chartInspectIdx !== null ? series[state.chartInspectIdx] : null;

      /* SVG paired bar chart (clean Apple Health style) */
      const W = 326, H = 136, base = 112;
      const groupW = W / series.length;
      const barW = Math.min(14, Math.floor((groupW - 12) / 2));
      const barsSvg = `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="136" role="img" aria-label="Money in versus spending bar chart">
          <line x1="0" y1="16" x2="${W}" y2="16" stroke="var(--separator)" stroke-dasharray="3 3" stroke-width="0.8"/>
          <line x1="0" y1="64" x2="${W}" y2="64" stroke="var(--separator)" stroke-dasharray="3 3" stroke-width="0.8"/>
          <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--separator)" stroke-width="1"/>
          <text x="2" y="13" font-size="10" fill="var(--label-tertiary)" class="tnum">${fmtCompact(maxVal)}</text>
          <text x="2" y="61" font-size="10" fill="var(--label-tertiary)" class="tnum">${fmtCompact(maxVal / 2)}</text>
          ${series.map((d, i) => {
            const cx = i * groupW + groupW / 2;
            const hIn = d.in > 0 ? Math.max(4, (d.in / maxVal) * (base - 18)) : 0;
            const hOut = d.out > 0 ? Math.max(4, (d.out / maxVal) * (base - 18)) : 0;
            const sel = state.chartInspectIdx === i;
            return `
              <g style="cursor:pointer;" onclick="inspectChartBar(${i})">
                <rect x="${(cx - groupW / 2 + 2).toFixed(1)}" y="8" width="${(groupW - 4).toFixed(1)}" height="${base}" rx="6" fill="${sel ? "var(--fill-secondary)" : "transparent"}"/>
                ${hIn > 0 ? `<rect x="${(cx - barW - 1.5).toFixed(1)}" y="${(base - hIn).toFixed(1)}" width="${barW}" height="${hIn.toFixed(1)}" rx="3" fill="var(--money-in)"/>` : `<rect x="${(cx - barW - 1.5).toFixed(1)}" y="${(base - 1.5).toFixed(1)}" width="${barW}" height="1.5" rx="0.75" fill="var(--separator)"/>`}
                ${hOut > 0 ? `<rect x="${(cx + 1.5).toFixed(1)}" y="${(base - hOut).toFixed(1)}" width="${barW}" height="${hOut.toFixed(1)}" rx="3" fill="var(--tint)"/>` : `<rect x="${(cx + 1.5).toFixed(1)}" y="${(base - 1.5).toFixed(1)}" width="${barW}" height="1.5" rx="0.75" fill="var(--separator)"/>`}
                <text x="${cx.toFixed(1)}" y="129" text-anchor="middle" font-size="10.5" font-weight="${sel ? "700" : "500"}" fill="${sel ? "var(--label)" : "var(--label-secondary)"}">${esc(d.label)}</text>
              </g>`;
          }).join("")}
        </svg>`;

      const cats = spendingByCategory();
      const totalCatSpend = cats.reduce((s, [, v]) => s + v, 0) || 1;
      const budgetPct = state.monthlyBudget > 0 ? (monthSpent() / state.monthlyBudget) * 100 : 0;
      const daysLeft = Math.max(0, 30 - TODAY.getDate());

      /* Filtered transactions */
      const q = state.activitySearch.trim().toLowerCase();
      const filteredTxs = TRANSACTIONS.slice().sort((a, b) => txDate(b) - txDate(a)).filter((t) => {
        if (state.activityTypeFilter === "Expenses" && !isExpense(t)) return false;
        if (state.activityTypeFilter === "Income" && !isIncome(t)) return false;
        if (state.activityTypeFilter === "Transfers" && !isTransfer(t)) return false;
        if (state.activityTypeFilter === "Adjusted" && !isAdjust(t)) return false;
        if (state.activityWalletFilter !== "all" && t.wallet !== state.activityWalletFilter && t.to !== state.activityWalletFilter) return false;
        if (q) {
          const w = walletById(t.wallet);
          const hay = `${t.title} ${t.kind} ${t.note || ""} ${w ? w.name : ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      const shownTxs = filteredTxs.slice(0, state.activityLimit);

      const exportBtn = `<button class="nav-btn right" aria-label="Export CSV" onclick="exportCSV()">${svgIcon("export", { size: 19 })}<span>CSV</span></button>`;

      return `
        ${renderNavBar({ title: "Activity", right: exportBtn })}
        <main class="screen-scroll screen-enter" id="screenScroll">
          <div class="large-title-wrap">
            <h1 class="large-title">Activity</h1>
          </div>

          <div style="margin:0 16px;">
            ${renderSegmented("Time range", [
              { value: "Month", label: "November" },
              { value: "Week", label: "Last 7 Days" },
            ], state.activityRange, "setActivityRange")}
          </div>

          <!-- Chart Card -->
          <section class="chart-card">
            <div class="chart-header">
              <div>
                <div style="font-size:13px;font-weight:500;color:var(--label-secondary);">Total Spending · ${isMonth ? "Nov" : "7 Days"}</div>
                <div class="chart-hero-num tnum">${fmtHidden(periodOut)}</div>
              </div>
              <div class="chart-legend">
                <span><span class="legend-dot" style="background:var(--money-in)"></span>In</span>
                <span><span class="legend-dot" style="background:var(--tint)"></span>Out</span>
              </div>
            </div>

            <div class="chart-callout">
              ${inspected
                ? `<strong>${esc(inspected.label)}</strong> · <span style="color:var(--money-in)">+${fmtHidden(inspected.in, { cents: false })}</span> · <span>−${fmtHidden(inspected.out, { cents: false })}</span>`
                : `<span style="color:var(--label-secondary);">Tap any bar to inspect ${isMonth ? "period" : "day"} totals</span>`}
            </div>

            ${barsSvg}

            <div class="chart-flow-row">
              <div>
                <div class="flow-stat-label">Money In</div>
                <div class="flow-stat-val tnum" style="color:var(--money-in);">${state.hideBalances ? "₱ •••" : fmt(periodIn, { sign: true })}</div>
              </div>
              <div>
                <div class="flow-stat-label">Money Out</div>
                <div class="flow-stat-val tnum">${fmtHidden(-periodOut)}</div>
              </div>
              <div>
                <div class="flow-stat-label">Net Flow</div>
                <div class="flow-stat-val tnum" style="color:${periodNet >= 0 ? "var(--money-in)" : "var(--label)"};">${state.hideBalances ? "₱ •••" : fmt(periodNet, { sign: true })}</div>
              </div>
            </div>
          </section>

          <!-- Budget Pace Section -->
          <section class="section">
            <div class="section-header">
              <h2 class="section-title-headline">Monthly Budget</h2>
              <button class="section-action" onclick="navigate('#/activity/budgets')">All Budgets</button>
            </div>
            <div class="grouped-list">
              <div class="cell cell-sep-plain" style="flex-direction:column;align-items:stretch;gap:8px;padding:14px 16px;">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                  <div>
                    <div class="tnum" style="font-size:17px;font-weight:600;">${fmtHidden(monthSpent())} <span style="font-weight:400;color:var(--label-secondary);">of ${fmtHidden(state.monthlyBudget, { cents: false })}</span></div>
                    <div style="font-size:13px;color:${budgetPct >= 80 ? "var(--warning)" : "var(--label-secondary)"};font-weight:500;margin-top:2px;">
                      ${Math.round(budgetPct)}% used · ${daysLeft} days left in Nov
                    </div>
                  </div>
                  <button class="btn btn-tinted btn-sm" onclick="navigate('#/sheet/budget')">Edit</button>
                </div>
                <div class="progress-track">
                  <div class="progress-fill ${budgetPct >= 100 ? "over" : budgetPct >= 80 ? "warn" : ""}" style="width:${Math.min(100, budgetPct)}%"></div>
                </div>
              </div>
            </div>
          </section>

          <!-- Categories Breakdown -->
          <section class="section">
            <div class="section-header">
              <h2 class="section-title-headline">Categories</h2>
              <span style="font-size:13px;color:var(--label-secondary);font-weight:500;">${cats.length} active</span>
            </div>
            <div class="chart-card" style="margin-top:0;">
              <div class="cat-stacked-bar">
                ${cats.map(([cat, amt]) => `<div class="cat-stacked-seg" style="width:${((amt / totalCatSpend) * 100).toFixed(1)}%;background:${CAT_COLORS[cat] || "#8E8E93"};" title="${esc(cat)}"></div>`).join("")}
              </div>
              <div style="display:flex;flex-direction:column;gap:10px;">
                ${cats.slice(0, 6).map(([cat, amt]) => {
                  const pct = Math.round((amt / totalCatSpend) * 100);
                  const limit = CATEGORY_LIMITS[cat];
                  return `
                    <button style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;" onclick="navigate('#/sheet/category-budget/${encodeURIComponent(cat)}')">
                      ${categoryTile(cat)}
                      <div style="flex:1;min-width:0;">
                        <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:500;">
                          <span>${esc(cat)}</span>
                          <span class="tnum" style="font-weight:600;">${fmtHidden(amt)}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--label-secondary);margin-top:1px;">
                          <span>${pct}% of spending</span>
                          ${limit ? `<span class="tnum">Limit ${fmtHidden(limit, { cents: false })}</span>` : ""}
                        </div>
                      </div>
                    </button>`;
                }).join("")}
              </div>
            </div>
          </section>

          <!-- Transactions Search & List -->
          <section class="section">
            <div class="section-header">
              <h2 class="section-title-headline">Transactions</h2>
              <span style="font-size:13px;color:var(--label-secondary);font-weight:500;" class="tnum">${filteredTxs.length} shown</span>
            </div>

            <div class="ios-search-row">
              <div class="ios-search-field">
                ${svgIcon("search", { size: 16 })}
                <input type="search" placeholder="Search merchant, category, note" value="${esc(state.activitySearch)}" oninput="setActivitySearch(this.value)" aria-label="Search transactions" />
                ${state.activitySearch ? `<button style="color:var(--label-secondary);font-size:13px;" onclick="setActivitySearch('')">Clear</button>` : ""}
              </div>
              <select aria-label="Filter by wallet" onchange="setActivityWalletFilter(this.value)"

                <option value="all" ${state.activityWalletFilter === "all" ? "selected" : ""}>All Wallets</option>
                ${WALLETS.map((w) => `<option value="${esc(w.id)}" ${state.activityWalletFilter === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}
              </select>
            </div>

            <div class="filter-chips">
              ${["All", "Expenses", "Income", "Transfers", "Adjusted"].map((f) => `
                <button class="filter-chip ${state.activityTypeFilter === f ? "active" : ""}" onclick="setActivityTypeFilter('${f}')">${f}</button>
              `).join("")}
            </div>

            ${shownTxs.length === 0 ? `
              <div class="empty-unavailable" style="padding:32px 24px;">
                <div class="empty-glyph">${svgIcon("search", { size: 26 })}</div>
                <h3 class="empty-title" style="font-size:18px;">No Matching Transactions</h3>
                <p class="empty-desc">Try adjusting your search or filter selection.</p>

              </div>

              <div class="day-group-label"><span>${esc(label)}</span><span class="tnum">${items.length}</span></div>

                ${items.map((t) => renderTxRow(t)).join("")}
              </div>`).join("")}

            ${filteredTxs.length > shownTxs.length ? `
              <div style="margin:14px 16px 0;">
                <button class="btn btn-gray btn-block" onclick="loadMoreActivity()">Load More (${filteredTxs.length - shownTxs.length} remaining)</button>
              </div>` : ""}
          </section>
        </main>
        ${renderTabBar("activity")}`;
    }

    function renderBudgets() {
      const spent = monthSpent();
      const pct = state.monthlyBudget > 0 ? (spent / state.monthlyBudget) * 100 : 0;
      const daysLeft = Math.max(0, 30 - TODAY.getDate());
      const catSpendMap = Object.fromEntries(spendingByCategory());
      const limitEntries = Object.entries(CATEGORY_LIMITS).sort((a, b) => {
        const pctA = (catSpendMap[a[0]] || 0) / a[1];
        const pctB = (catSpendMap[b[0]] || 0) / b[1];
        return pctB - pctA;
      });
      const unbudgeted = spendingByCategory().filter(([c]) => !CATEGORY_LIMITS[c]);

      const backBtn = `<button class="nav-btn" onclick="navigate('#/activity')">${svgIcon("chevron-left", { size: 21, stroke: 2 })}<span>Activity</span></button>`;
      const editBtn = `<button class="nav-btn right bold" onclick="navigate('#/sheet/budget')">Edit</button>`;

      return `
        ${renderNavBar({ title: "Budgets", left: backBtn, right: editBtn })}
        <main class="screen-scroll screen-push" id="screenScroll">
          <div class="large-title-wrap">
            <h1 class="large-title">Budgets</h1>
          </div>

          <!-- Monthly Budget Pace -->
          <section class="section-tight">
            <div class="section-header">
              <h2 class="section-title">Monthly Limit</h2>
              <button class="section-action" onclick="navigate('#/sheet/budget')">Edit Limit</button>
            </div>
            <div class="grouped-list">
              <div class="cell cell-sep-plain" style="padding:16px;align-items:center;justify-content:space-between;">
                <div style="flex:1;min-width:0;padding-right:12px;">
                  <div style="font-size:13px;color:var(--label-secondary);font-weight:500;">November Spending Pace</div>
                  <div class="tnum" style="font-family:var(--font-rounded);font-size:26px;font-weight:700;margin:2px 0 4px;">${fmtHidden(spent)}</div>
                  <div style="font-size:13px;color:var(--label-secondary);">
                    Limit ${fmtHidden(state.monthlyBudget, { cents: false })} · <strong style="color:${pct >= 80 ? "var(--warning)" : "var(--tint)"}">${daysLeft} days left</strong>
                  </div>
                  <div class="progress-track" style="margin-top:10px;">
                    <div class="progress-fill ${pct >= 100 ? "over" : pct >= 80 ? "warn" : ""}" style="width:${Math.min(100, pct)}%"></div>
                  </div>
                </div>
                ${renderBudgetRing(pct, pct >= 80 && pct < 100, pct >= 100)}
              </div>
            </div>
          </section>

          <!-- Category Budgets -->
          <section class="section">
            <div class="section-header">
              <h2 class="section-title">Category Limits</h2>
              <span style="font-size:12px;color:var(--label-secondary);">Tap to edit</span>
            </div>
            <div class="grouped-list">
              ${limitEntries.map(([cat, limit]) => {
                const used = catSpendMap[cat] || 0;
                const cpct = (used / limit) * 100;
                const isOver = cpct >= 100;
                const isWarn = cpct >= 80 && cpct < 100;
                return `
                  <button class="cell clickable cell-sep" style="padding:12px 14px;" onclick="navigate('#/sheet/category-budget/${encodeURIComponent(cat)}')">
                    ${categoryTile(cat)}
                    <div class="cell-main" style="gap:5px;">
                      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
                        <span class="cell-title">${esc(cat)}</span>
                        <span class="tnum" style="font-size:14px;font-weight:600;color:${isOver ? "var(--destructive)" : isWarn ? "var(--warning)" : "var(--label)"};">
                          ${fmtHidden(used, { cents: false })} <span style="color:var(--label-secondary);font-weight:400;">/ ${fmtHidden(limit, { cents: false })}</span>
                        </span>
                      </div>
                      <div class="progress-track" style="height:6px;">
                        <div class="progress-fill ${isOver ? "over" : isWarn ? "warn" : ""}" style="width:${Math.min(100, cpct)}%"></div>
                      </div>
                      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--label-secondary);">
                        <span>${isOver ? "Over limit" : isWarn ? "Near limit" : "On track"}</span>
                        <span class="tnum">${Math.round(cpct)}%</span>
                      </div>
                    </div>
                    <span class="chevron">${svgIcon("chevron-right", { size: 16 })}</span>
                  </button>`;
              }).join("")}
            </div>
          </section>

          ${unbudgeted.length ? `
            <section class="section">
              <div class="section-header"><h2 class="section-title">Other Nov Categories (No Limit)</h2></div>
              <div class="grouped-list">
                ${unbudgeted.map(([cat, used]) => `
                  <button class="cell clickable cell-sep" onclick="navigate('#/sheet/category-budget/${encodeURIComponent(cat)}')">
                    ${categoryTile(cat)}
                    <div class="cell-main">
                      <div class="cell-title">${esc(cat)}</div>
                      <div class="cell-sub">${fmtHidden(used)} spent · Tap to set limit</div>
                    </div>
                    <div class="cell-trailing">
                      <span class="cell-value" style="color:var(--tint);font-size:14px;font-weight:600;">Set limit</span>
                      <span class="chevron">${svgIcon("chevron-right", { size: 16 })}</span>
                    </div>
                  </button>`).join("")}
              </div>
            </section>` : ""}
        </main>
        ${renderTabBar("activity")}`;
    }

        { id: "orange", color: "#FF9F0A", name: "Orange" },
        { id: "pink", color: "#FF375F", name: "Pink" },

      return `
        ${renderNavBar({ title: "Settings" })}

                  <div class="cell-title">Backup &amp; Sync</div>

              </button>
            </div>
          </section>

          <!-- Appearance -->
          <section class="section">
            <div class="section-header"><h2 class="section-title">Appearance</h2></div>
            <div class="grouped-list">
              <div class="cell cell-sep">
                <span class="cat-tile" style="background:#1C1C1E;">${svgIcon("moon", { size: 16 })}</span>

                  <div class="cell-title">Dark Mode</div>

                  <span class="ios-switch-knob"></span>
                </button>
              </div>
              <div class="cell cell-sep">
                <span class="cat-tile" style="background:var(--tint);">${svgIcon("palette", { size: 16 })}</span>
                <div class="cell-main">
                  <div class="cell-title">Accent Color</div>
                </div>
                <div class="accent-dots" role="radiogroup" aria-label="Accent color">
                  ${accents.map((a) => `
                    <button class="accent-dot ${state.accent === a.id ? "active" : ""}" style="background:${a.color};"
                      aria-label="${a.name}" aria-checked="${state.accent === a.id}" role="radio"
                      onclick="setAccent('${a.id}')">${state.accent === a.id ? svgIcon("check", { size: 13, stroke: 2.8 }) : ""}</button>`).join("")}
                </div>
              </div>
              <div class="cell cell-sep">
                <span class="cat-tile" style="background:#636366;">${svgIcon("eye-off", { size: 16 })}</span>
                <div class="cell-main">
                  <div class="cell-title">Hide Balances</div>
                  <div class="cell-sub">Mask amounts app-wide</div>
                </div>
                <button class="ios-switch ${state.hideBalances ? "on" : ""}" role="switch" aria-checked="${state.hideBalances}" aria-label="Toggle hide balances" onclick="toggleHideBalances()">
                  <span class="ios-switch-knob"></span>

            </div>
          </section>

          <!-- Security -->
          <section class="section">
            <div class="section-header"><h2 class="section-title">Security</h2></div>
            <div class="grouped-list">
              <div class="cell cell-sep">
                <span class="cat-tile" style="background:#FF3B30;">${svgIcon("lock", { size: 16 })}</span>
                <div class="cell-main">
                  <div class="cell-title">App Lock</div>
                </div>
                <button class="ios-switch ${state.appLock ? "on" : ""}" role="switch" aria-checked="${state.appLock}" aria-label="Toggle app lock" onclick="toggleAppLock()">
                  <span class="ios-switch-knob"></span>
                </button>
              </div>
              <button class="cell clickable cell-sep" onclick="navigate('#/sheet/pin')">
                <span class="cat-tile" style="background:#5856D6;">${svgIcon("shield", { size: 16 })}</span>
                <div class="cell-main">
                  <div class="cell-title">Change PIN</div>
                  <div class="cell-sub">4-digit passcode</div>
                </div>
                <span class="chevron">${svgIcon("chevron-right", { size: 16 })}</span>

              <div class="cell cell-sep">
                <span class="cat-tile" style="background:#34C759;">${svgIcon("faceid", { size: 16 })}</span>
                <div class="cell-main">
                  <div class="cell-title">Face ID &amp; Fingerprint</div>
                </div>
                <button class="ios-switch ${state.biometric ? "on" : ""}" role="switch" aria-checked="${state.biometric}" aria-label="Toggle biometric unlock" onclick="toggleBiometric()">
                  <span class="ios-switch-knob"></span>

          <!-- Planning -->
          <section class="section">

                <span class="cat-tile" style="background:#E5A400;">${svgIcon("star", { size: 16 })}</span>
                <div class="cell-main">
                  <div class="cell-title">Quick Favorites</div>
                </div>
                <span class="cell-value tnum">${FAVORITES.length}</span>
                <span class="chevron">${svgIcon("chevron-right", { size: 16 })}</span>
              </button>
              <button class="cell clickable cell-sep" onclick="navigate('#/activity/budgets')">
                <span class="cat-tile" style="background:#0A8A78;">${svgIcon("chart", { size: 16 })}</span>
                <div class="cell-main">
                  <div class="cell-title">Budgets &amp; Category Limits</div>

                <span class="chevron">${svgIcon("chevron-right", { size: 16 })}</span>

    function renderSheetWrapper(title, bodyHtml, { detent = "tall", leftText = "Cancel", rightText = "Save", rightDisabled = false, onLeft = "closeSheet()", onRight = "" } = {}) {
      return `
        <div class="sheet-backdrop" onclick="closeSheet()"></div>
        <section class="sheet-panel ${detent}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
          <div class="sheet-grabber-wrap"><div class="sheet-grabber"></div></div>
          <header class="sheet-nav">
            <button class="nav-btn" onclick="${onLeft}">${esc(leftText)}</button>
            <h2 class="sheet-title">${esc(title)}</h2>
            ${rightText ? `<button class="nav-btn right bold" ${rightDisabled ? "disabled style='opacity:.35;pointer-events:none;'" : ""} onclick="${onRight}">${esc(rightText)}</button>` : `<span style="min-width:64px"></span>`}
          </header>
          <div class="sheet-body">${bodyHtml}</div>
        </section>`;
    }

            wallet: t.wallet,
            title: t.title,

            date: t.at.slice(0, 10),
            saveFav: false,
            pickCatOpen: false,
            pickWalletOpen: false,

            editId: null,

    function groupTransactionsByDay(list) {
      const groups = [];
      const map = new Map();
      list.forEach((t) => {
        const lbl = dayLabel(txDate(t));
        if (!map.has(lbl)) {
          const arr = [];
          map.set(lbl, arr);
          groups.push([lbl, arr]);
        }
        map.get(lbl).push(t);
      });
      return groups;
    }

    function buildSixDayBuckets() {
      const buckets = [
        { label: "Nov 1–5", start: 1, end: 5 },
        { label: "6–10", start: 6, end: 10 },
        { label: "11–15", start: 11, end: 15 },
        { label: "16–20", start: 16, end: 20 },
        { label: "21–24", start: 21, end: 24 },
      ];
      return buckets.map((b) => {
        const txs = monthTx().filter((t) => {
          const day = txDate(t).getDate();
          return day >= b.start && day <= b.end;
        });
        return {
          label: b.label,
          in: txs.filter(isIncome).reduce((s, t) => s + t.amount, 0),
          out: txs.filter(isExpense).reduce((s, t) => s - t.amount, 0),
        };
      });
    }

    function formatSheetDate(iso) {
      if (!iso) return "Today, Nov 24";
      if (iso === "2026-11-24") return "Today, Nov 24";
      const d = new Date(iso + "T00:00:00");
      return isNaN(d) ? iso : d.toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" });
    }

      const pct = num > 0 ? Math.round((spent / num) * 100) : 0;
      box.innerHTML = `November spent so far: <strong class="tnum" style="color:var(--label);">${fmtHidden(spent)}</strong> (${pct}% of ${fmtHidden(num, { cents: false })})`;
    }

    function formatRawInput(str) {
      const [intPart, decPart] = str.split(".");
      const formattedInt = (parseInt(intPart || "0", 10)).toLocaleString("en-US");
      return decPart !== undefined ? `${formattedInt}.${decPart}` : formattedInt;
    }

      if (!state.txDraft) return;
      let s = state.txDraft.amountStr;
      if (k === "del") s = s.slice(0, -1);
      else if (k === ".") {
        if (!s.includes(".")) s = (s || "0") + ".";
      } else {
        const parts = s.split(".");
        if (parts[1] && parts[1].length >= 2) return;
        if (s === "0") s = k;
        else if (s.length < 9) s += k;
      }

      const d = state.txDraft;
      const amt = parseFloat(d.amountStr);
      if (!amt || amt <= 0) return;
      const signed = d.direction === "income" ? amt : -amt;
      const w = walletById(d.wallet);
      const nowTime = "T" + String(TODAY.getHours()).padStart(2, "0") + ":" + String(TODAY.getMinutes()).padStart(2, "0");

      if (d.editId) {
        const old = TRANSACTIONS.find((x) => x.id === d.editId);
        if (old) {
          const oldW = walletById(old.wallet);
          if (oldW) oldW.balance -= old.amount;
          old.title = d.title.trim() || d.category;
          old.kind = d.category;
          old.wallet = d.wallet;
          old.amount = signed;
          old.at = `${d.date}${old.at.slice(10) || nowTime}`;
          if (w) w.balance += signed;
          showToast("Transaction updated");
        }
      } else {
        const newTx = {
          id: "t" + Date.now(),
          title: d.title.trim() || d.category,
          kind: d.category,
          wallet: d.wallet,
          amount: signed,
          at: `${d.date}${nowTime}`,
          localOnly: true,
        };
        TRANSACTIONS.unshift(newTx);
        if (w) w.balance += signed;
        if (d.saveFav) {
          FAVORITES.push({
            id: "f" + Date.now(),
            name: newTx.title,
            direction: d.direction,
            category: d.category,
            wallet: d.wallet,
            defaultAmount: amt,

      closeSheet();

      const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");

      state.alert = {

        message: `Remove "${t.title}" (${fmt(t.amount, { sign: true })})? Your wallet balance will be adjusted.`,
        confirmText: "Delete",
        destructive: true,
        onConfirm: () => {
          const idx = TRANSACTIONS.findIndex((x) => x.id === txId);
          if (idx >= 0) {
            const [rem] = TRANSACTIONS.splice(idx, 1);
            const w = walletById(rem.wallet);

            if (rem.to) {
              const toW = walletById(rem.to);
              if (toW) toW.balance -= Math.abs(rem.amount);

          showToast("Transaction deleted");
          if (location.hash.includes(`/tx/${txId}`)) closeSheet();
        },
      };
      render();
    }
