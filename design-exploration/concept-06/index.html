<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="sunflower">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pitaka — Jeepney Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   CONCEPT 06: PITAKA JEEPNEY EDITION — DESIGN TOKENS
   "Manila street graphics, engineered"
   ========================================================================== */
:root {
  /* Core Surfaces & Ink */
  --bg: #FFF4DC;
  --paper: #FFFBF0;
  --paper-alt: #F6E9C9;
  --ink: #151413;
  --ink-muted: #554F47;
  --stroke: #151413;
  --shadow-color: #151413;
  --backdrop-bg: #EDE0C2;

  /* Jeepney Spot Colors (flat, never gradients) */
  --sunflower: #FFCE1F;
  --red: #E8412C;
  --blue: #2350E0;
  --teal: #13A89E;
  --mango: #FF8A1F;
  --lilac: #B9A4FF;
  --green: #159A52;

  /* High-contrast ink pairs on spot plates */
  --ink-on-sunflower: #151413;
  --ink-on-teal: #151413;
  --ink-on-mango: #151413;
  --ink-on-lilac: #151413;
  --ink-on-red: #FFFBF0;
  --ink-on-blue: #FFFBF0;
  --ink-on-green: #FFFBF0;

  /* Active Primary Accent (defaults to sunflower) */
  --accent: var(--sunflower);
  --accent-ink: var(--ink-on-sunflower);

  /* Typography */
  --font-display: 'Bricolage Grotesque', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, 'Cascadia Mono', 'Consolas', monospace;

  /* Spacing & Shape (4/8 grid, 10px radius) */
  --r: 10px;
  --r-sm: 6px;
  --r-pill: 999px;
  --bw: 2px;
  --sh-sm: 2px 2px 0 var(--shadow-color);
  --sh: 4px 4px 0 var(--shadow-color);
  --sh-lg: 8px 8px 0 var(--shadow-color);

  /* Motion */
  --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-snap: cubic-bezier(0.2, 0.8, 0.2, 1);
  --dur-fast: 160ms;
  --dur-mid: 240ms;

  /* Semantic Pattern Fills */
  --pat-hatch: repeating-linear-gradient(
    -45deg,
    rgba(21, 20, 19, 0.16) 0px,
    rgba(21, 20, 19, 0.16) 3px,
    transparent 3px,
    transparent 8px
  );
  --pat-hatch-blue: repeating-linear-gradient(
    -45deg,
    #2350E0 0px,
    #2350E0 3px,
    #7B9BFF 3px,
    #7B9BFF 7px
  );
  --pat-hatch-red: repeating-linear-gradient(
    -45deg,
    #E8412C 0px,
    #E8412C 4px,
    #151413 4px,
    #151413 7px
  );
  --pat-dots: radial-gradient(rgba(21, 20, 19, 0.22) 1.5px, transparent 1.5px);
  --pat-dots-bg: 8px 8px;
}

/* Accent Variants */
html[data-accent="sunflower"] { --accent: #FFCE1F; --accent-ink: #151413; }
html[data-accent="red"]       { --accent: #E8412C; --accent-ink: #FFFBF0; }
html[data-accent="blue"]      { --accent: #2350E0; --accent-ink: #FFFBF0; }
html[data-accent="teal"]      { --accent: #13A89E; --accent-ink: #151413; }

/* Dark Theme: "Gabi sa Kalye" */
html[data-theme="dark"] {
  --bg: #151413;
  --paper: #211F1D;
  --paper-alt: #2B2825;
  --ink: #FFF4DC;
  --ink-muted: #C9BFA9;
  --stroke: #FFF4DC;
  --shadow-color: #FFF4DC;
  --backdrop-bg: #0D0C0B;
  --pat-hatch: repeating-linear-gradient(
    -45deg,
    rgba(255, 244, 220, 0.16) 0px,
    rgba(255, 244, 220, 0.16) 3px,
    transparent 3px,
    transparent 8px
  );
  --pat-dots: radial-gradient(rgba(255, 244, 220, 0.24) 1.5px, transparent 1.5px);
}

/* ==========================================================================
   BASE & RESET
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--ink);
  background: var(--backdrop-bg);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
}

:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}
html[data-theme="dark"] :focus-visible {
  outline-color: var(--sunflower);
}

.tnum {
  font-variant-numeric: tabular-nums;
}

.mono {
  font-family: var(--font-mono);
}

.kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ==========================================================================
   DESKTOP FRAME VS MOBILE VIEWPORT
   ========================================================================== */
.stage {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  background-color: var(--backdrop-bg);
  background-image: var(--pat-dots);
  background-size: 14px 14px;
}

.showcase-bar {
  width: 390px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.showcase-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: var(--paper);
  color: var(--ink);
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r-sm);
  box-shadow: var(--sh-sm);
  text-decoration: none;
  font-weight: 700;
  transition: transform var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap);
}
.showcase-back:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--shadow-color);
}

.showcase-title {
  padding: 5px 10px;
  background: var(--sunflower);
  color: #151413;
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r-sm);
  box-shadow: var(--sh-sm);
  font-weight: 700;
}

.phone-frame {
  position: relative;
  width: 390px;
  height: 844px;
  background: var(--bg);
  border: 3px solid var(--stroke);
  border-radius: 34px;
  box-shadow: 10px 10px 0 var(--shadow-color);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.phone-notch {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 94px;
  height: 22px;
  background: #151413;
  border: 2px solid var(--stroke);
  border-radius: var(--r-pill);
  z-index: 60;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 8px;
}
.phone-notch::after {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #36332F;
  border: 1px solid #59534B;
}

@media (max-width: 500px) {
  .stage {
    padding: 0;
    background: var(--bg);
    display: block;
  }
  .showcase-bar,
  .phone-notch {
    display: none;
  }
  .phone-frame {
    width: 100%;
    height: 100dvh;
    border: none;
    border-radius: 0;
    box-shadow: none;
  }
}

/* ==========================================================================
   APP SHELL & SCROLL REGION
   ========================================================================== */
.app-shell {
  position: relative;
  flex: 1;
  width: 100%;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.screen-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: calc(36px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));
  scroll-behavior: smooth;
}
@media (max-width: 500px) {
  .screen-scroll {
    padding-top: calc(14px + env(safe-area-inset-top));
  }
}

.screen-scroll.no-nav-pad {
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

.screen-anim {
  animation: screenIn var(--dur-mid) var(--ease-snap) both;
}
@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   CORE NEO-BRUTALIST PRIMITIVES
   ========================================================================== */
.plate {
  background: var(--paper);
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r);
  box-shadow: var(--sh);
}

.plate-sm {
  background: var(--paper);
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r);
  box-shadow: var(--sh-sm);
}

.pressable {
  transition: transform var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap), background-color var(--dur-fast) ease;
}
.pressable:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 var(--shadow-color) !important;
}

.pressable-sm {
  transition: transform var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap);
}
.pressable-sm:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--shadow-color) !important;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 16px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.01em;
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r);
  box-shadow: var(--sh);
  background: var(--paper);
  color: var(--ink);
  text-decoration: none;
  transition: transform var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap);
}
.btn:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 var(--shadow-color);
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-sun {
  background: var(--sunflower);
  color: #151413;
}
.btn-red {
  background: var(--red);
  color: #FFFBF0;
}
.btn-blue {
  background: var(--blue);
  color: #FFFBF0;
}
.btn-teal {
  background: var(--teal);
  color: #151413;
}
.btn-dark {
  background: #151413;
  color: #FFF4DC;
}
html[data-theme="dark"] .btn-dark {
  background: #FFF4DC;
  color: #151413;
}
.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 12px;
  box-shadow: var(--sh-sm);
}
.btn-sm:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--shadow-color);
}
.btn-block {
  width: 100%;
}

.icon-btn {
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  color: var(--ink);
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r);
  box-shadow: var(--sh-sm);
  flex-shrink: 0;
  transition: transform var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap);
}
.icon-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--shadow-color);
}

/* Pill Sticker Chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 12px;
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r-pill);
  background: var(--paper);
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: var(--sh-sm);
  transition: transform var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap), background-color var(--dur-fast) ease;
}
.chip:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--shadow-color);
}
.chip.is-active {
  background: var(--accent);
  color: var(--accent-ink);
}

/* Price-tag sticker (punched hole on left) */
.price-tag {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px 4px 16px;
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--sh-sm);
  flex-shrink: 0;
}
.price-tag::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  border: 1.5px solid var(--stroke);
  background: var(--bg);
}
.price-tag.is-in {
  background: #DDF7E7;
  color: #0D6E39;
  border-color: #151413;
}
html[data-theme="dark"] .price-tag.is-in {
  background: #159A52;
  color: #FFFBF0;
  border-color: var(--stroke);
}
.price-tag.is-transfer {
  background-image: var(--pat-hatch);
}
.price-tag.is-adjust {
  background: var(--sunflower);
  color: #151413;
}

/* Tilted Warning / Status Sticker */
.tilt-sticker {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border: var(--bw) solid var(--stroke);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--sunflower);
  color: #151413;
  transform: rotate(-3deg);
  box-shadow: 2px 2px 0 var(--shadow-color);
}
.tilt-sticker.is-over {
  background: var(--red);
  color: #FFFBF0;
  transform: rotate(2deg);
}

/* Section Headers */
.sec-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
  margin: 20px 0 10px;
}
.sec-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.sec-kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.sec-title {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.sec-link {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 6px 10px;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r-sm);
  background: var(--paper);
  box-shadow: var(--sh-sm);
}

/* Chunky Wordmark ("pitaka" with literal dog-eared folded 'p') */
.wordmark {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-weight: 800;
  font-size: 24px;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--ink);
  text-decoration: none;
}
.wordmark-p {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  background: var(--sunflower);
  color: #151413;
  border: var(--bw) solid var(--stroke);
  border-radius: 0 7px 7px 7px;
  box-shadow: var(--sh-sm);
  font-size: 20px;
  font-weight: 800;
  line-height: 1;
}
.wordmark-p::before {
  content: "";
  position: absolute;
  top: -2px;
  left: -2px;
  width: 10px;
  height: 10px;
  background: var(--bg);
  border-right: var(--bw) solid var(--stroke);
  border-bottom: var(--bw) solid var(--stroke);
  border-bottom-right-radius: 3px;
}

/* ==========================================================================
   TRANSIT-TICKET WALLET COMPONENT
   ========================================================================== */
.ticket {
  position: relative;
  display: flex;
  align-items: stretch;
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r);
  box-shadow: var(--sh);
  overflow: hidden;
  color: #151413;
  text-align: left;
  transition: transform var(--dur-fast) var(--ease-pop), box-shadow var(--dur-fast) var(--ease-snap);
}
.ticket.is-dark-plate {
  color: #FFFBF0;
}
.ticket-main {
  flex: 1;
  min-width: 0;
  padding: 13px 12px 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
}
.ticket-top {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-stamp {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #FFFBF0;
  border: var(--bw) solid #151413;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 2px 2px 0 #151413;
}
.logo-stamp img {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  object-fit: cover;
  display: block;
}
.logo-stamp-text {
  font-weight: 800;
  font-size: 13px;
  color: #151413;
}
.ticket-route {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0.88;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ticket-name {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  line-height: 1.05;
  font-stretch: condensed;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ticket-acct {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  opacity: 0.85;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ticket-tear {
  position: relative;
  width: 1px;
  border-left: 2px dashed currentColor;
  opacity: 0.7;
  margin: 10px 0;
  flex-shrink: 0;
}
/* Punched semicircle notches top & bottom */
.ticket-tear::before,
.ticket-tear::after {
  content: "";
  position: absolute;
  left: -8px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg);
  border: var(--bw) solid var(--stroke);
}
.ticket-tear::before { top: -18px; }
.ticket-tear::after  { bottom: -18px; }

.ticket-stub {
  width: 112px;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
  background: rgba(255, 251, 240, 0.16);
  flex-shrink: 0;
}
.ticket.is-dark-plate .ticket-stub {
  background: rgba(21, 20, 19, 0.18);
}
.ticket-stub-lbl {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.88;
}
.ticket-stub-bal {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  text-align: right;
  word-break: break-word;
}
.ticket-stub-code {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.05em;
  opacity: 0.8;
}

/* ==========================================================================
   BOTTOM NAVIGATION BAR + SUNFLOWER "+" BUTTON
   ========================================================================== */
.nav-wrap {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: calc(10px + env(safe-area-inset-bottom));
  z-index: 40;
  pointer-events: none;
}
.nav-bar {
  pointer-events: auto;
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr 64px 1fr 1fr;
  align-items: center;
  height: 62px;
  background: var(--paper);
  border: var(--bw) solid var(--stroke);
  border-radius: var(--r);
  box-shadow: var(--sh);
  padding: 0 4px;
}
.nav-tab {
  min-height: 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border-radius: var(--r-sm);
  color: var(--ink-muted);
  transition: color var(--dur-fast) ease, background-color var(--dur-fast) ease, transform var(--dur-fast) var(--ease-snap);
}
.nav-tab:active {
  transform: scale(0.95);
}
.nav-tab.is-active {
  color: var(--ink);
  background: var(--paper-alt);
}
.nav-tab-en {
  font-size: 10.5px;

/* ----------------------------- helpers ---------------------------------- */
const fmt = (v, { sign = false, cents = true } = {}) => {
  const abs = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  return `${v < 0 ? "−" : sign && v > 0 ? "+" : ""}₱${abs}`;
};
const fmtCompact = (v) => Math.abs(v) >= 1000 ? `₱${(v / 1000).toFixed(Math.abs(v) >= 10000 ? 1 : 1).replace(/\.0$/, "")}K` : `₱${Math.round(v)}`;
const splitMoney = (v) => { const [w, c] = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).split("."); return { whole: w, cents: c }; };
const walletById = (id) => WALLETS.find((w) => w.id === id);
const isTransfer = (t) => t.kind === "Transfer";
const isAdjust = (t) => t.kind === "Updated";
const isExpense = (t) => t.amount < 0 && !isTransfer(t) && !isAdjust(t);
const isIncome = (t) => t.amount > 0 && !isTransfer(t) && !isAdjust(t);
const txDate = (t) => new Date(t.at);
const sameMonth = (d, ref = TODAY) => d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
const totalBalance = () => WALLETS.reduce((s, w) => s + w.balance, 0); // ₱88,021.50
const monthTx = (ref = TODAY) => TRANSACTIONS.filter((t) => sameMonth(txDate(t), ref));
const monthSpent = (ref = TODAY) => monthTx(ref).filter(isExpense).reduce((s, t) => s - t.amount, 0);
const monthIncome = (ref = TODAY) => monthTx(ref).filter(isIncome).reduce((s, t) => s + t.amount, 0);
const spendingByCategory = (ref = TODAY) => {
  const m = {}; monthTx(ref).filter(isExpense).forEach((t) => { m[t.kind] = (m[t.kind] || 0) - t.amount; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]); // [[category, amount], ...]
};
/* daily series for the current month up to today: [{day, in, out}] */
const dailySeries = (ref = TODAY) => Array.from({ length: ref.getDate() }, (_, i) => {
  const day = i + 1; const tx = monthTx(ref).filter((t) => txDate(t).getDate() === day);
  return { day, in: tx.filter(isIncome).reduce((s, t) => s + t.amount, 0), out: tx.filter(isExpense).reduce((s, t) => s - t.amount, 0) };
});
/* weekly series: last 7 days ending today */
const weekSeries = (ref = TODAY) => Array.from({ length: 7 }, (_, i) => {
  const d = new Date(ref); d.setDate(ref.getDate() - 6 + i);
  const tx = TRANSACTIONS.filter((t) => txDate(t).toDateString() === d.toDateString());
  return { label: d.toLocaleDateString("en-PH", { weekday: "short" }), date: d, in: tx.filter(isIncome).reduce((s, t) => s + t.amount, 0), out: tx.filter(isExpense).reduce((s, t) => s - t.amount, 0) };
});
const walletTx = (id) => TRANSACTIONS.filter((t) => t.wallet === id || t.to === id)
  .map((t) => (t.to === id ? { ...t, amount: Math.abs(t.amount), incoming: true } : t));
const dayLabel = (d) => {
  const diff = Math.round((new Date(TODAY.toDateString()) - new Date(d.toDateString())) / 864e5);
  return diff === 0 ? "Today" : diff === 1 ? "Yesterday" : d.toLocaleDateString("en-PH", { month: "short", day: "numeric" });
};
const timeLabel = (d) => d.toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" });
const daysAway = (iso) => Math.round((new Date(iso + "T00:00:00") - new Date(TODAY.toDateString())) / 864e5);
const dueLabel = (n) => n === 0 ? "Due today" : n === 1 ? "Due tomorrow" : n < 0 ? `${-n} days overdue` : `Due in ${n} days`;

function icon(name, size = 20, cls = "") {
  const d = ICONS[name] || ICONS.tag;
  return `<svg class="ico ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}

function categoryIconName(kind) {
  if (kind === "Transfer") return "swap";
  if (kind === "Updated") return "adjust";
  const all = [...EXPENSE_CATEGORIES, ...INCOME_CATEGORIES];
  const found = all.find(([label]) => label === kind);
  return found ? found[1] : "tag";
}

function readQueryOverrides() {
  const combined = new URLSearchParams();
  new URLSearchParams(window.location.search).forEach((v, k) => combined.set(k, v));
  const hashQ = window.location.hash.split("?")[1];
  if (hashQ) new URLSearchParams(hashQ).forEach((v, k) => combined.set(k, v));
  const th = combined.get("theme");
  if (th === "dark" || th === "light") state.theme = th;
  const ac = combined.get("accent");
  if (ac && ["sunflower", "red", "blue", "teal"].includes(ac)) state.accent = ac;
  if (combined.get("hidden") === "1" || combined.get("hidden") === "true") state.hideBalances = true;
}

function applyThemeAttrs() {
  document.documentElement.setAttribute("data-theme", state.theme);
  document.documentElement.setAttribute("data-accent", state.accent);
}

function maskMoney(str) {
  return state.hideBalances ? "₱ ••••" : str;
}

function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function showToast(msg) {
  const host = document.getElementById("toast-host");
  if (!host) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `${icon("check", 14)}<span>${esc(msg)}</span>`;
  host.innerHTML = "";
  host.appendChild(el);
  setTimeout(() => {
    if (el.parentNode) el.remove();
  }, 2400);
}

function renderLogoStamp(w) {

function renderTicketCard(w, { compact = false, lifted = false, attrs = "" } = {}) {
  const spot = walletSpot(w);
  const darkCls = spot.darkPlate ? "is-dark-plate" : "";
  const liftCls = lifted ? "is-lifted" : "";
  const code = `PTK-${w.id.toUpperCase().slice(0, 4)}`;
  return `
    <div class="ticket pressable ${darkCls} ${liftCls}" style="background:${spot.hex}" ${attrs}>
      <div class="ticket-main">
        <div class="ticket-top">
          ${renderLogoStamp(w)}

            <div class="ticket-route">ROUTE: ${esc(w.type)} · ${esc(w.account)}</div>
            <div class="ticket-name">${esc(w.name)}</div>
          </div>
        </div>
        <div class="ticket-acct">
          <span>${esc(w.number || "NO. 001")}</span>
          ${compact ? "" : `<span>• VALID PH</span>`}
        </div>
      </div>
      <div class="ticket-tear" aria-hidden="true"></div>
      <div class="ticket-stub">
        <span class="ticket-stub-lbl">BALANCE</span>
        <span class="ticket-stub-bal tnum">${esc(maskMoney(fmt(w.balance)))}</span>
        <span class="ticket-stub-code">${esc(code)}</span>
      </div>
    </div>
  `;
}

function renderPriceTag(tx) {
  let cls = "";
  let label = fmt(tx.amount, { sign: true });
  if (isTransfer(tx)) {
    cls = tx.incoming ? "is-in" : "is-transfer";
    label = tx.incoming ? fmt(tx.amount, { sign: true }) : `⇄ ${fmt(Math.abs(tx.amount))}`;
  } else if (isAdjust(tx)) {
    cls = "is-adjust";
    label = `${tx.amount >= 0 ? "+" : "−"}${fmt(Math.abs(tx.amount))}`;
  } else if (tx.amount > 0) {
    cls = "is-in";
    label = fmt(tx.amount, { sign: true });
  }
  return `<span class="price-tag ${cls} tnum">${esc(maskMoney(label))}</span>`;
}

function renderTxRow(tx, showWallet = true) {
  const w = walletById(tx.wallet);
  const toW = tx.to ? walletById(tx.to) : null;
  const d = txDate(tx);
  const badgeCls = isTransfer(tx) ? "is-transfer" : "";
  const sub = isTransfer(tx) && toW
    ? `${w ? w.name : tx.wallet} → ${toW.name} · ${dayLabel(d)}`
    : `${showWallet && w ? w.name + " · " : ""}${tx.kind} · ${dayLabel(d)}, ${timeLabel(d)}`;
  return `
    <button type="button" class="tx-row pressable-sm" data-open-tx="${esc(tx.id)}">
      <div class="tx-row-left">
        <div class="tx-cat-badge ${badgeCls}">
          ${icon(categoryIconName(tx.kind), 18)}
        </div>
        <div style="min-width:0;flex:1">
          <div class="tx-title">${esc(tx.title)}</div>
          <div class="tx-meta">${esc(sub)}</div>
        </div>
      </div>
      ${renderPriceTag(tx)}
    </button>
  `;
}

function renderScreenActivity() {
  const isWeek = state.activityRange === "week";
  const series = isWeek ? weekSeries() : dailySeries();
  const spent = isWeek
    ? series.reduce((s, d) => s + d.out, 0)
    : monthSpent();
  const inc = isWeek
    ? series.reduce((s, d) => s + d.in, 0)
    : monthIncome();
  const net = inc - spent;
  const octRef = new Date(2026, 9, 1);
  const octSpent = monthSpent(octRef);
  const diffOct = spent - octSpent;

  const pct = Math.round((monthSpent() / state.monthlyBudget) * 100);
  const filledCells = Math.min(10, Math.round(pct / 10));
  const daysLeft = 30 - TODAY.getDate();

  const maxBar = Math.max(1, ...series.flatMap((d) => [d.in, d.out]));
  const cats = spendingByCategory();
  const totalCat = cats.reduce((s, [, a]) => s + a, 0) || 1;
  const segPalette = [
    { bg: "var(--red)", pat: "" },
    { bg: "var(--blue)", pat: "var(--pat-hatch)" },
    { bg: "var(--sunflower)", pat: "var(--pat-dots)" },
    { bg: "var(--teal)", pat: "" },
    { bg: "var(--lilac)", pat: "var(--pat-hatch)" },
    { bg: "var(--mango)", pat: "" },
  ];

  // Ledger filtering
  const filteredLedger = TRANSACTIONS.filter((t) => {
    if (state.ledgerFilter === "expense" && !isExpense(t)) return false;
    if (state.ledgerFilter === "income" && !isIncome(t)) return false;
    if (state.ledgerFilter === "transfer" && !isTransfer(t)) return false;
    if (state.ledgerFilter === "adjust" && !isAdjust(t)) return false;
    if (state.ledgerWallet !== "all" && t.wallet !== state.ledgerWallet && t.to !== state.ledgerWallet) return false;
    if (state.ledgerSearch.trim()) {
      const q = state.ledgerSearch.trim().toLowerCase();
      const hay = `${t.title} ${t.kind} ${t.note || ""} ${walletById(t.wallet)?.name || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const shown = filteredLedger.slice(0, state.ledgerLimit);
  const groups = [];
  shown.forEach((t) => {
    const lbl = dayLabel(txDate(t));
    const last = groups[groups.length - 1];
    if (!last || last.lbl !== lbl) groups.push({ lbl, items: [t] });
    else last.items.push(t);
  });

  const selBar = state.selectedChartIdx !== null && series[state.selectedChartIdx]
    ? series[state.selectedChartIdx]
    : null;

  return `
    <div class="screen-anim">
      <div class="topbar">
        <div>
          <div class="sec-kicker">GALAW NG PERA</div>
          <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.03em">Activity</h1>
        </div>
        <div class="seg-switch" role="tablist" aria-label="Range">
          <button type="button" class="seg-btn ${!isWeek ? "is-active" : ""}" data-range="month">Month</button>
          <button type="button" class="seg-btn ${isWeek ? "is-active" : ""}" data-range="week">Week</button>
        </div>
      </div>

      <!-- Red Plate Spending Hero -->
      <section class="spend-hero">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span class="signboard-kicker">${isWeek ? "GASTOS · LAST 7 DAYS" : "GASTOS NGAYONG BUWAN · NOV"}</span>
          <button type="button" class="btn btn-sm" style="min-height:30px;padding:4px 9px;background:#FFFBF0;color:#151413" data-go="activity/budgets">
            Budgets →
          </button>
        </div>
        <div class="spend-hero-num tnum">${esc(maskMoney(fmt(spent)))}</div>
        <div class="kicker" style="color:#FFFBF0">
          ${isWeek
            ? `7-DAY OUTFLOW · NOV TOTAL ${esc(maskMoney(fmt(monthSpent())))}`
            : `${diffOct >= 0 ? "+" : "−"}${esc(maskMoney(fmt(Math.abs(diffOct))))} VS OCTOBER (${esc(maskMoney(fmt(octSpent)))})`}
        </div>
      </section>

      <!-- Budget Pace Fuel Gauge -->
      <section class="plate fuel-plate">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <div>
            <span class="sec-kicker">MONTHLY BUDGET PACE</span>
            <div style="font-size:16px;font-weight:800" class="tnum">
              ${esc(maskMoney(fmt(monthSpent(), { cents: false })))} / ${esc(maskMoney(fmt(state.monthlyBudget, { cents: false })))}
            </div>
          </div>
          <span class="tilt-sticker ${pct >= 100 ? "is-over" : ""}">${pct}% · ${daysLeft} ARAW PA</span>
        </div>
        <div class="fuel-gauge" aria-label="Budget used ${pct} percent">
          ${Array.from({ length: 10 }, (_, i) => {
            let cls = "";
            if (i < filledCells) cls = pct >= 100 ? "is-hot" : pct >= 80 ? "is-warn" : "is-on";
            return `<span class="fuel-cell ${cls}"></span>`;
          }).join("")}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted)">
          <span>${daysLeft} DAYS LEFT IN NOV</span>
          <button type="button" class="btn btn-sm" style="min-height:30px;padding:3px 10px" data-go="sheet/budget">Edit limit</button>
        </div>
      </section>

      <!-- Money-Flow Summary Trio -->
      <div class="flow-trio">
        <div class="flow-box">
          <div class="kicker" style="color:var(--green)">+ PASOK IN</div>
          <div class="flow-box-val tnum">${esc(maskMoney(fmtCompact(inc)))}</div>
        </div>
        <div class="flow-box">
          <div class="kicker" style="color:var(--red)">− LABAS OUT</div>
          <div class="flow-box-val tnum">${esc(maskMoney(fmtCompact(spent)))}</div>
        </div>
        <div class="flow-box">
          <div class="kicker" style="color:var(--ink-muted)">NET FLOW</div>
          <div class="flow-box-val tnum">${esc(maskMoney((net >= 0 ? "+" : "−") + fmtCompact(Math.abs(net))))}</div>
        </div>
      </div>

      <!-- Chunky In vs Out Bar Chart -->
      <section class="plate chart-plate">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
          <div>
            <span class="sec-kicker">MONEY IN VS SPENDING</span>
            <div style="font-size:15px;font-weight:800">
              ${selBar
                ? `${isWeek ? selBar.label : "Nov " + selBar.day}: In ${maskMoney(fmt(selBar.in, { cents: false }))} · Out ${maskMoney(fmt(selBar.out, { cents: false }))}`
                : "Tap any bar for details"}
            </div>
          </div>
          <div style="display:flex;gap:8px;font-family:var(--font-mono);font-size:9.5px;font-weight:700">
            <span style="display:inline-flex;align-items:center;gap:4px">
              <span style="width:10px;height:10px;border:1.5px solid var(--stroke);background:var(--pat-hatch-blue);display:inline-block"></span>IN
            </span>
            <span style="display:inline-flex;align-items:center;gap:4px">
              <span style="width:10px;height:10px;border:1.5px solid var(--stroke);background:var(--red);display:inline-block"></span>OUT
            </span>
          </div>
        </div>

        <div class="chart-bars-wrap">
          ${series.map((d, i) => {
            const hIn = d.in > 0 ? Math.max(8, Math.round((d.in / maxBar) * 100)) : 0;
            const hOut = d.out > 0 ? Math.max(8, Math.round((d.out / maxBar) * 100)) : 0;
            const sel = state.selectedChartIdx === i ? "is-selected" : "";
            return `
              <button type="button" class="chart-col ${sel}" data-chart-idx="${i}" aria-label="${isWeek ? d.label : "Nov " + d.day} In ${fmt(d.in)} Out ${fmt(d.out)}">
                ${hIn ? `<span class="chart-bar is-in" style="height:${hIn}%"></span>` : ""}
                ${hOut ? `<span class="chart-bar is-out" style="height:${hOut}%"></span>` : `<span style="width:4px;height:2px;background:var(--stroke);opacity:0.2"></span>`}
              </button>
            `;
          }).join("")}
        </div>
        <div class="chart-axis">
          <span>${isWeek ? series[0].label : "Nov 1"}</span>
          <span>${isWeek ? series[3].label : "Nov 12"}</span>
          <span>${isWeek ? series[6].label : "Nov 24"} · MAX ${esc(maskMoney(fmtCompact(maxBar)))}</span>
        </div>
      </section>

      <!-- Categories Jeepney Stripe Breakdown -->
      <section class="plate" style="padding:14px;margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <span class="sec-kicker">CATEGORIES BREAKDOWN</span>
            <h2 class="sec-title" style="font-size:16px">Jeepney Route Stripe</h2>
          </div>
          <button type="button" class="sec-link pressable-sm" data-go="activity/budgets">Limits</button>
        </div>
        ${(() => {
          const top5 = cats.slice(0, 5);
          const restAmt = cats.slice(5).reduce((s, [, a]) => s + a, 0);
          const stripeItems = restAmt > 0 ? [...top5, ["Other", restAmt]] : top5;
          return `
            <div class="jeep-stripe" role="img" aria-label="Category spending breakdown">
              ${stripeItems.map(([cat, amt], i) => {
                const pctW = (amt / totalCat) * 100;
                const st = segPalette[i % segPalette.length];
                return `<div class="jeep-seg" title="${esc(cat)} ${fmt(amt)}" style="width:${pctW.toFixed(2)}%;background-color:${st.bg};${st.pat ? "background-image:" + st.pat + ";" : ""}"></div>`;
              }).join("")}
            </div>
          `;
        })()}
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
          ${cats.slice(0, 5).map(([cat, amt], i) => {
            const st = segPalette[i % segPalette.length];
            const limit = CATEGORY_LIMITS[cat];
            const ratio = limit ? Math.round((amt / limit) * 100) : null;
            return `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px">
                <div style="display:flex;align-items:center;gap:8px;min-width:0">
                  <span style="width:14px;height:14px;border:2px solid var(--stroke);border-radius:3px;flex-shrink:0;background-color:${st.bg};${st.pat ? "background-image:" + st.pat + ";" : ""}"></span>
                  <span style="font-weight:800">${esc(cat)}</span>
                  ${ratio && ratio >= 85 ? `<span class="tilt-sticker ${ratio >= 100 ? "is-over" : ""}" style="font-size:9px">${ratio}% NA!</span>` : ""}
                </div>
                <span class="mono tnum" style="font-weight:700;font-size:12px">${esc(maskMoney(fmt(amt)))}</span>
              </div>
            `;
          }).join("")}
        </div>
      </section>

      <!-- Ledger Controls + Export CSV -->
      <div class="sec-head">
        <div class="sec-title-wrap">
          <span class="sec-kicker">BUONG LISTAHAN</span>
          <h2 class="sec-title">Ledger (${filteredLedger.length})</h2>
        </div>
        <button type="button" class="btn btn-sm csv-btn" id="btn-export-csv">
          ${icon("download", 14)}
          <span>Export CSV</span>
        </button>
      </div>

      <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px">
        ${[["all","All"],["expense","Expenses"],["income","Income"],["transfer","Transfers"],["adjust","Adjusted"]].map(([k, lbl]) => `
          <button type="button" class="chip ${state.ledgerFilter === k ? "is-active" : ""}" data-lfilter="${k}">${lbl}</button>
        `).join("")}
      </div>

      <div style="display:grid;grid-template-columns:1fr 124px;gap:8px;margin-bottom:12px">
        <input class="input" id="ledger-search-input" type="search" placeholder="Search title, note..." value="${esc(state.ledgerSearch)}" aria-label="Search ledger" />
        <select class="input" id="ledger-wallet-select" aria-label="Filter by wallet">
          <option value="all">All wallets</option>
          ${WALLETS.map((w) => `<option value="${esc(w.id)}" ${state.ledgerWallet === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}

      ${groups.length ? groups.map((g) => `
        <div style="margin-bottom:12px">
          <div class="kicker" style="color:var(--ink-muted);margin:8px 0 6px">${esc(g.lbl)}</div>
          <div class="tx-list">
            ${g.items.map((t) => renderTxRow(t, true)).join("")}
          </div>

        </button>
      ` : ""}
    </div>
  `;
}

function renderZigZagSvg(flip = false) {
  const pts = [];
  for (let i = 0; i <= 24; i++) {
    const x = (i / 24) * 360;
    const y = flip ? (i % 2 === 0 ? 0 : 11) : (i % 2 === 0 ? 12 : 1);
    pts.push(`${x.toFixed(1)},${y}`);
  }
  const poly = flip ? `0,0 ${pts.join(" ")} 360,0` : `0,12 ${pts.join(" ")} 360,12`;
  return `
    <svg class="receipt-edge" viewBox="0 0 360 12" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="${poly}" fill="#FFFBF0"/>
      <polyline points="${pts.join(" ")}" fill="none" stroke="#151413" stroke-width="2"/>
    </svg>
  `;
}

function renderBarcodeSvg(seedStr) {
  let hash = 2166136261;
  for (let i = 0; i < seedStr.length; i++) {
    hash ^= seedStr.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  let x = 4;
  const bars = [];
  for (let i = 0; i < 42; i++) {
    hash = (hash * 1664525 + 1013904223) >>> 0;
    const w = (hash % 3) + 1.5;
    if (i % 2 === 0) bars.push(`<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="34" fill="#151413"/>`);
    x += w + 2.2;
    if (x > 256) break;
  }
  return `<svg width="260" height="36" viewBox="0 0 260 36" aria-hidden="true" style="display:block;margin:8px auto 4px">${bars.join("")}</svg>`;
}

/* ==========================================================================
   MASTER RENDER & HASH ROUTER
   ========================================================================== */
function renderApp() {
  readQueryOverrides();
  applyThemeAttrs();

  const scrollEl = document.getElementById("screen-root");
  const noNav = ["intro", "lock", "auth"].includes(state.route);
  scrollEl.classList.toggle("no-nav-pad", noNav);

  let html = "";
  if (state.route === "intro") html = renderScreenIntro();
  else if (state.route === "lock") html = renderScreenLock();
  else if (state.route === "auth") html = renderScreenAuth();
  else if (state.route === "home") html = renderScreenHome();
  else if (state.route === "empty") html = renderScreenEmpty();
  else if (state.route === "wallets") html = renderScreenWallets();
  else if (state.route === "wallet") html = renderScreenWalletDetail(state.param);
  else if (state.route === "activity") html = renderScreenActivity();
  else if (state.route === "budgets") html = renderScreenBudgets();
  else if (state.route === "settings") html = renderScreenSettings();
  else html = renderScreenHome();

  scrollEl.innerHTML = html;
  scrollEl.scrollTop = 0;

  renderNav();
  renderSheet();
}

function go(hashPath) {
  state.plusOpen = false;
  const clean = hashPath.replace(/^#?\/?/, "");
  if (window.location.hash !== `#/${clean}`) {
    window.location.hash = `#/${clean}`;
  } else {
    handleHash();
  }
}

function closeSheet() {
  state.sheet = null;
  state.sheetParam = null;
  state.txDraft = null;
  state.transferDraft = null;
  state.updateDraft = null;
  state.addWalletDraft = null;
  state.editWalletDraft = null;
  state.editTxDraft = null;
  state.schedDraft = null;
  state.favDraft = null;
  const fallback = state.parentParam ? `${state.parentRoute}/${state.parentParam}` : state.parentRoute;
  go(fallback || "home");
}

function handleHash() {
  clearTimeout(introTimer);
  const raw = window.location.hash.replace(/^#?\/?/, "").split("?")[0];
  const parts = raw.split("/").filter(Boolean);

  if (!parts.length || parts[0] === "intro") {
    state.route = "intro";
    state.sheet = null;
    renderApp();
    introTimer = setTimeout(() => {
      if (state.route === "intro") go(state.appLockEnabled ? "lock" : "home");
    }, 1650);
    return;
  }

  if (parts[0] === "sheet") {
    const type = parts[1];
    const p2 = parts[2] ? decodeURIComponent(parts[2]) : null;
    // Set natural parent route if coming directly to a sheet URL
    if (!["home", "wallets", "wallet", "activity", "budgets", "settings", "empty"].includes(state.route)) {
      state.route = type === "budget" || type === "category-budget" ? "budgets"
        : type === "edit-wallet" ? "wallets"
        : type === "profile" || type === "pin" ? "settings"
        : "home";
    }
    state.parentRoute = state.route;
    state.parentParam = state.param;
    state.sheet = type;
    state.sheetParam = p2;
    if (type === "add-tx" && !state.txDraft) ensureTxDraft("expense");
    if (type === "add-income" && !state.txDraft) ensureTxDraft("income");
    if (type === "pin") state.pinDraft = { step: "current", firstPin: "", buf: "" };
    renderApp();
    return;
  }

  state.sheet = null;
  state.sheetParam = null;
  state.plusOpen = false;

  if (parts[0] === "lock") { state.route = "lock"; state.pinBuffer = ""; }
  else if (parts[0] === "auth") { state.route = "auth"; }
  else if (parts[0] === "home") { state.route = "home"; }
  else if (parts[0] === "empty") { state.route = "empty"; }
  else if (parts[0] === "wallets") { state.route = "wallets"; }
  else if (parts[0] === "wallet") { state.route = "wallet"; state.param = parts[1] || WALLETS[0]?.id; }
  else if (parts[0] === "activity" && parts[1] === "budgets") { state.route = "budgets"; }
  else if (parts[0] === "activity") { state.route = "activity"; }
  else if (parts[0] === "settings") { state.route = "settings"; }
  else { state.route = "home"; }

  state.parentRoute = state.route;
  state.parentParam = state.param;
  renderApp();
}

/* ==========================================================================
   MUTATIONS & ACTIONS
   ========================================================================== */
function tryPinDigit(d) {
  if (state.pinBuffer.length >= 4) return;
  state.pinBuffer += d;
  renderApp();
  if (state.pinBuffer.length === 4) {
    const ok = state.pinBuffer === state.pinCode || state.pinHintExtra;
    if (ok) {
      setTimeout(() => {
        state.pinBuffer = "";
        state.pinHintExtra = false;
        showToast("Maligayang pagdating! Unlocked");
        go("home");
      }, 150);
    } else {
      state.pinShake = true;
      state.pinHintExtra = true;
      renderApp();
      setTimeout(() => {
        state.pinShake = false;
        state.pinBuffer = "";
        renderApp();
      }, 420);
    }
  }
}

function calcKeyPress(val) {
  const d = ensureTxDraft();
  let s = d.amountStr;
  if (val === "back") {
    s = s.length <= 1 ? "0" : s.slice(0, -1);
  } else if (val === ".") {
    if (!s.includes(".")) s += ".";
  } else {
    if (s === "0") s = val;
    else {
      const dec = s.split(".")[1];
      if (!dec || dec.length < 2) s += val;
    }
  }
  d.amountStr = s;
  const disp = document.querySelector("[data-qa=calc-display]");
  if (disp) disp.textContent = "₱" + s;
}

function saveNewTransaction() {
  const d = ensureTxDraft();
  const noteEl = document.getElementById("tx-note");
  const dateEl = document.getElementById("tx-date");
  const favEl = document.getElementById("tx-save-fav");
  if (noteEl) d.note = noteEl.value.trim();
  if (dateEl) d.date = dateEl.value;
  if (favEl) d.saveFav = favEl.checked;

  const amt = parseFloat(d.amountStr);
  if (!amt || amt <= 0) { showToast("Enter an amount > ₱0"); return; }

  const isInc = d.direction === "income";
  const signed = isInc ? amt : -amt;
  const w = walletById(d.wallet) || WALLETS[0];
  if (w) w.balance = Math.round((w.balance + signed) * 100) / 100;

  const newTx = {
    id: "t" + Date.now().toString(36),
    title: d.note || d.category,
    kind: d.category,
    wallet: w ? w.id : "gcash",
    amount: signed,
    at: `${d.date || "2026-11-24"}T19:05`,
    note: d.note || undefined,
    localOnly: true,
  };
  TRANSACTIONS.unshift(newTx);

  if (d.saveFav) {
    FAVORITES.push({
      id: "f" + Date.now().toString(36),
      name: d.note || d.category,
      direction: d.direction,
      category: d.category,
      wallet: newTx.wallet,
      defaultAmount: amt,
    });
  }

  state.txDraft = null;
  state.parentRoute = "home";
  state.parentParam = null;
  showToast(isInc ? "Money in saved · Kita!" : "Expense saved · Gastos!");
  closeSheet();
}

function recordSchedule(id) {
  const s = SCHEDULES.find((x) => x.id === id);
  if (!s) return;
  const w = walletById(s.wallet) || WALLETS[0];
  const signed = s.direction === "income" ? s.amount : -s.amount;
  if (w) w.balance = Math.round((w.balance + signed) * 100) / 100;

  TRANSACTIONS.unshift({
    id: "t" + Date.now().toString(36),
    title: s.title,
    kind: s.category,
    wallet: w ? w.id : s.wallet,
    amount: signed,
    at: "2026-11-24T19:05",
    note: "Recorded from Biyahe schedule",
    localOnly: true,
  });

  // Advance next due date
  const dt = new Date(s.due + "T00:00:00");
  if (s.repeat === "weekly") dt.setDate(dt.getDate() + 7);
  else if (s.repeat === "biweekly") dt.setDate(dt.getDate() + 14);
  else dt.setMonth(dt.getMonth() + 1);
  s.due = dt.toISOString().slice(0, 10);

  showToast(`Recorded: ${s.title}`);
  renderApp();
}

function exportCsv() {
  const rows = [["ID", "Date", "Title", "Kind", "Wallet", "To", "Amount", "Note"]];
  TRANSACTIONS.forEach((t) => {
    rows.push([
      t.id,
      t.at,
      `"${(t.title || "").replace(/"/g, '""')}"`,
      t.kind,
      walletById(t.wallet)?.name || t.wallet,
      t.to ? (walletById(t.to)?.name || t.to) : "",
      t.amount.toFixed(2),
      `"${(t.note || "").replace(/"/g, '""')}"`,
    ]);
  });
  const csv = rows.map((r) => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pitaka-jeepney-export-2026-11.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("CSV Receipt Exported!");
}

function resetDemoData() {
  Object.assign(PROFILE, JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.profile)));
  WALLETS.splice(0, WALLETS.length, ...JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.wallets)));
  TRANSACTIONS.splice(0, TRANSACTIONS.length, ...JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.transactions)));
  FAVORITES.splice(0, FAVORITES.length, ...JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.favorites)));
  SCHEDULES.splice(0, SCHEDULES.length, ...JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.schedules)));
  Object.keys(CATEGORY_LIMITS).forEach((k) => delete CATEGORY_LIMITS[k]);
  Object.assign(CATEGORY_LIMITS, JSON.parse(JSON.stringify(INITIAL_SNAPSHOT.categoryLimits)));
  state.monthlyBudget = INITIAL_SNAPSHOT.monthlyBudget;
  state.hideBalances = false;
  state.theme = "light";
  state.accent = "sunflower";
  state.reorderMode = false;
  showToast("Demo data restored!");
  go("home");
}

/* ==========================================================================
   EVENT DELEGATION
   ========================================================================== */
document.addEventListener("click", (e) => {
  const t = e.target;

  // Intro skip
  if (t.closest("#intro-skip-area")) {
    go(state.appLockEnabled ? "lock" : "home");
    return;
  }

  // FAB toggle
  if (t.closest("#btn-fab")) {
    state.plusOpen = !state.plusOpen;
    renderNav();
    return;
  }
  if (t.closest("#fab-backdrop")) {
    state.plusOpen = false;
    renderNav();
    return;
  }
  const fabGo = t.closest("[data-fab-go]");
  if (fabGo) {
    state.plusOpen = false;
    go(fabGo.dataset.fabGo);
    return;
  }

  // Generic navigation
  const goBtn = t.closest("[data-go]");
  if (goBtn) {
    go(goBtn.dataset.go);
    return;
  }

  // Close sheet
  if (t.closest("[data-close-sheet]") || t.id === "sheet-backdrop") {
    closeSheet();
    return;
  }

  // Lock screen PIN
  const pinKey = t.closest("[data-pin-key]");
  if (pinKey) { tryPinDigit(pinKey.dataset.pinKey); return; }
  if (t.closest("[data-pin-back]")) {
    state.pinBuffer = state.pinBuffer.slice(0, -1);
    renderApp();
    return;
  }
  if (t.closest("[data-pin-bio]")) {
    showToast("Biometric matched · Pasok!");
    go("home");
    return;
  }

  // Auth mode switch
  const authMode = t.closest("[data-auth-mode]");
  if (authMode) { state.authMode = authMode.dataset.authMode; renderApp(); return; }

  // Hide balances toggle
  if (t.closest("[data-toggle-hide]") || t.closest("#sw-hide")) {
    state.hideBalances = !state.hideBalances;
    showToast(state.hideBalances ? "Balances hidden" : "Balances visible");
    renderApp();
    return;
  }

  // Theme & Accent
  if (t.closest("#sw-theme")) {
    state.theme = state.theme === "dark" ? "light" : "dark";
    showToast(state.theme === "dark" ? "Gabi sa Kalye (Dark)" : "Araw sa Kalye (Light)");
    renderApp();
    return;
  }
  const accBtn = t.closest("[data-set-accent]");
  if (accBtn) {
    state.accent = accBtn.dataset.setAccent;
    showToast(`Accent: ${SPOT_COLORS[state.accent].label}`);
    renderApp();
    return;
  }
  if (t.closest("#sw-lock")) {
    state.appLockEnabled = !state.appLockEnabled;
    renderApp();
    return;
  }
  if (t.closest("#sw-bio")) {
    state.biometricEnabled = !state.biometricEnabled;
    renderApp();
    return;
  }
  if (t.closest("#btn-sync-now")) {
    state.syncing = true;
    renderApp();
    setTimeout(() => {
      state.syncing = false;
      PROFILE.lastSyncedAt = "Just now";
      showToast("Backup synced to cloud");
      renderApp();
    }, 650);
    return;
  }
  if (t.closest("#btn-reset-demo") || t.closest("#btn-restore-demo")) {
    resetDemoData();
    return;
  }

  // Home favorite quick-add
  const favAdd = t.closest("[data-fav-add]");
  if (favAdd) {
    const f = FAVORITES.find((x) => x.id === favAdd.dataset.favAdd);
    if (f) {
      state.txDraft = {
        direction: f.direction,
        amountStr: f.defaultAmount ? String(f.defaultAmount) : "0",
        category: f.category,
        wallet: f.wallet,
        note: f.name,
        date: "2026-11-24",
        saveFav: false,
      };
      go("sheet/add-tx");
    }
    return;
  }

  // Record schedule
  const recSched = t.closest("[data-record-sched]");
  if (recSched) { recordSchedule(recSched.dataset.recordSched); return; }

  // Open transaction receipt
  const openTx = t.closest("[data-open-tx]");
  if (openTx) { go(`sheet/tx/${openTx.dataset.openTx}`); return; }

  // Wallets reorder
  if (t.closest("[data-toggle-reorder]")) {
    state.reorderMode = !state.reorderMode;
    state.liftedWalletId = null;
    renderApp();
    return;
  }
  const liftW = t.closest("[data-lift-wallet]");
  if (liftW && state.reorderMode) {
    const id = liftW.dataset.liftWallet;
    state.liftedWalletId = state.liftedWalletId === id ? null : id;
    renderApp();
    return;
  }
  const moveW = t.closest("[data-move-wallet]");
  if (moveW) {
    const [id, dirStr] = moveW.dataset.moveWallet.split(":");
    const idx = WALLETS.findIndex((w) => w.id === id);
    const next = idx + parseInt(dirStr, 10);
    if (idx >= 0 && next >= 0 && next < WALLETS.length) {
      const [item] = WALLETS.splice(idx, 1);
      WALLETS.splice(next, 0, item);
      state.liftedWalletId = id;
      renderApp();
    }
    return;
  }

  // Wallet detail actions & filters
  const wf = t.closest("[data-wfilter]");
  if (wf) { state.walletFilter = wf.dataset.wfilter; renderApp(); return; }
  const openUpd = t.closest("[data-open-update]");
  if (openUpd) {
    state.updateDraft = { wallet: openUpd.dataset.openUpdate, mode: "set", amount: "", note: "Manual tally" };
    go("sheet/update");
    return;
  }
  const openTr = t.closest("[data-open-transfer]");
  if (openTr) {
    const other = WALLETS.find((w) => w.id !== openTr.dataset.openTransfer)?.id || openTr.dataset.openTransfer;
    state.transferDraft = { from: openTr.dataset.openTransfer, to: other, amount: "1000", fee: "0", note: "" };
    go("sheet/transfer");
    return;
  }

  // Activity controls
  const rng = t.closest("[data-range]");
  if (rng) { state.activityRange = rng.dataset.range; state.selectedChartIdx = null; renderApp(); return; }
  const cIdx = t.closest("[data-chart-idx]");
  if (cIdx) {
    const i = parseInt(cIdx.dataset.chartIdx, 10);
    state.selectedChartIdx = state.selectedChartIdx === i ? null : i;
    renderApp();
    return;
  }
  const lf = t.closest("[data-lfilter]");
  if (lf) { state.ledgerFilter = lf.dataset.lfilter; state.ledgerLimit = 12; renderApp(); return; }
  if (t.closest("#btn-load-more")) { state.ledgerLimit += 12; renderApp(); return; }
  if (t.closest("#btn-export-csv")) { exportCsv(); return; }

  // Add Tx Sheet interactions
  const txDir = t.closest("[data-tx-dir]");
  if (txDir) {
    const d = ensureTxDraft();
    d.direction = txDir.dataset.txDir;
    d.category = d.direction === "income" ? "Salary" : "Food";
    renderSheet();
    return;
  }
  const calc = t.closest("[data-calc]");
  if (calc) { calcKeyPress(calc.dataset.calc); return; }
  const calcAdd = t.closest("[data-calc-add]");
  if (calcAdd) {
    const d = ensureTxDraft();
    const cur = parseFloat(d.amountStr) || 0;
    d.amountStr = String(cur + parseFloat(calcAdd.dataset.calcAdd));
    const disp = document.querySelector("[data-qa=calc-display]");
    if (disp) disp.textContent = "₱" + d.amountStr;
    return;
  }
  const txWal = t.closest("[data-tx-wallet]");
  if (txWal) { ensureTxDraft().wallet = txWal.dataset.txWallet; renderSheet(); return; }
  const txCat = t.closest("[data-tx-cat]");
  if (txCat) { ensureTxDraft().category = txCat.dataset.txCat; renderSheet(); return; }
  if (t.closest("#btn-save-tx")) { saveNewTransaction(); return; }

  // Transfer Sheet
  const trFrom = t.closest("[data-tr-from]");
  if (trFrom) { state.transferDraft.from = trFrom.dataset.trFrom; renderSheet(); return; }
  const trTo = t.closest("[data-tr-to]");
  if (trTo) { state.transferDraft.to = trTo.dataset.trTo; renderSheet(); return; }
  if (t.closest("#btn-save-transfer")) {
    const d = state.transferDraft;
    const amt = parseFloat(document.getElementById("tr-amount").value) || 0;
    const fee = parseFloat(document.getElementById("tr-fee").value) || 0;
    const note = document.getElementById("tr-note").value.trim();
    if (d.from === d.to) { showToast("Choose two different wallets"); return; }
    if (amt <= 0) { showToast("Enter transfer amount"); return; }
    const fw = walletById(d.from);
    const tw = walletById(d.to);
    if (fw) fw.balance = Math.round((fw.balance - amt - fee) * 100) / 100;
    if (tw) tw.balance = Math.round((tw.balance + amt) * 100) / 100;
    TRANSACTIONS.unshift({
      id: "t" + Date.now().toString(36),
      title: `${fw?.name || d.from} to ${tw?.name || d.to}`,
      kind: "Transfer",
      wallet: d.from,
      to: d.to,
      amount: -amt,
      at: "2026-11-24T19:05",
      note: note || (fee > 0 ? `Fee ₱${fee.toFixed(2)}` : undefined),
      localOnly: true,
    });
    showToast("Transfer complete · Lipat!");
    closeSheet();
    return;
  }

  // Update Balance Sheet
  const updWal = t.closest("[data-upd-wallet]");
  if (updWal) { state.updateDraft.wallet = updWal.dataset.updWallet; renderSheet(); return; }
  const updMode = t.closest("[data-upd-mode]");
  if (updMode) { state.updateDraft.mode = updMode.dataset.updMode; renderSheet(); return; }
  if (t.closest("#btn-save-update")) {
    const d = state.updateDraft;
    const w = walletById(d.wallet);
    const raw = parseFloat(document.getElementById("upd-amount").value);
    const note = document.getElementById("upd-note").value.trim();
    if (!w || isNaN(raw)) { showToast("Enter a valid amount"); return; }
    let delta = 0;
    if (d.mode === "add") delta = raw;
    else if (d.mode === "sub") delta = -raw;
    else delta = raw - w.balance;
    w.balance = Math.round((w.balance + delta) * 100) / 100;
    TRANSACTIONS.unshift({
      id: "t" + Date.now().toString(36),
      title: "Balance adjustment",
      kind: "Updated",
      wallet: w.id,
      amount: Math.round(delta * 100) / 100,
      at: "2026-11-24T19:05",
      note: note || undefined,
      localOnly: true,
    });
    showToast("Balance updated");
    closeSheet();
    return;
  }

  // Add Wallet Sheet
  const awPre = t.closest("[data-aw-preset]");
  if (awPre) {
    const [p, grp] = awPre.dataset.awPreset.split(":");
    state.addWalletDraft.preset = p;
    state.addWalletDraft.type = grp;
    state.addWalletDraft.name = p;
    renderSheet();
    return;
  }
  const awSpot = t.closest("[data-aw-spot]");
  if (awSpot) { state.addWalletDraft.spot = awSpot.dataset.awSpot; renderSheet(); return; }
  if (t.closest("#btn-create-wallet")) {
    const name = document.getElementById("aw-name").value.trim();
    const acct = document.getElementById("aw-acct").value.trim() || "Personal";
    const bal = parseFloat(document.getElementById("aw-bal").value) || 0;
    if (!name) { showToast("Enter wallet name"); return; }
    const slug = name.toLowerCase().replace(/[^a-z0-9]/g, "");
    WALLETS.push({
      id: slug + "_" + Date.now().toString(36).slice(-3),
      name,
      type: state.addWalletDraft.type || "E-wallet",
      account: acct,
      balance: bal,
      mark: name.slice(0, 2).toUpperCase(),
      logo: LOGOS[slug] ? slug : null,
      spot: state.addWalletDraft.spot,
      number: "•••• " + Math.floor(1000 + Math.random() * 8999),
    });
    state.parentRoute = "wallets";
    state.parentParam = null;
    showToast(`${name} ticket issued!`);
    closeSheet();
    return;
  }

  // Edit Wallet Sheet
  const ewSpot = t.closest("[data-ew-spot]");
  if (ewSpot) { state.editWalletDraft.spot = ewSpot.dataset.ewSpot; renderSheet(); return; }
  if (t.closest("#btn-save-edit-wallet")) {
    const w = walletById(state.editWalletDraft.id);
    if (w) {
      w.name = document.getElementById("ew-name").value.trim() || w.name;
      w.account = document.getElementById("ew-acct").value.trim() || w.account;
      w.number = document.getElementById("ew-num").value.trim() || w.number;
      w.spot = state.editWalletDraft.spot;
    }
    showToast("Wallet ticket updated");
    closeSheet();
    return;
  }

  // Receipt Quick Actions
  const mkFav = t.closest("[data-tx-make-fav]");
  if (mkFav) {
    const tx = TRANSACTIONS.find((x) => x.id === mkFav.dataset.txMakeFav);
    if (tx) {
      FAVORITES.push({
        id: "f" + Date.now().toString(36),
        name: tx.title,
        direction: tx.amount > 0 ? "income" : "expense",
        category: tx.kind,
        wallet: tx.wallet,
        defaultAmount: Math.abs(tx.amount),
      });
      showToast("Saved to Home Favorites!");
    }
    return;
  }
  const mkSched = t.closest("[data-tx-make-sched]");
  if (mkSched) {
    const tx = TRANSACTIONS.find((x) => x.id === mkSched.dataset.txMakeSched);
    if (tx) {
      state.schedDraft = {
        id: null,
        title: tx.title,
        amount: String(Math.abs(tx.amount)),
        direction: tx.amount > 0 ? "income" : "expense",
        category: tx.kind,
        wallet: tx.wallet,
        due: "2026-12-01",
        repeat: "monthly",
        reminder: true,
      };
      go("sheet/schedule-edit");
    }
    return;
  }

  // Save Edit Tx
  if (t.closest("#btn-save-edit-tx")) {
    const tx = TRANSACTIONS.find((x) => x.id === state.editTxDraft.id);
    if (tx) {
      const newTitle = document.getElementById("etx-title").value.trim() || tx.title;
      const newAmtAbs = Math.abs(parseFloat(document.getElementById("etx-amt").value) || Math.abs(tx.amount));
      const sign = tx.amount < 0 ? -1 : 1;
      const newSigned = sign * newAmtAbs;
      const delta = newSigned - tx.amount;
      const w = walletById(tx.wallet);
      if (w) w.balance = Math.round((w.balance + delta) * 100) / 100;
      tx.title = newTitle;
      tx.amount = newSigned;
      const catEl = document.getElementById("etx-cat");
      if (catEl) tx.kind = catEl.value;
      tx.note = document.getElementById("etx-note").value.trim() || undefined;
      const dtEl = document.getElementById("etx-date");
      if (dtEl && dtEl.value) tx.at = `${dtEl.value}T${tx.at.slice(11) || "12:00"}`;
    }
    showToast("Transaction updated");
    closeSheet();
    return;
  }

  // Delete confirmation flow
  const askDel = t.closest("[data-ask-delete]");
  if (askDel) {
    const [type, id] = askDel.dataset.askDelete.split(":");
    let label = id;
    if (type === "tx") {
      const tx = TRANSACTIONS.find((x) => x.id === id);
      label = tx ? `${tx.title} (${fmt(tx.amount)})` : id;
    } else if (type === "wallet") {
      const w = walletById(id);
      label = w ? `${w.name} (${fmt(w.balance)})` : id;
    } else if (type === "sched") {
      const s = SCHEDULES.find((x) => x.id === id);
      label = s ? `${s.title} (${fmt(s.amount)})` : id;
    }
    state.pendingDelete = { type, id, label };
    go("sheet/confirm-delete");
    return;
  }
  if (t.closest("#btn-confirm-delete")) {
    const pd = state.pendingDelete;
    if (pd) {
      if (pd.type === "tx") {
        const idx = TRANSACTIONS.findIndex((x) => x.id === pd.id);
        if (idx >= 0) {
          const [tx] = TRANSACTIONS.splice(idx, 1);
          const w = walletById(tx.wallet);
          if (w) w.balance = Math.round((w.balance - tx.amount) * 100) / 100;
          if (tx.to) {
            const tw = walletById(tx.to);
            if (tw) tw.balance = Math.round((tw.balance - Math.abs(tx.amount)) * 100) / 100;
          }
        }
      } else if (pd.type === "wallet") {
        const idx = WALLETS.findIndex((w) => w.id === pd.id);
        if (idx >= 0) WALLETS.splice(idx, 1);
        state.parentRoute = WALLETS.length ? "wallets" : "empty";
        state.parentParam = null;
      } else if (pd.type === "sched") {
        const idx = SCHEDULES.findIndex((s) => s.id === pd.id);
        if (idx >= 0) SCHEDULES.splice(idx, 1);
      }
      state.pendingDelete = null;
      showToast("Deleted");
    }
    closeSheet();
    return;
  }

  // Schedules editor
  if (t.closest("[data-new-sched]")) {
    state.schedDraft = { id: null, title: "", amount: "", direction: "expense", category: "Bills", wallet: WALLETS[0]?.id || "gcash", due: "2026-12-01", repeat: "monthly", reminder: true };
    go("sheet/schedule-edit");
    return;
  }
  const editSched = t.closest("[data-edit-sched]");
  if (editSched) {
    const s = SCHEDULES.find((x) => x.id === editSched.dataset.editSched);
    if (s) {
      state.schedDraft = { ...s, amount: String(s.amount) };
      go("sheet/schedule-edit");
    }
    return;
  }
  const sdDir = t.closest("[data-sd-dir]");
  if (sdDir) {
    state.schedDraft.direction = sdDir.dataset.sdDir;
    state.schedDraft.category = state.schedDraft.direction === "income" ? "Salary" : "Bills";
    renderSheet();
    return;
  }
  const sdWal = t.closest("[data-sd-wallet]");
  if (sdWal) { state.schedDraft.wallet = sdWal.dataset.sdWallet; renderSheet(); return; }
  if (t.closest("#sd-reminder")) { state.schedDraft.reminder = !state.schedDraft.reminder; renderSheet(); return; }
  if (t.closest("#btn-save-sched")) {
    const d = state.schedDraft;
    const titleVal = document.getElementById("sd-title").value.trim();
    const amtVal = parseFloat(document.getElementById("sd-amt").value) || 0;
    if (!titleVal || amtVal <= 0) { showToast("Enter name and amount"); return; }
    const obj = {
      id: d.id || "s" + Date.now().toString(36),
      title: titleVal,
      amount: amtVal,
      direction: d.direction,
      category: document.getElementById("sd-cat").value,
      wallet: d.wallet,
      due: document.getElementById("sd-due").value || "2026-12-01",
      repeat: document.getElementById("sd-rep").value,
      reminder: d.reminder,
    };
    const idx = SCHEDULES.findIndex((x) => x.id === obj.id);
    if (idx >= 0) SCHEDULES[idx] = obj;
    else SCHEDULES.push(obj);
    showToast("Schedule saved");
    go("sheet/schedules");
    return;
  }

  // Budgets
  const mbPre = t.closest("[data-mb-preset]");
  if (mbPre) {
    const inp = document.getElementById("mb-input");
    if (inp) inp.value = mbPre.dataset.mbPreset;
    return;
  }
  if (t.closest("#btn-save-mb")) {
    const val = parseFloat(document.getElementById("mb-input").value);
    if (val > 0) state.monthlyBudget = val;
    showToast("Monthly budget updated");
    closeSheet();
    return;
  }
  if (t.closest("#btn-save-cb")) {
    const cat = document.getElementById("cb-cat").value;
    const val = parseFloat(document.getElementById("cb-amt").value);
    if (val > 0) CATEGORY_LIMITS[cat] = val;
    showToast(`${cat} limit saved`);
    closeSheet();
    return;
  }
  if (t.closest("#btn-remove-cb")) {
    const cat = document.getElementById("cb-cat").value;
    delete CATEGORY_LIMITS[cat];
    showToast(`${cat} limit removed`);
    closeSheet();
    return;
  }

  // Favorites sheet
  const delFav = t.closest("[data-del-fav]");
  if (delFav) {
    const idx = FAVORITES.findIndex((f) => f.id === delFav.dataset.delFav);
    if (idx >= 0) FAVORITES.splice(idx, 1);
    showToast("Favorite removed");
    renderSheet();
    return;
  }
  if (t.closest("#btn-add-fav")) {
    const name = document.getElementById("fv-name").value.trim();
    const cat = document.getElementById("fv-cat").value;
    const amt = parseFloat(document.getElementById("fv-amt").value);
    if (!name) { showToast("Enter favorite label"); return; }
    FAVORITES.push({
      id: "f" + Date.now().toString(36),
      name,
      direction: "expense",
      category: cat,
      wallet: WALLETS[0]?.id || "gcash",
      defaultAmount: isNaN(amt) ? null : amt,
    });
    state.favDraft = null;
    showToast("Favorite added!");
    renderSheet();
    return;
  }

  // Profile sheet
  if (t.closest("#btn-save-profile")) {
    const fn = document.getElementById("pr-name").value.trim();
    const em = document.getElementById("pr-email").value.trim();
    if (fn) {
      PROFILE.fullName = fn;
      PROFILE.firstName = fn.split(/\s+/)[0];
      PROFILE.initials = fn.split(/\s+/).slice(0, 2).map((s) => s[0].toUpperCase()).join("");
    }
    if (em) PROFILE.email = em;
    showToast("Pitaka ID updated");
    closeSheet();
    return;
  }

  // Change PIN sheet
  const cpin = t.closest("[data-cpin-key]");
  if (cpin) {
    const pd = state.pinDraft;
    if (pd.buf.length < 4) {
      pd.buf += cpin.dataset.cpinKey;
      renderSheet();
      if (pd.buf.length === 4) {
        setTimeout(() => {
          if (pd.step === "current") {
            pd.firstPin = pd.buf;
            pd.buf = "";
            pd.step = "confirm";
            renderSheet();
          } else {
            if (pd.buf === pd.firstPin) {
              state.pinCode = pd.buf;
              state.appLockEnabled = true;
              showToast(`PIN updated to ${state.pinCode}`);
              closeSheet();
            } else {
              pd.buf = "";
              pd.step = "current";
              showToast("PINs did not match, try again");
              renderSheet();
            }
          }
        }, 160);
      }
    }
    return;
  }
  if (t.closest("[data-cpin-back]")) {
    state.pinDraft.buf = state.pinDraft.buf.slice(0, -1);
    renderSheet();
    return;
  }
  if (t.closest("[data-cpin-clear]")) {
    state.pinDraft.buf = "";
    renderSheet();
    return;
  }
  if (t.closest("#btn-disable-pin")) {
    state.appLockEnabled = false;
    showToast("App lock disabled");
    closeSheet();
    return;
  }

  // Search sheet quick command
  const qcmd = t.closest("[data-quick-cmd]");
  if (qcmd) {
    if (qcmd.dataset.quickCmd === "toggle-theme") {
      state.theme = state.theme === "dark" ? "light" : "dark";
      showToast(`Theme: ${state.theme}`);
      closeSheet();
    }
    return;
  }
});

// Live input & form listeners
document.addEventListener("input", (e) => {
  if (e.target.id === "ledger-search-input") {
    state.ledgerSearch = e.target.value;
    const pos = e.target.selectionStart;
    renderApp();
    const el = document.getElementById("ledger-search-input");
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  } else if (e.target.id === "global-search-input") {
    state.searchQuery = e.target.value;
    const pos = e.target.selectionStart;
    renderSheet();
    const el = document.getElementById("global-search-input");
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  } else if (e.target.id === "aw-search") {
    state.addWalletDraft.search = e.target.value;
    const pos = e.target.selectionStart;
    renderSheet();
    const el = document.getElementById("aw-search");
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "ledger-wallet-select") {
    state.ledgerWallet = e.target.value;
    state.ledgerLimit = 12;
    renderApp();
  } else if (e.target.id === "cb-cat") {
    go(`sheet/category-budget/${encodeURIComponent(e.target.value)}`);
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id === "auth-form") {
    e.preventDefault();
    const nm = document.getElementById("auth-name");
    const em = document.getElementById("auth-email");
    if (nm && nm.value.trim()) {
      PROFILE.fullName = nm.value.trim();
      PROFILE.firstName = PROFILE.fullName.split(/\s+/)[0];
      PROFILE.initials = PROFILE.fullName.split(/\s+/).slice(0, 2).map((s) => s[0].toUpperCase()).join("");
    }
    if (em && em.value.trim()) PROFILE.email = em.value.trim();
    state.signedIn = true;
    PROFILE.lastSyncedAt = "Just now";
    showToast("Signed in & synced!");
    go("settings");
  }
});

// Keyboard accessibility for ticket cards & Escape key
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.sheet) closeSheet();
    else if (state.plusOpen) { state.plusOpen = false; renderNav(); }
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-go]")) {
    e.preventDefault();
    go(e.target.dataset.go);
  }
});

window.addEventListener("hashchange", handleHash);
handleHash();
</script>
</body>
</html>
